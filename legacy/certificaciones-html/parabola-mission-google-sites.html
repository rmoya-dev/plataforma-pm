<meta charset="utf-8">
<title>Domina la Parábola</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F7F4FB;
  --surface:#FFFFFF;
  --surface-2:#EFE6F8;
  --ink:#1E1230;
  --ink-soft:#5B4E70;
  --ink-faint:#93869F;
  --line:#E1D3F0;
  --accent:#6802C1;
  --accent-2:#9B3FE0;
  --accent-ink:#FFFFFF;
  --accent-soft:#F1E3FB;
  --gold:#B9791E;
  --gold-soft:#F6E7CC;
  --danger:#A83B2E;
  --danger-soft:#F3DAD3;
  --ok:#1E7A4C;
  --ok-soft:#DCEFE1;
  --formula:#C8102E;
  --formula-soft:#FDE9EC;
  --shadow:0 1px 2px rgba(43,4,80,.08), 0 10px 28px -14px rgba(43,4,80,.32);
  --r-s:8px; --r-m:14px; --r-l:24px;
  --font-display:'Sora', 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-body:'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --font-type:'Special Elite', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#160C24; --surface:#20132F; --surface-2:#2A1A3D; --ink:#F1E9FA; --ink-soft:#BCA9D4;
    --ink-faint:#7C6A93; --line:#3B2650; --accent:#C89BFA; --accent-2:#B77CF2; --accent-ink:#22093D; --accent-soft:#33204A;
    --gold:#EFB85E; --gold-soft:#3A2C15; --danger:#FF9683; --danger-soft:#3B2119; --ok:#5FD394; --ok-soft:#123023;
    --formula:#FF8FA3; --formula-soft:#3A1A24;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#160C24; --surface:#20132F; --surface-2:#2A1A3D; --ink:#F1E9FA; --ink-soft:#BCA9D4;
  --ink-faint:#7C6A93; --line:#3B2650; --accent:#C89BFA; --accent-2:#B77CF2; --accent-ink:#22093D; --accent-soft:#33204A;
  --gold:#EFB85E; --gold-soft:#3A2C15; --danger:#FF9683; --danger-soft:#3B2119; --ok:#5FD394; --ok-soft:#123023;
  --formula:#FF8FA3; --formula-soft:#3A1A24;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding:0 16px;
}
@media (max-width:640px){
  body{ font-size:18px; }
  .btn{ padding:.62em 1.2em; }
  .btn.sm{ padding:.5em 1em; }
  input[type=text], select, .register-wrap input[type=text], .register-wrap select{ font-size:1.05rem; padding:12px 14px; }
  .choice{ padding:14px 16px; }
}
h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance; margin:0 0 .4em; font-weight:700; color:var(--ink);}
p{margin:0 0 1em; max-width:65ch;}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:4px;}
.mono{font-family:var(--font-mono);}
.eq{font-family:var(--font-mono); font-size:1.05em; letter-spacing:.01em;}
img,.canvas-wrap{max-width:100%;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

/* ============ SHELL ============ */
#shell{max-width:1180px; margin:0 auto; padding-block:20px 64px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:12px 18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m);
  box-shadow:var(--shadow); margin-bottom:22px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.brand .mark{font-family:var(--font-display); font-weight:700; font-size:1.2rem;}
.brand .course{color:var(--ink-faint); font-size:.89rem; letter-spacing:.03em; text-transform:uppercase;}
.topnav{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.dot-track{display:flex; gap:6px; align-items:center;}
.dot{
  width:11px; height:11px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line);
  display:inline-block; transition:background .25s, transform .25s;
}
.dot.done{background:var(--ok); border-color:var(--ok);}
.dot.current{background:var(--accent); border-color:var(--accent); transform:scale(1.25);}
.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px;
  padding:.5em 1.1em; font-size:.99rem; font-weight:600; transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{border-color:var(--accent); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.ghost{background:transparent;}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none;}
.btn.sm{padding:.38em .85em; font-size:.89rem;}
.student-tag{font-size:.92rem; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
.student-tag button{background:none; border:none; color:var(--accent); font-size:.92rem; font-weight:600; padding:0; cursor:pointer; text-decoration:underline;}
.register-wrap{max-width:520px; margin:40px auto; background:var(--surface); border:1px solid var(--line); border-top:5px solid var(--accent); border-radius:var(--r-l); box-shadow:var(--shadow); padding:32px 28px;}
.register-icon{
  width:56px; height:56px; border-radius:18px; display:flex; align-items:center; justify-content:center; margin-bottom:16px;
  background:linear-gradient(155deg, var(--accent), var(--accent-2)); color:var(--accent-ink); box-shadow:var(--shadow);
}
.register-icon svg{width:30px; height:30px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.register-wrap h1{font-size:1.55rem;}
.register-wrap label{display:block; font-weight:600; font-size:.97rem; margin:16px 0 6px;}
.register-wrap input[type=text], .register-wrap select{
  width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:var(--r-s);
  background:var(--surface); color:var(--ink); font-size:1.07rem; font-family:inherit;
}
.register-wrap input[type=text]:focus, .register-wrap select:focus{ border-color:var(--accent); }

/* ============ MAP SCREEN ============ */
.hero{
  padding:32px 26px; margin-bottom:22px; border-radius:var(--r-l); position:relative; overflow:hidden;
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); box-shadow:var(--shadow);
  display:flex; align-items:center; gap:26px; flex-wrap:wrap;
}
.hero::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(circle at 88% 12%, rgba(255,255,255,.18) 0, transparent 42%),
                    radial-gradient(circle at 6% 92%, rgba(255,255,255,.12) 0, transparent 38%);
}
.hero-text{position:relative; z-index:1; flex:1 1 320px; min-width:0;}
.hero .eyebrow{
  font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.12em; font-size:.9rem;
  color:rgba(255,255,255,.88); font-weight:600; margin-bottom:10px; display:block;
}
.hero h1{font-size:clamp(1.7rem,3.6vw,2.6rem); max-width:16ch; color:#fff;}
.hero p.lead{font-size:1.1rem; color:rgba(255,255,255,.92); max-width:62ch;}
.hero-art{position:relative; z-index:1; flex:none; width:120px; height:120px; color:rgba(255,255,255,.95);}
.hero-art svg{width:100%; height:100%; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
@media (max-width:640px){ .hero-art{display:none;} .hero{padding:26px 20px;} }

.map-wrap{
  background:linear-gradient(180deg, var(--surface) 0%, var(--accent-soft) 130%);
  border:1px solid var(--line); border-radius:var(--r-l);
  box-shadow:var(--shadow); padding:30px 18px 44px; overflow:hidden;
}
.map-inner{position:relative;}
.map-svg{width:100%; height:auto; display:block;}
.node-btn{
  position:absolute; transform:translate(-50%,-50%); width:118px; text-align:center; background:none; border:none; padding:0;
}
.node-circle{
  width:66px; height:66px; border-radius:22px; margin:0 auto 8px; position:relative;
  background:linear-gradient(155deg, var(--surface), var(--accent-soft));
  border:2.5px solid var(--line); display:flex; align-items:center; justify-content:center;
  color:var(--ink-faint); box-shadow:var(--shadow);
  transition:transform .18s, border-color .18s, color .18s, background .18s, box-shadow .18s;
}
.node-circle svg{width:30px; height:30px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.node-circle .node-num{
  position:absolute; top:-8px; left:-8px; width:22px; height:22px; border-radius:50%;
  background:var(--surface); border:2px solid var(--line); color:var(--ink-soft);
  font-family:var(--font-mono); font-weight:700; font-size:.72rem; display:flex; align-items:center; justify-content:center;
}
.node-btn:hover .node-circle{transform:translateY(-4px) scale(1.05); border-color:var(--accent); color:var(--accent); box-shadow:0 10px 22px -10px rgba(104,2,193,.45);}
.node-btn.done .node-circle{background:linear-gradient(155deg, var(--ok-soft), var(--surface)); border-color:var(--ok); color:var(--ok);}
.node-btn.done .node-circle .node-num{background:var(--ok); border-color:var(--ok); color:var(--accent-ink);}
.node-btn.current .node-circle{background:linear-gradient(155deg, var(--accent), var(--accent-2)); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 10px 24px -10px rgba(104,2,193,.55);}
.node-btn.current .node-circle .node-num{background:var(--accent-ink); border-color:var(--accent); color:var(--accent);}
.node-btn.locked{cursor:not-allowed;}
.node-btn.locked .node-circle{color:var(--ink-faint); opacity:.5; background:var(--surface);}
.node-btn.locked:hover .node-circle{transform:none; border-color:var(--line); color:var(--ink-faint); box-shadow:var(--shadow);}
.node-label{font-size:1rem; font-weight:700; color:var(--ink); line-height:1.25;}
.node-sub{font-size:.92rem; color:var(--ink-faint); margin-top:1px;}
.node-mini-bar{width:100%; max-width:90px; height:5px; border-radius:99px; background:var(--surface-2); margin:6px auto 0; overflow:hidden;}
.node-mini-bar > span{display:block; height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:99px;}
.phase-tile .node-mini-bar{margin:6px 0 0;}
.map-list{display:none; flex-direction:column; gap:12px;}
@media (max-width:639px){ .map-curvy{display:none;} .map-list{display:flex;} }
.phase-tile{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  background:var(--surface); border:1.5px solid var(--line); border-left:5px solid var(--accent); border-radius:var(--r-m);
  padding:14px 16px; box-shadow:var(--shadow); transition:transform .15s, box-shadow .15s;
}
.phase-tile:hover{transform:translateY(-2px); box-shadow:0 12px 24px -12px rgba(104,2,193,.35);}
.phase-tile.done{border-left-color:var(--ok);}
.phase-tile.locked{border-left-color:var(--line);}
.phase-tile .node-circle{margin:0; flex:none;}
.phase-tile .tile-text{flex:1; min-width:0;}
.phase-tile .tile-text .node-label{font-size:1.05rem;}
.phase-tile .tile-text .node-sub{font-size:.92rem; margin-top:2px;}
.phase-tile .chev{color:var(--accent); font-size:1.3rem; flex:none;}
.phase-tile.locked{opacity:.6;}
.phase-tile.locked .chev{color:var(--ink-faint);}
.phase-tile.locked:hover{transform:none; box-shadow:var(--shadow);}

/* ============ PHASE CHROME ============ */
.phase-head{margin-bottom:18px;}
.phase-head-row{display:flex; align-items:center; gap:14px; margin-bottom:4px;}
.phase-head-icon{
  flex:none; width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(155deg, var(--accent), var(--accent-2)); color:var(--accent-ink); box-shadow:var(--shadow);
}
.phase-head-icon svg{width:28px; height:28px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.phase-head .eyebrow{font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.1em; font-size:.88rem; font-weight:600;}
.phase-head h2{font-size:clamp(1.4rem,2.6vw,1.9rem); margin:0;}
.workspace{
  display:grid; grid-template-columns:280px 1fr 260px; gap:16px; align-items:start;
}
@media (max-width:900px){ .workspace{grid-template-columns:1fr;} }
.two-col{display:grid; grid-template-columns:1.15fr 1fr; gap:16px; align-items:start;}
@media (max-width:820px){ .two-col{grid-template-columns:1fr;} }
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:16px;
  box-shadow:var(--shadow);
}
.panel h3{font-size:1.05rem; margin-bottom:12px;}
.field{margin-bottom:14px;}
.field label{display:flex; justify-content:space-between; font-size:.92rem; font-weight:600; margin-bottom:6px;}
.field label .val{font-family:var(--font-mono); color:var(--accent); font-weight:700;}
input[type=range]{width:100%; accent-color:var(--accent);}
.info-row{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:.99rem;}
.info-row:last-child{border-bottom:none;}
.info-row .k{color:var(--ink-soft);}
.info-row .v{font-family:var(--font-mono); font-weight:700; text-align:right;}
.badge{display:inline-block; padding:.28em .75em; border-radius:999px; font-size:.88rem; font-weight:700; letter-spacing:.02em;}
.badge.up{background:var(--ok-soft); color:var(--ok);}
.badge.down{background:var(--danger-soft); color:var(--danger);}

.canvas-panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); box-shadow:var(--shadow); padding:10px; position:relative;}
canvas{display:block; width:100%; height:auto; border-radius:var(--r-s); cursor:crosshair;}

.mission-card{
  border:1.5px solid var(--line); border-radius:var(--r-m); padding:14px 16px; margin-top:14px; background:var(--surface-2);
}
.mission-card.active{border-color:var(--accent); background:var(--accent-soft);}
.mission-card.solved{border-color:var(--ok); background:var(--ok-soft);}
.mission-card h4{font-size:1.02rem; margin-bottom:6px; display:flex; gap:8px; align-items:center;}
.mission-card p{font-size:.97rem; color:var(--ink-soft); margin-bottom:10px;}
.feedback{
  margin-top:10px; padding:10px 12px; border-radius:var(--r-s); font-size:.97rem; font-weight:600; display:none;
}
.feedback.show{display:block;}
.feedback.ok{background:var(--ok-soft); color:var(--ok);}
.feedback.bad{background:var(--danger-soft); color:var(--danger);}

table.datatable{width:100%; border-collapse:collapse; font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
table.datatable th,table.datatable td{border:1px solid var(--line); padding:8px 10px; text-align:center;}
table.datatable th{background:var(--surface-2); font-family:var(--font-body); font-weight:700;}
table.datatable td.sym{background:var(--accent-soft); font-weight:700;}

.choice-grid{display:grid; gap:10px; margin-top:12px;}
.choice{
  text-align:left; border:1.5px solid var(--line); background:var(--surface); border-radius:var(--r-s);
  padding:12px 14px; font-size:1.01rem; transition:border-color .15s, background .15s;
}
.choice:hover{border-color:var(--accent);}
.choice.correct{border-color:var(--ok); background:var(--ok-soft);}
.choice.incorrect{border-color:var(--danger); background:var(--danger-soft);}
.choice[disabled]{cursor:default;}

.stepper{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.stepper span{
  font-size:.84rem; font-weight:700; padding:.3em .7em; border-radius:999px; background:var(--surface-2); color:var(--ink-faint);
}
.stepper span.on{background:var(--accent); color:var(--accent-ink);}
.stepper button.step-pill{
  font:inherit; font-size:.84rem; font-weight:700; padding:.3em .7em; border-radius:999px; border:none;
  background:var(--surface-2); color:var(--ink-faint); cursor:pointer; transition:background .15s,color .15s;
}
.stepper button.step-pill.done:not(.on){background:var(--ok-soft); color:var(--ok);}
.stepper button.step-pill.on{background:var(--accent); color:var(--accent-ink);}
.stepper button.step-pill[disabled]{cursor:not-allowed; opacity:.55;}
.step-nav{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:18px; flex-wrap:wrap;}

.reveal-box{border-left:3px solid var(--gold); background:var(--gold-soft); padding:12px 14px; border-radius:0 var(--r-s) var(--r-s) 0; margin:14px 0; font-size:1rem;}
.reveal-box .katex-display{margin:.3em 0;}
.tex-block{overflow-x:auto; padding:2px 0;}
.tex-block .katex-display{margin:.4em 0;}
.katex{color:inherit;}

/* ---- Fórmula clave: callout didáctico tipo texto escolar ---- */
.formula-callout{
  border:2px solid var(--formula); background:var(--formula-soft);
  border-radius:var(--r-m); padding:18px 20px 16px; margin:18px 0;
  position:relative; overflow-x:auto; box-shadow:0 4px 14px -8px rgba(200,16,46,.35);
}
.formula-callout .fc-tag{
  display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-weight:700;
  font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--formula); margin-bottom:8px;
}
.formula-callout .fc-tag svg{width:16px; height:16px; flex:none;}
.formula-callout .katex-display{margin:.25em 0; font-size:1.32em;}
.formula-callout .katex{color:var(--formula);}

/* ============ DETECTIVE MODE ============ */
.dossier{
  background:
    linear-gradient(var(--surface-2), var(--surface-2));
  border:1px solid var(--line); border-radius:var(--r-m); box-shadow:var(--shadow);
  padding:22px 22px 26px; position:relative; overflow:hidden;
}
.dossier::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 28px);
}
.case-tag{
  font-family:var(--font-type); font-size:.89rem; letter-spacing:.04em; color:var(--danger);
  border:2px solid var(--danger); display:inline-block; padding:.15em .6em; border-radius:3px;
  transform:rotate(-2deg); margin-bottom:10px;
}
.dossier h3{font-family:var(--font-type); font-size:1.2rem; letter-spacing:.01em;}
.claim-box{
  font-family:var(--font-type); background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--danger);
  padding:14px 16px; border-radius:0 var(--r-s) var(--r-s) 0; margin:14px 0; font-size:1.07rem; position:relative; z-index:1;
}
.stamp{
  position:absolute; top:14px; right:18px; font-family:var(--font-type); font-size:1.45rem; color:var(--ok);
  border:3px solid var(--ok); padding:2px 10px; border-radius:6px; transform:rotate(8deg); opacity:0;
  transition:opacity .3s, transform .3s;
}
.stamp.show{opacity:.85; transform:rotate(8deg) scale(1);}
.stamp.wrong{color:var(--danger); border-color:var(--danger);}

.progress-note{font-size:.89rem; color:var(--ink-faint); margin-top:6px;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:18px 0;}
.stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:14px 16px; box-shadow:var(--shadow);}
.stat-tile .num{font-family:var(--font-mono); font-size:1.75rem; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums;}
.stat-tile .lbl{font-size:.92rem; color:var(--ink-soft); margin-top:2px;}
.cert-card{
  position:relative; background:var(--surface); border:2px solid var(--gold); border-radius:var(--r-l);
  padding:44px 32px; margin-top:22px; box-shadow:var(--shadow); text-align:center; overflow:hidden;
}
.cert-card::before{content:""; position:absolute; inset:9px; border:1px solid var(--gold); opacity:.55; border-radius:calc(var(--r-l) - 6px); pointer-events:none;}
.cert-inner{position:relative; z-index:1;}
.cert-seal{
  width:60px; height:60px; margin:0 auto 14px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(155deg, var(--accent), var(--accent-2)); color:#fff; box-shadow:var(--shadow);
}
.cert-seal svg{width:32px; height:32px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.cert-eyebrow{font-family:var(--font-mono); letter-spacing:.14em; text-transform:uppercase; font-size:.88rem; color:var(--gold); font-weight:700;}

<script>
(function(){
"use strict";

var PHASE_ICONS = {

var PHASES = [
  {id:1, key:"experimenta", label:"Experimenta", sub:"Construye y descubre"},
  {id:2, key:"comprueba",   label:"Comprueba",   sub:"Tabulación"},
  {id:3, key:"calcula",     label:"Calcula",     sub:"El vértice"},
  {id:4, key:"interpreta",  label:"Interpreta",  sub:"Derecho y Psicología"},
  {id:5, key:"investiga",   label:"Investiga",   sub:"Detective matemático"},

var STORAGE_KEY = "parabola-mission-progress-v1";
function loadProgress(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
var progress = loadProgress();
function markSolved(phaseKey, missionKey){
  if(!progress[phaseKey]) progress[phaseKey] = {};
  progress[phaseKey][missionKey] = true;
  saveProgress();
  maybeStampCompletion();
  syncSaveToSheet();
  renderTopbar();
}
function isSolved(phaseKey, missionKey){
  return !!(progress[phaseKey] && progress[phaseKey][missionKey]);
}
function phaseCompleteCount(phaseKey, total){
  var p = progress[phaseKey] || {};
  var n = 0;
  for(var k in p){ if(k.charAt(0)!=="_" && p[k]) n++; }
  return Math.min(n, total);
}
function phaseDone(phaseKey, total){
  return phaseCompleteCount(phaseKey, total) >= total;
}
var MISSION_TOTALS = {experimenta:6, comprueba:2, calcula:2, interpreta:6, investiga:8, desafio:6, aplica:6};
function totalMissions(){
  var n=0; for(var k in MISSION_TOTALS) n+=MISSION_TOTALS[k]; return n;
}
function allPhasesDone(){
  return PHASES.every(function(ph){ return phaseDone(ph.key, MISSION_TOTALS[ph.key]); });
}

/* ---- Respaldo en la nube (opcional, vía Google Sheets + Apps Script) ----
   Si tu profesor(a) configuró un backend de respaldo, pega aquí la URL de tu
   Apps Script Web App (termina en /exec). Si se deja como está, la app
   funciona igual que siempre, solo que sin respaldo en la nube: el progreso
   queda únicamente en este navegador. */
var SHEET_API_URL = "PEGA_AQUI_TU_URL_DE_APPS_SCRIPT";
function sheetSyncConfigured(){
  return typeof SHEET_API_URL === "string" && SHEET_API_URL.indexOf("https://") === 0;
}
function mergeRemoteProgress(remote){
  if(!remote || typeof remote !== "object") return false;
  var changed = false;
  for(var phaseKey in remote){
    if(!remote[phaseKey] || typeof remote[phaseKey] !== "object") continue;
    if(!progress[phaseKey]) progress[phaseKey] = {};
    for(var missionKey in remote[phaseKey]){
      if(remote[phaseKey][missionKey] && !progress[phaseKey][missionKey]){
        progress[phaseKey][missionKey] = true;
        changed = true;
      }
    }
  }
  return changed;
}
function syncSaveToSheet(){
  if(!sheetSyncConfigured() || !student) return;
  try{
    fetch(SHEET_API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({
        action: "save",
        nombre: student.name,
        carrera: student.carrera,
        progreso: progress,
        completadoEn: getCompletedAt() || ""
      })
    }).catch(function(){ /* sin conexión: el progreso local ya quedó guardado */ });
  }catch(e){}
}
function syncLoadFromSheet(name, carrera, done){
  if(!sheetSyncConfigured()){ done(); return; }
  var finished = false;
  function finish(){ if(finished) return; finished = true; done(); }
  try{
    fetch(SHEET_API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({action:"load", nombre:name, carrera:carrera})
    }).then(function(r){ return r.json(); }).then(function(data){
      if(data && data.found && data.progreso){
        mergeRemoteProgress(data.progreso);
        saveProgress();
        if(data.completadoEn){
          try{ localStorage.setItem(COMPLETED_KEY, data.completadoEn); }catch(e){}
        }
      }
      finish();
    }).catch(function(){ finish(); });
  }catch(e){ finish(); }
  setTimeout(finish, 4000); // nunca dejamos al estudiante esperando de más
}

function loadStudent(){
  try{
    var raw = localStorage.getItem(STUDENT_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function saveStudent(s){

}

/* ---- Fecha de finalización ---- */
var COMPLETED_KEY = "parabola-mission-completed-v1";
function getCompletedAt(){
  try{ return localStorage.getItem(COMPLETED_KEY); }catch(e){ return null; }
}
function maybeStampCompletion(){
  if(allPhasesDone() && !getCompletedAt()){
    try{ localStorage.setItem(COMPLETED_KEY, new Date().toISOString()); }catch(e){}
  }
}

var route = "map";
function goTo(r){ route = r; render(); window.scrollTo({top:0, behavior:"smooth"}); }

/* ============================================================
   MATEMÁTICA
============================================================ */
function vertexOf(a,b,c){
  var h = -b/(2*a);
  var k = a*h*h + b*h + c;
  return {h:h, k:k};
}
function evalQuad(a,b,c,x){ return a*x*x + b*x + c; }
function fmt(n, d){
  if(d===undefined) d = 2;
  if(Math.abs(n) < 1e-9) n = 0;
  var r = Math.round(n * Math.pow(10,d)) / Math.pow(10,d);
  if(Number.isInteger(r)) return String(r);
  return String(r);
}
/* ---- LaTeX (KaTeX) helpers ---- */
function K(tex){
  try{ return katex.renderToString(tex, {throwOnError:false, output:"htmlAndMathml", strict:false}); }
  catch(e){ return "<span>"+tex+"</span>"; }
}
function KB(tex){
  try{ return katex.renderToString(tex, {throwOnError:false, output:"htmlAndMathml", strict:false, displayMode:true}); }
  catch(e){ return "<span>"+tex+"</span>"; }
}
var ICON_STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.9l-5.8 3.3 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>';
function formulaCallout(tex, label){
  return '<div class="formula-callout"><div class="fc-tag">'+ICON_STAR+'<span>'+(label||"Fórmula clave")+'</span></div>'+KB("\\boldsymbol{"+tex+"}")+'</div>';
}
function eqTex(a,b,c){
  var s = "y=";
  s += (a===1?"":(a===-1?"-":fmt(a))) + "x^2";
  if(b !== 0) s += (b>0? "+" : "-") + fmt(Math.abs(b)) + "x";
  if(c !== 0) s += (c>0? "+" : "-") + fmt(Math.abs(c));
  return s;
}
function vertexTex(h,k){ return "\\left("+fmt(h)+",\\ "+fmt(k)+"\\right)"; }
function eqVertexFormTex(a,h,k){
  var s = "y=";
  s += (a===1?"":(a===-1?"-":fmt(a)));
  s += "(x"+(h>=0? "-"+fmt(h) : "+"+fmt(Math.abs(h)))+")^2";
  if(k !== 0) s += (k>0? "+" : "-") + fmt(Math.abs(k));
  return s;
}

/* ============================================================
   MOTOR DE GRÁFICA (canvas)
============================================================ */
function ParabolaGraph(canvas, opts){
  opts = opts || {};
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var xMin = opts.xMin!==undefined?opts.xMin:-8, xMax = opts.xMax!==undefined?opts.xMax:8;
  var yMin = opts.yMin!==undefined?opts.yMin:-8, yMax = opts.yMax!==undefined?opts.yMax:8;
  var cssW = 0, cssH = 0;
  var current = {a:opts.a||1, b:opts.b||0, c:opts.c||0};
  var target = {a:current.a, b:current.b, c:current.c};
  var showVertex = !!opts.showVertex;
  var showAxis = !!opts.showAxis;
  var showPoints = opts.points || null; // array of {x,y,label,color}
  var guessPoint = null; // {x,y} in data space, for click-to-guess
  var onGuess = opts.onGuess || null;
  var raf = null;

  function resize(){
    var rect = canvas.getBoundingClientRect();
    cssW = rect.width || opts.width || 320;
    cssH = opts.aspect ? cssW*opts.aspect : (opts.height || cssW*0.72);
    canvas.width = Math.round(cssW*dpr);
    canvas.height = Math.round(cssH*dpr);
    canvas.style.height = cssH+"px";
    draw();
  }
  function sx(x){ return (x - xMin) / (xMax - xMin) * cssW; }
  function sy(y){ return cssH - (y - yMin) / (yMax - yMin) * cssH; }
  function css(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    var lineColor = css('--line'), ink = css('--ink'), inkFaint = css('--ink-faint');
    var accent = css('--accent'), gold = css('--gold'), danger = css('--danger');
    // grid
    ctx.lineWidth = 1;
    ctx.strokeStyle = lineColor;
    ctx.beginPath();
    for(var gx = Math.ceil(xMin); gx <= xMax; gx++){
      ctx.moveTo(sx(gx)+.5, 0); ctx.lineTo(sx(gx)+.5, cssH);
    }
    for(var gy = Math.ceil(yMin); gy <= yMax; gy++){
      ctx.moveTo(0, sy(gy)+.5); ctx.lineTo(cssW, sy(gy)+.5);
    }
    ctx.stroke();
    // axes
    ctx.strokeStyle = inkFaint;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(0, sy(0)); ctx.lineTo(cssW, sy(0));
    ctx.moveTo(sx(0), 0); ctx.lineTo(sx(0), cssH);
    ctx.stroke();
    ctx.fillStyle = inkFaint;
    ctx.font = "11px "+ (css('--font-mono')||'monospace');
    for(var lx = Math.ceil(xMin); lx <= xMax; lx++){
      if(lx===0) continue;
      var lxPos = sx(lx);
      if(lxPos < 8 || lxPos > cssW-8) continue;
      var labelY = sy(0)+13;
      labelY = Math.max(12, Math.min(cssH-4, labelY));
      ctx.fillText(String(lx), lxPos-3, labelY);
    }
    for(var ly = Math.ceil(yMin); ly <= yMax; ly++){
      if(ly===0) continue;
      var lyPos = sy(ly);
      if(lyPos < 10 || lyPos > cssH-6) continue;
      var labelX = sx(0)+4;
      labelX = Math.max(2, Math.min(cssW-16, labelX));
      ctx.fillText(String(ly), labelX, lyPos+3);
    }

    var a=current.a, b=current.b, c=current.c;
    var v = vertexOf(a,b,c);

    // axis of symmetry
    if(showAxis){
      ctx.save();
      ctx.strokeStyle = gold; ctx.setLineDash([5,5]); ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(sx(v.h), 0); ctx.lineTo(sx(v.h), cssH); ctx.stroke();
      ctx.restore();
    }

    // curve
    ctx.strokeStyle = accent;
    ctx.lineWidth = 3;
    ctx.beginPath();
    var started = false;
    var steps = 240;
    for(var i=0;i<=steps;i++){
      var x = xMin + (xMax-xMin)*i/steps;
      var y = evalQuad(a,b,c,x);
      var px = sx(x), py = sy(y);
      if(py < -4000 || py > 8000){ started=false; continue; }
      if(!started){ ctx.moveTo(px,py); started=true; } else { ctx.lineTo(px,py); }
    }
    ctx.stroke();

    // extra points (table dots etc.)
    if(showPoints){
      showPoints.forEach(function(p){
        ctx.beginPath();
        ctx.arc(sx(p.x), sy(p.y), 5, 0, Math.PI*2);
        ctx.fillStyle = p.color || ink;
        ctx.fill();
        ctx.strokeStyle = css('--surface'); ctx.lineWidth=2; ctx.stroke();
      });
    }

    // vertex
    if(showVertex){
      ctx.beginPath();
      ctx.arc(sx(v.h), sy(v.k), 7, 0, Math.PI*2);
      ctx.fillStyle = gold;
      ctx.fill();
      ctx.strokeStyle = css('--surface'); ctx.lineWidth=2.5; ctx.stroke();
    }

    // guess marker
    if(guessPoint){
      ctx.beginPath();
      ctx.arc(sx(guessPoint.x), sy(guessPoint.y), 6, 0, Math.PI*2);
      ctx.strokeStyle = danger; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx(guessPoint.x)-8, sy(guessPoint.y)); ctx.lineTo(sx(guessPoint.x)+8, sy(guessPoint.y)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx(guessPoint.x), sy(guessPoint.y)-8); ctx.lineTo(sx(guessPoint.x), sy(guessPoint.y)+8); ctx.stroke();
    }
  }

  function animateTo(a,b,c){
    target = {a:a,b:b,c:c};
    var start = {a:current.a, b:current.b, c:current.c};
    var t0 = performance.now();
    var dur = 260;
    if(raf) cancelAnimationFrame(raf);
    function step(t){
      var p = Math.min(1, (t-t0)/dur);
      var e = 1 - Math.pow(1-p, 3);
      current = {
        a: start.a + (target.a-start.a)*e,
        b: start.b + (target.b-start.b)*e,
        c: start.c + (target.c-start.c)*e
      };
      draw();
      if(p<1){ raf = requestAnimationFrame(step); }
    }
    raf = requestAnimationFrame(step);
  }

  canvas.addEventListener("click", function(ev){
    if(!onGuess) return;
    var rect = canvas.getBoundingClientRect();
    var mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    var dx = xMin + (mx/cssW)*(xMax-xMin);
    var dy = yMin + ((cssH-my)/cssH)*(yMax-yMin);
    guessPoint = {x:dx, y:dy};
    draw();
    onGuess(dx,dy);
  });

  window.addEventListener("resize", resize);
  resize();

  return {
    set: function(a,b,c,animate){
      if(animate===false){ current={a:a,b:b,c:c}; target=current; draw(); }
      else animateTo(a,b,c);
    },
    setShowVertex: function(v){ showVertex = v; draw(); },
    setShowAxis: function(v){ showAxis = v; draw(); },
    setPoints: function(pts){ showPoints = pts; draw(); },
    clearGuess: function(){ guessPoint = null; draw(); },
    redraw: draw,
    getCurrent: function(){ return current; }
  };
}

/* ============================================================
   TOPBAR / DOTS
============================================================ */
function renderTopbar(){
  var track = document.getElementById("dotTrack");
  track.innerHTML = "";
  PHASES.forEach(function(ph){
    var d = document.createElement("span");
    var cls = "dot";
    if(phaseDone(ph.key, MISSION_TOTALS[ph.key])) cls += " done";
    if(route === "phase"+ph.id) cls += " current";
    d.className = cls;
    d.title = "Fase "+ph.id+": "+ph.label;
    track.appendChild(d);
  });
  var tag = document.getElementById("studentTag");
  if(student && student.name){
    tag.hidden = false;
    tag.innerHTML = "Hola, "+escapeHtml(student.name)+" <button type=\"button\" id=\"editStudentBtn\">editar</button>";
    document.getElementById("editStudentBtn").addEventListener("click", function(){ goTo("register"); });
  } else {
    tag.hidden = true;
  }
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
}
document.getElementById("btnMap").addEventListener("click", function(){ goTo(student ? "map" : "register"); });

/* ============================================================
   RENDER RAIZ
============================================================ */
function render(){
  var app = document.getElementById("app");
  if(!student && route !== "register"){ route = "register"; }
  renderTopbar();
  if(route === "register"){ app.innerHTML = ""; renderRegister(app); return; }
  if(route === "map"){ app.innerHTML = ""; renderMap(app); return; }
  if(route === "summary"){ app.innerHTML = ""; renderSummary(app); return; }
  var m = /^phase(\d)$/.exec(route);
  if(m){
    var n = m[1];
    app.innerHTML = "";
    var fn = PHASE_RENDERERS[n];
    if(typeof fn === "function") fn(app);
    else app.innerHTML = "<p>Fase en construcción.</p>";
  }
}

   REGISTRO DEL ESTUDIANTE
============================================================ */

  var isEdit = !!student;
  wrap.innerHTML =
    '<div class="register-icon"><svg viewBox="0 0 32 32"><path d="M2 12l14-6 14 6-14 6z"/><path d="M9 15.5v6c0 1.9 3.1 3.5 7 3.5s7-1.6 7-3.5v-6"/><path d="M28 12v8"/></svg></div>'+
    '<span class="eyebrow" style="color:var(--accent); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.1em; font-size:.88rem; font-weight:600;">Pensamiento Matemático</span>'+
    '<h1>'+(isEdit ? "Editar tus datos" : "Antes de empezar")+'</h1>'+

    '<label for="reg_carrera">Carrera</label>'+
    '<select id="reg_carrera">'+
      '<option value="Derecho"'+(student&&student.carrera==="Derecho"?" selected":"")+'>Derecho</option>'+
      '<option value="Psicología"'+(student&&student.carrera==="Psicología"?" selected":"")+'>Psicología</option>'+
      '<option value="Otra"'+(student&&student.carrera==="Otra"?" selected":"")+'>Otra carrera</option>'+
    '</select>'+
    '<div style="margin-top:20px;"><button class="btn primary" id="reg_submit" style="width:100%;">'+(isEdit?"Guardar cambios":"Comenzar la misión →")+'</button></div>'+

  app.appendChild(wrap);
  document.getElementById("reg_submit").addEventListener("click", function(){
    var name = document.getElementById("reg_name").value.trim();
    var carrera = document.getElementById("reg_carrera").value;
    var errEl = document.getElementById("reg_error");
    if(!name){
      errEl.style.display = "block";
      errEl.textContent = "Por favor escribe tu nombre para continuar.";
      return;
    }
    student = {name:name, carrera:carrera};
    saveStudent(student);
    if(sheetSyncConfigured()){
      var btn = document.getElementById("reg_submit");
      btn.disabled = true;
      btn.textContent = "Cargando tu progreso...";
    }
    syncLoadFromSheet(name, carrera, function(){
      goTo("map");
    });
  });
}

function renderMap(app){
  var hero = document.createElement("div");
  hero.className = "hero";
  hero.innerHTML =
    '<div class="hero-text">' +
    '<span class="eyebrow">Misión · Pensamiento Matemático</span>' +
    '<h1>Domina la Parábola</h1>' +
    '<p class="lead">Siete fases para pasar de mover controles a pensar como matemático: construye, tabula, calcula, interpreta casos de Derecho y Psicología, investiga errores ajenos, construye tu propia parábola desde cero y termina resolviendo casos integrales completos.</p>' +
    '</div>' +
    '<div class="hero-art"><svg viewBox="0 0 120 120"><path d="M4 100h112M12 8v104" opacity=".45"/><path d="M14 95C14 45 60 20 60 20s46 25 46 75" stroke-width="2.4"/><circle cx="60" cy="24" r="3.4" fill="currentColor" stroke="none"/></svg></div>';
  app.appendChild(hero);

  if(allPhasesDone()){
    var banner = el("div","mission-card solved");
    banner.style.marginBottom = "18px";
    banner.innerHTML = '<h4>🎓 Misión completa — tu constancia te espera</h4>'+
      '<p>Ya resolviste las siete fases. Ve tu resumen y descarga tu constancia con tu nombre.</p>'+
      '<button class="btn primary sm" id="map_summary">Ver resumen y constancia →</button>';
    app.appendChild(banner);
    banner.querySelector("#map_summary").addEventListener("click", function(){ goTo("summary"); });
  }

  var phaseInfo = PHASES.map(function(ph, i){
    var total = MISSION_TOTALS[ph.key];
    var done = phaseCompleteCount(ph.key, total);
    var complete = done >= total;
    return {ph:ph, total:total, done:done, complete:complete};
  });
  phaseInfo.forEach(function(info, i){
    var prevDone = i===0 ? true : phaseInfo[i-1].complete;
    info.locked = !prevDone && !info.complete && info.done===0;
  });

  var curvyOuter = document.createElement("div");
  curvyOuter.className = "map-curvy";
  app.appendChild(curvyOuter);

  var wrap = document.createElement("div");
  wrap.className = "map-wrap";
  var W = 1000, H = 360;
  var nodesXY = [];
  var n = PHASES.length;
  for(var i=0;i<n;i++){
    var t = i/(n-1); // 0..1
    var x = 70 + t*(W-140);
    var xu = (t-0.5)*2; // -1..1
    var y = H-70 - (1-xu*xu) * (H-160);
    nodesXY.push({x:x,y:y});
  }
  var pathD = "M "+nodesXY[0].x+" "+nodesXY[0].y+" ";
  for(i=1;i<n;i++){
    var prev = nodesXY[i-1], cur = nodesXY[i];
    var mx = (prev.x+cur.x)/2;
    pathD += "C "+mx+" "+prev.y+", "+mx+" "+cur.y+", "+cur.x+" "+cur.y+" ";
  }
  var CHECK_ICON = '<svg viewBox="0 0 32 32"><path d="M6 17l7 7 13-15"/></svg>';
  var LOCK_ICON = '<svg viewBox="0 0 32 32"><rect x="8" y="14" width="16" height="12" rx="2"/><path d="M11 14v-3a5 5 0 0 1 10 0v3"/></svg>';
  function nodeIconHTML(ph, complete, locked){
    if(complete) return CHECK_ICON;
    if(locked) return LOCK_ICON;
    return PHASE_ICONS[ph.id];
  }
  var inner = el("div","map-inner");
  inner.innerHTML = '<svg class="map-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' +
    '<defs><linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">' +
    '<stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--accent-2)"/>' +
    '</linearGradient></defs>' +
    '<path d="'+pathD+'" fill="none" stroke="url(#pathGrad)" stroke-width="4" stroke-dasharray="1 14" stroke-linecap="round" opacity=".55"/>' +
    '</svg>';
  wrap.appendChild(inner);

  phaseInfo.forEach(function(info, i){
    var ph=info.ph, done=info.done, total=info.total, complete=info.complete, locked=info.locked;
    var pct = Math.round(done/total*100);
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "node-btn" + (complete?" done":"") + (locked?" locked":"");
    btn.style.left = (nodesXY[i].x/W*100)+"%";
    btn.style.top = (nodesXY[i].y/H*100)+"%";
    btn.innerHTML = '<span class="node-circle">'+nodeIconHTML(ph,complete,locked)+'<span class="node-num">'+ph.id+'</span></span>' +
      '<div class="node-label">'+ph.label+'</div>' +
      '<div class="node-sub">'+ph.sub+' · '+done+'/'+total+'</div>' +
      '<div class="node-mini-bar"><span style="width:'+pct+'%"></span></div>';
    btn.disabled = locked;
    btn.addEventListener("click", function(){ goTo("phase"+ph.id); });
    inner.appendChild(btn);
  });
  curvyOuter.appendChild(wrap);

  var note = document.createElement("p");
  note.className = "progress-note";
  note.style.marginTop = "14px";
  note.textContent = "Tu progreso se guarda en este navegador. Completa una fase para desbloquear la siguiente (o explora libremente).";
  curvyOuter.appendChild(note);

  // --- Versión en lista para pantallas angostas ---
  var list = el("div","map-list");
  phaseInfo.forEach(function(info){
    var ph=info.ph, done=info.done, total=info.total, complete=info.complete, locked=info.locked;
    var pct = Math.round(done/total*100);
    var tile = document.createElement("button");
    tile.type = "button";
    tile.className = "phase-tile" + (complete?" done":"") + (locked?" locked":"");
    tile.disabled = locked;
    tile.innerHTML =
      '<span class="node-circle" style="'+(complete?'background:linear-gradient(155deg, var(--ok-soft), var(--surface));border-color:var(--ok);color:var(--ok);':'')+'">'+nodeIconHTML(ph,complete,locked)+'<span class="node-num">'+ph.id+'</span></span>'+
      '<span class="tile-text"><div class="node-label">'+ph.label+'</div><div class="node-sub">'+ph.sub+' · '+done+'/'+total+'</div><div class="node-mini-bar"><span style="width:'+pct+'%"></span></div></span>'+
      '<span class="chev">'+(locked?"":"→")+'</span>';
    tile.addEventListener("click", function(){ goTo("phase"+ph.id); });
    list.appendChild(tile);
  });
  app.appendChild(list);

  var note2 = document.createElement("p");
  note2.className = "progress-note";
  note2.style.marginTop = "14px";
  note2.textContent = "Tu progreso se guarda en este navegador. Completa una fase para desbloquear la siguiente (o explora libremente).";
  list.appendChild(note2);
}

/* ============================================================
   UTILIDADES DE UI COMPARTIDAS
============================================================ */
function el(tag, cls, html){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}
function phaseHeader(app, num, title, subtitle){
  var head = el("div","phase-head");
  head.innerHTML = '<div class="phase-head-row">' +
    '<span class="phase-head-icon">'+(PHASE_ICONS[num]||"")+'</span>' +
    '<div><span class="eyebrow" style="color:var(--accent)">Fase '+num+'</span><h2>'+title+'</h2></div>' +
    '</div>' +
    '<p style="color:var(--ink-soft)">'+subtitle+'</p>';
  app.appendChild(head);
}
function feedbackBox(parent){
  var f = el("div","feedback");
  parent.appendChild(f);
  return {
    ok: function(msg){ f.className = "feedback show ok"; f.innerHTML = msg; },
    bad: function(msg){ f.className = "feedback show bad"; f.innerHTML = msg; },
    clear: function(){ f.className = "feedback"; f.innerHTML=""; }
  };
}

/* ============================================================
   FASE 1 — EXPERIMENTA
============================================================ */
var phase1Missions = [
  {key:"m1", tag:"Nivel 1 · 1/2", title:"¿Hacia dónde abre? (arriba)",
    desc:"Construye una parábola que abra hacia <strong>arriba</strong>.",
    check:function(a){ return a>0; },
    success:function(){ return "✅ Correcto. Cuando <strong>a &gt; 0</strong>, la parábola abre hacia arriba y tiene un mínimo."; },
    hint:"Observa el signo de <span class='mono'>a</span> en el panel de control."},
  {key:"m2", tag:"Nivel 1 · 2/2", title:"¿Hacia dónde abre? (abajo)",
    desc:"Ahora construye una parábola que abra hacia <strong>abajo</strong>.",
    check:function(a){ return a<0; },
    success:function(){ return "✅ Correcto. Cuando <strong>a &lt; 0</strong>, la parábola abre hacia abajo y tiene un máximo."; },
    hint:"Cambia el signo de <span class='mono'>a</span>."},
  {key:"m3", tag:"Nivel 2 · 1/4", title:"Encuentra el mínimo",
    desc:"Construye una parábola que tenga un <strong>mínimo de −3</strong>.",
    check:function(a,b,c){ var v=vertexOf(a,b,c); return a>0 && Math.abs(v.k-(-3))<0.12; },
    success:function(a,b,c){ var v=vertexOf(a,b,c); return "✅ Correcto. El vértice se encuentra en "+K("y="+fmt(v.k))+", por lo tanto el valor mínimo es "+K(fmt(v.k))+"."; },
    hint:"Necesitas a&gt;0, y luego desliza b y c hasta que el vértice caiga en y=−3."},
  {key:"m4", tag:"Nivel 2 · 2/4", title:"Encuentra el máximo",
    desc:"Ahora construye una parábola cuyo <strong>máximo sea 5</strong>.",
    check:function(a,b,c){ var v=vertexOf(a,b,c); return a<0 && Math.abs(v.k-5)<0.12; },
    success:function(a,b,c){ var v=vertexOf(a,b,c); return "✅ Correcto. El vértice se encuentra en "+K("y="+fmt(v.k))+", por lo tanto el valor máximo es "+K(fmt(v.k))+"."; },
    hint:"Esta vez necesitas a&lt;0 (necesariamente) para que exista un máximo."},
  {key:"m5", tag:"Nivel 2 · 3/4", title:"Combina condiciones (mínimo)",
    desc:"Construye una parábola que abra hacia <strong>arriba</strong> y tenga un <strong>mínimo de 2</strong>.",
    check:function(a,b,c){ var v=vertexOf(a,b,c); return a>0 && Math.abs(v.k-2)<0.12; },
    success:function(a,b,c){ var v=vertexOf(a,b,c); return "✅ Correcto. "+K("a>0")+" y el vértice está en "+K("y="+fmt(v.k))+"."; },
    hint:"Necesitas a&gt;0 otra vez, pero ahora con el vértice en y=2."},
  {key:"m6", tag:"Nivel 2 · 4/4", title:"Combina condiciones (máximo)",
    desc:"Ahora construye una que abra hacia <strong>abajo</strong> y tenga un <strong>máximo de −1</strong>.",
    check:function(a,b,c){ var v=vertexOf(a,b,c); return a<0 && Math.abs(v.k-(-1))<0.12; },
    success:function(a,b,c){ var v=vertexOf(a,b,c); return "✅ Correcto. "+K("a<0")+" y el vértice está en "+K("y="+fmt(v.k))+"."; },
    hint:"El máximo puede ser negativo — igual necesitas a&lt;0."}
];

function renderPhase1(app){
  phaseHeader(app, 1, "Construye y descubre la parábola",
    "Mueve a, b y c y observa la gráfica. Cuando creas tener la respuesta, comprueba el reto activo.");

  var state = {a:1, b:-2, c:-2};
  var ws = el("div","workspace"); app.appendChild(ws);

  var control = el("div","panel");
  control.innerHTML =
    '<h3>Panel de control</h3>'+
    '<div class="field"><label>a <span class="val" id="p1_aval">1</span></label><input type="range" id="p1_a" min="-5" max="5" step="0.5" value="1"></div>'+
    '<div class="field"><label>b <span class="val" id="p1_bval">-2</span></label><input type="range" id="p1_b" min="-10" max="10" step="0.5" value="-2"></div>'+
    '<div class="field"><label>c <span class="val" id="p1_cval">-2</span></label><input type="range" id="p1_c" min="-10" max="10" step="0.5" value="-2"></div>'+
    '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;">'+
      '<button class="btn sm ghost" id="p1_toggleV" type="button">Revelar vértice</button>'+
      '<button class="btn sm ghost" id="p1_toggleAx" type="button">Eje de simetría</button>'+
    '</div>';
  ws.appendChild(control);

  var canvasPanel = el("div","canvas-panel");
  canvasPanel.innerHTML = '<canvas id="p1_canvas" aria-label="Gráfica de la parábola"></canvas>';
  ws.appendChild(canvasPanel);

  var info = el("div","panel");
  info.innerHTML =
    '<h3>Panel de información</h3>'+
    '<div class="info-row"><span class="k">Ecuación</span><span class="v eq" id="p1_eq"></span></div>'+
    '<div class="info-row"><span class="k">Concavidad</span><span class="v" id="p1_conc"></span></div>'+
    '<div class="info-row"><span class="k">Vértice</span><span class="v" id="p1_vert"></span></div>'+
    '<div class="info-row"><span class="k">Máx/mín</span><span class="v" id="p1_extreme"></span></div>'+
    '<div class="info-row"><span class="k">Eje simetría</span><span class="v" id="p1_axis"></span></div>';
  ws.appendChild(info);

  var missionsWrap = el("div"); missionsWrap.style.marginTop="20px"; app.appendChild(missionsWrap);

  var graph = ParabolaGraph(document.getElementById("p1_canvas"), {a:state.a,b:state.b,c:state.c, xMin:-7,xMax:7,yMin:-9,yMax:9});
  var showV=false, showAx=false;

  function updateInfo(){
    document.getElementById("p1_eq").innerHTML = K(eqTex(state.a,state.b,state.c));
    var v = vertexOf(state.a,state.b,state.c);
    document.getElementById("p1_conc").innerHTML = state.a>0 ? '<span class="badge up">hacia arriba</span>' : '<span class="badge down">hacia abajo</span>';
    document.getElementById("p1_vert").innerHTML = K(vertexTex(v.h,v.k));
    document.getElementById("p1_extreme").innerHTML = (state.a>0?"mínimo = ":"máximo = ")+K(fmt(v.k));
    document.getElementById("p1_axis").innerHTML = K("x="+fmt(v.h));
  }
  function onChange(){ graph.set(state.a,state.b,state.c); updateInfo(); }
  updateInfo();

  document.getElementById("p1_a").addEventListener("input", function(){
    var v = parseFloat(this.value); if(v===0){ v = 0.5; this.value=0.5; }
    state.a=v; document.getElementById("p1_aval").textContent=fmt(v); onChange();
  });
  document.getElementById("p1_b").addEventListener("input", function(){
    state.b=parseFloat(this.value); document.getElementById("p1_bval").textContent=fmt(state.b); onChange();
  });
  document.getElementById("p1_c").addEventListener("input", function(){
    state.c=parseFloat(this.value); document.getElementById("p1_cval").textContent=fmt(state.c); onChange();
  });
  document.getElementById("p1_toggleV").addEventListener("click", function(){
    showV=!showV; this.classList.toggle("primary",showV); graph.setShowVertex(showV);
  });
  document.getElementById("p1_toggleAx").addEventListener("click", function(){
    showAx=!showAx; this.classList.toggle("primary",showAx); graph.setShowAxis(showAx);
  });

  function renderMissions(){
    missionsWrap.innerHTML = "";
    phase1Missions.forEach(function(m, idx){
      var solved = isSolved("experimenta", m.key);
      var isActive = !solved && phase1Missions.slice(0, idx).every(function(mm){ return isSolved("experimenta", mm.key); });
      var card = el("div","mission-card" + (solved?" solved":"") + (isActive?" active":""));
      if(solved){
        card.innerHTML = '<h4>✓ '+m.tag+' — '+m.title+'</h4>';
      } else if(isActive){
        card.innerHTML = '<h4>🎯 '+m.tag+' — '+m.title+'</h4><p>'+m.desc+'</p>'+
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
          '<button class="btn primary sm" data-act="check">Comprobar</button>'+
          '<button class="btn ghost sm" data-act="hint">Pista</button></div>';
        var fb = feedbackBox(card);
        card.querySelector('[data-act="check"]').addEventListener("click", function(){
          if(m.check(state.a,state.b,state.c)){
            fb.ok(typeof m.success==="function"?m.success(state.a,state.b,state.c):m.success);
            markSolved("experimenta", m.key);
            setTimeout(renderMissions, 900);
          } else {
            fb.bad("Aún no. Sigue ajustando a, b y c y vuelve a comprobar.");
          }
        });
        card.querySelector('[data-act="hint"]').addEventListener("click", function(){
          fb.ok("💡 "+m.hint);
        });
      } else {
        card.innerHTML = '<h4 style="color:var(--ink-faint)">🔒 '+m.tag+'</h4>';
      }
      missionsWrap.appendChild(card);
    });
    if(phase1Missions.every(function(m){ return isSolved("experimenta", m.key); })){
      var done = el("div","mission-card solved");
      done.innerHTML = '<h4>🏁 Fase 1 completa</h4><p>Entendiste concavidad y cómo mover el vértice a un valor objetivo. Cuando quieras, continúa a la Fase 2 desde el mapa de misión.</p>'+
        '<button class="btn primary sm" id="p1_next">Ir a Fase 2 →</button>';
      missionsWrap.appendChild(done);
      document.getElementById("p1_next").addEventListener("click", function(){ goTo("phase2"); });
    }
  }
  renderMissions();
}

/* ============================================================
   FASE 2 — COMPRUEBA (TABULACIÓN)
============================================================ */
function renderPhase2(app){
  phaseHeader(app, 2, "Tabula y comprueba",
    "Antes de calcular nada, mira los números. La tabla esconde la misma información que la gráfica.");

  var a=1,b=-4,c=3;
  var xs=[0,1,2,3,4];
  var pts = xs.map(function(x){ return {x:x, y:evalQuad(a,b,c,x)}; });

  var cols = el("div","two-col"); app.appendChild(cols);
  var left = el("div","panel");
  var rows = pts.map(function(p){ return "<td>"+p.x+"</td>"; }).join("");
  var rowsY = pts.map(function(p,i){ return "<td"+(i===2?' class="sym"':'')+">"+fmt(p.y)+"</td>"; }).join("");
  left.innerHTML =
    '<h3>Tabla de valores</h3>'+
    '<div class="tex-block" style="margin-bottom:10px;">'+K(eqTex(a,b,c))+'</div>'+
    '<div style="overflow-x:auto;"><table class="datatable"><tr><th>x</th>'+rows+'</tr><tr><th>y</th>'+rowsY+'</tr></table></div>'+
    '<p style="margin-top:14px;">Lee la fila de <span class="mono">y</span> de izquierda a derecha: <span class="tex-block" style="display:inline-block;">'+K("3 \\to 0 \\to -1 \\to 0 \\to 3")+'</span></p>';
  cols.appendChild(left);

  var right = el("div","canvas-panel");
  right.innerHTML = '<canvas id="p2_canvas" aria-label="Puntos de la tabla en la gráfica"></canvas>';
  cols.appendChild(right);
  var graph = ParabolaGraph(document.getElementById("p2_canvas"), {a:a,b:b,c:c, xMin:-2,xMax:6,yMin:-3,yMax:6});
  graph.setPoints(pts.map(function(p){ return {x:p.x,y:p.y,color:"var(--danger)"}; }));

  var missionsWrap = el("div"); missionsWrap.style.marginTop="20px"; app.appendChild(missionsWrap);

  var m1solved = isSolved("comprueba","m1_simetria");
  var m2solved = isSolved("comprueba","m2_vertice");

  function renderMissions(){
    missionsWrap.innerHTML = "";

    var c1 = el("div","mission-card"+(m1solved?" solved":" active"));
    if(m1solved){
      c1.innerHTML = '<h4>✓ Paso 1 — ¿Qué observas?</h4><p>Los valores de y suben y bajan de forma simétrica: <strong>3 → 0 → −1 → 0 → 3</strong>.</p>';
    } else {
      c1.innerHTML = '<h4>🔎 Paso 1 — ¿Qué observas en los valores de y?</h4>';
      var choices = [
        "Aumentan todo el tiempo, sin ningún patrón especial.",
        "Son simétricos: bajan hasta un punto y luego suben repitiendo los mismos valores.",
        "Son siempre negativos.",
        "No tienen ninguna relación con la gráfica."
      ];
      var grid = el("div","choice-grid");
      choices.forEach(function(txt, i){
        var b = el("button","choice"); b.type="button"; b.textContent=txt;
        b.addEventListener("click", function(){
          Array.from(grid.children).forEach(function(x){ x.disabled=true; });
          if(i===1){
            b.classList.add("correct");
            markSolved("comprueba","m1_simetria"); m1solved=true;
            setTimeout(renderMissions, 850);
          } else {
            b.classList.add("incorrect");
            setTimeout(function(){ Array.from(grid.children).forEach(function(x){ x.disabled=false; x.classList.remove("incorrect"); }); }, 900);
          }
        });
        grid.appendChild(b);
      });
      c1.appendChild(grid);
    }
    missionsWrap.appendChild(c1);

    if(m1solved){
      var c2 = el("div","mission-card"+(m2solved?" solved":" active"));
      if(m2solved){
        c2.innerHTML = '<h4>✓ Paso 2 — El vértice es (2, −1)</h4><p>Conectaste tabulación → puntos → gráfica → simetría → vértice.</p>';
      } else {
        c2.innerHTML = '<h4>🎯 Paso 2 — ¿Cuál es el vértice?</h4><p>Usa la simetría de la tabla para identificar el punto más bajo. Escribe sus coordenadas (h, k).</p>'+
          '<div style="display:flex; gap:10px; align-items:end; flex-wrap:wrap;">'+
          '<div class="field" style="margin-bottom:0;"><label>h</label><input type="number" step="0.5" id="p2_h" style="width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);"></div>'+
          '<div class="field" style="margin-bottom:0;"><label>k</label><input type="number" step="0.5" id="p2_k" style="width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);"></div>'+
          '<button class="btn primary sm" id="p2_check">Comprobar</button></div>';
        var fb2 = feedbackBox(c2);
        c2.querySelector("#p2_check").addEventListener("click", function(){
          var h = parseFloat(document.getElementById("p2_h").value);
          var k = parseFloat(document.getElementById("p2_k").value);
          if(Math.abs(h-2)<0.05 && Math.abs(k-(-1))<0.05){
            fb2.ok("✅ Correcto. El vértice es (2, −1) — justo el punto donde la tabla cambia de dirección.");
            graph.setShowVertex(true);
            markSolved("comprueba","m2_vertice"); m2solved=true;
            setTimeout(renderMissions, 1000);
          } else {
            fb2.bad("Todavía no. Mira qué valor de x está exactamente en el centro de la simetría, y cuál es su y.");
          }
        });
      }
      missionsWrap.appendChild(c2);
    }

    if(m1solved && m2solved){
      var done = el("div","mission-card solved");
      done.innerHTML = '<h4>🏁 Fase 2 completa</h4><p>Ya puedes leer un vértice directamente desde una tabla. En la Fase 3 verás de dónde sale la fórmula.</p>'+
        '<button class="btn primary sm" id="p2_next">Ir a Fase 3 →</button>';
      missionsWrap.appendChild(done);
      document.getElementById("p2_next").addEventListener("click", function(){ goTo("phase3"); });
    }
  }
  renderMissions();
}

/* ============================================================
   FASE 3 — CALCULA (EL VÉRTICE)
============================================================ */
function renderPhase3(app){
  phaseHeader(app, 3, "Del vistazo a la fórmula",
    "Primero observa dónde está el punto más alto o más bajo. Después, la fórmula solo explica lo que ya viste.");

  var a=1,b=-4,c=3;
  var v = vertexOf(a,b,c);
  var hDone = isSolved("calcula","h");
  var kDone = isSolved("calcula","k");
  var step = hDone && kDone ? 3 : (hDone ? 2 : (progress.calcula && progress.calcula._observed ? 1 : 0));

  var cols = el("div","two-col"); app.appendChild(cols);
  var left = el("div","canvas-panel");
  left.innerHTML = '<canvas id="p3_canvas" aria-label="Gráfica para ubicar el vértice"></canvas><p class="progress-note" id="p3_guessMsg" style="padding:0 6px;"></p>';
  cols.appendChild(left);
  var graph = ParabolaGraph(document.getElementById("p3_canvas"), {a:a,b:b,c:c, xMin:-2,xMax:6,yMin:-3,yMax:6,
    onGuess:function(gx,gy){
      var dist = Math.hypot(gx-v.h, gy-v.k);
      var msg = document.getElementById("p3_guessMsg");
      if(dist<0.6) msg.innerHTML = "🎯 ¡Muy cerca del punto más bajo!";
      else msg.innerHTML = "Sigue explorando la curva con clics — busca el punto donde deja de bajar y empieza a subir.";
    }});

  var right = el("div","panel");
  cols.appendChild(right);

  function renderRight(){
    right.innerHTML = '<h3>Encuentra el vértice</h3><div class="stepper" id="p3_stepper"></div><div id="p3_body"></div>';
    var stepper = document.getElementById("p3_stepper");
    ["1. Observa","2. Calcula h","3. Calcula k"].forEach(function(t,i){
      var s = el("span", i<=step?"on":"", t); stepper.appendChild(s);
    });
    var body = document.getElementById("p3_body");

    if(step===0){
      body.innerHTML = '<p>¿Dónde está el punto más alto o más bajo de esta parábola? Haz clic sobre la curva para marcar tu mejor estimación.</p>'+
        '<button class="btn primary sm" id="p3_toStep1">Ya lo ubiqué, continuar →</button>';
      document.getElementById("p3_toStep1").addEventListener("click", function(){
        if(!progress.calcula) progress.calcula={};
        progress.calcula._observed = true; saveProgress();
        step=1; renderRight();
      });
    } else if(step===1){
      body.innerHTML =
        '<p>Para encontrar la coordenada <em>x</em> del vértice usamos:</p>'+
        formulaCallout("h=-\\dfrac{b}{2a}", "Fórmula clave · coordenada x del vértice")+
        '<p>Aquí '+K("a="+a)+' y '+K("b="+b)+'. Calcula h:</p>'+
        '<div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap;">'+
        '<input type="number" step="0.5" id="p3_h" style="width:100px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);">'+
        '<button class="btn primary sm" id="p3_checkH">Comprobar</button></div>';
      var fb = feedbackBox(body);
      document.getElementById("p3_checkH").addEventListener("click", function(){
        var hv = parseFloat(document.getElementById("p3_h").value);
        if(Math.abs(hv-v.h)<0.05){
          fb.ok("✅ "+K("h="+fmt(v.h))+". Ese es el eje de simetría: "+K("x="+fmt(v.h))+".");
          graph.setShowAxis(true);
          markSolved("calcula","h"); hDone=true;
          setTimeout(function(){ step=2; renderRight(); }, 900);
        } else {
          fb.bad("Revisa el signo: "+K("h=-\\dfrac{("+b+")}{2("+a+")}")+". Vuelve a intentarlo.");
        }
      });
    } else if(step===2){
      body.innerHTML =
        '<p>Ahora que tenemos '+K("h="+fmt(v.h))+', calculamos:</p>'+
        formulaCallout("k=f(h)", "Fórmula clave · coordenada y del vértice")+
        '<p>Sustituye '+K("x="+fmt(v.h))+' en '+K(eqTex(a,b,c))+' y calcula k:</p>'+
        '<div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap;">'+
        '<input type="number" step="0.5" id="p3_k" style="width:100px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);">'+
        '<button class="btn primary sm" id="p3_checkK">Comprobar</button></div>';
      var fb2 = feedbackBox(body);
      document.getElementById("p3_checkK").addEventListener("click", function(){
        var kv = parseFloat(document.getElementById("p3_k").value);
        if(Math.abs(kv-v.k)<0.05){
          fb2.ok("✅ "+K("k="+fmt(v.k))+". El vértice es "+K(vertexTex(v.h,v.k))+".");
          graph.setShowVertex(true);
          markSolved("calcula","k"); kDone=true;
          setTimeout(function(){ step=3; renderRight(); }, 900);
        } else {
          fb2.bad("Sustituye con cuidado: "+K("("+fmt(v.h)+")^2-4("+fmt(v.h)+")+3")+".");
        }
      });
    } else {
      body.innerHTML = '<div class="mission-card solved"><h4>🏁 Fase 3 completa</h4>'+
        '<p>Ya sabes de dónde sale '+K("h=-\\frac{b}{2a}")+' y '+K("k=f(h)")+': son la forma de calcular exactamente lo que ya habías observado.</p>'+
        '<button class="btn primary sm" id="p3_next">Ir a Fase 4 →</button></div>';
      document.getElementById("p3_next").addEventListener("click", function(){ goTo("phase4"); });
    }
  }
  renderRight();
}

/* ============================================================

============================================================ */
function renderPhase4(app){

        '<div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap;"><input type="number" step="0.5" id="p4_lx" style="width:100px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);"><button class="btn primary sm" id="p4_lxBtn">Comprobar</button></div>';

      b1.querySelector("#p4_lxBtn").addEventListener("click", function(){
        var xv = parseFloat(document.getElementById("p4_lx").value);
        if(Math.abs(xv-lv.h)<0.05){
          fb1.ok("✅ "+K("h=-\\dfrac{12}{2(-2)}="+fmt(lv.h))+". El máximo ocurre cuando "+K("x="+fmt(lv.h))+".");
          markSolved("interpreta","law_x"); s.m1=true;

      if(!s.m2){
        var b2 = el("div","mission-card active");
        b2.innerHTML = '<h4>¿Qué significa ese máximo dentro del contexto del problema?</h4>';
        var choices2 = [
          "A partir de las "+fmt(lv.h)+" horas destinadas a la actividad se atiende el mayor número de casos posible según este modelo; añadir más horas no sigue aumentando los casos atendidos.",
          "Que la oficina debe trabajar exactamente "+fmt(lv.k)+" horas a la semana.",
          "Que después de "+fmt(lv.h)+" horas el número de casos atendidos será siempre cero.",
          "El valor de x no tiene ningún significado dentro del problema."
        ];
        var g2 = el("div","choice-grid");
        choices2.forEach(function(txt,i){
          var btn = el("button","choice"); btn.type="button"; btn.textContent=txt;
          btn.addEventListener("click", function(){
            Array.from(g2.children).forEach(function(x){x.disabled=true;});
            if(i===0){ btn.classList.add("correct"); markSolved("interpreta","law_meaning"); s.m2=true; setTimeout(render,900); }
            else { btn.classList.add("incorrect"); setTimeout(function(){ Array.from(g2.children).forEach(function(x){x.disabled=false;x.classList.remove("incorrect");}); },900); }
          });
          g2.appendChild(btn);
        });
        b2.appendChild(g2);
        lawCard.appendChild(b2);
      } else {
        var d2 = el("div","mission-card solved");
        d2.innerHTML = '<h4>✓ El máximo describe un límite del modelo, no una meta a superar</h4>';
        lawCard.appendChild(d2);

        if(!s.m3){
          var b2b = el("div","mission-card active");
          b2b.innerHTML = '<h4>¿Qué pasa si x sigue creciendo más allá del máximo?</h4>'+
            '<p>Si evaluamos en '+K("x=8")+': '+K("C(8)="+fmt(c8))+'. ¿Qué nos dice este resultado sobre el modelo?</p>';
          var choices2b = [
            "Que el modelo es válido para cualquier valor de x, sin ninguna restricción.",
            "Que en la práctica x debe mantenerse en un rango razonable de horas; más allá de ese rango, el modelo deja de reflejar la realidad (no puede haber menos de cero casos).",
            "Que la fórmula está mal planteada y hay que corregirla.",
            "Que C(x) siempre representa casos reales sin importar el valor de x."
          ];
          var g2b = el("div","choice-grid");
          choices2b.forEach(function(txt,i){
            var btn = el("button","choice"); btn.type="button"; btn.textContent=txt;
            btn.addEventListener("click", function(){
              Array.from(g2b.children).forEach(function(x){x.disabled=true;});

          lawCard.appendChild(d2b);

    if(s.m1 && s.m2 && s.m3){

            markSolved("interpreta","psy_values"); s.m4=true;
            setTimeout(render, 900);

        psyCard.appendChild(d3);

        if(!s.m5){
          var b3b = el("div","mission-card active");
          b3b.innerHTML = '<h4>¿Qué pasa en x = 0?</h4>'+
            '<p>Calcula '+K("P(0)")+', es decir, el desempeño con cero horas de descanso.</p>'+
            '<div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap;"><input type="number" step="0.5" id="p4_p0" style="width:100px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);"><button class="btn primary sm" id="p4_p0Btn">Comprobar</button></div>';
          psyCard.appendChild(b3b);
          var fb3b = feedbackBox(b3b);
          b3b.querySelector("#p4_p0Btn").addEventListener("click", function(){
            var v0 = parseFloat(document.getElementById("p4_p0").value);
            var real0 = evalQuad(psy.a,psy.b,psy.c,0);
            if(Math.abs(v0-real0)<0.05){
              fb3b.ok("✅ "+K("P(0)="+fmt(real0))+". Incluso sin descanso el modelo predice cierto desempeño — pero muy por debajo del máximo de "+fmt(pv.k)+".");
              markSolved("interpreta","psy_zero"); s.m5=true;
              setTimeout(render, 900);
            } else { fb3b.bad("Sustituye "+K("x=0")+" en "+K(eqTex(psy.a,psy.b,psy.c).replace(/^y=/,"P(x)="))+"."); }
          });
        } else {
          var d3b = el("div","mission-card solved");
          d3b.innerHTML = '<h4>✓ Sin descanso, el desempeño ya es bajo — y sigue subiendo hasta el vértice</h4>';
          psyCard.appendChild(d3b);

          if(!s.m6){

            b4.innerHTML = '<h4>¿Tiene sentido cualquier valor de x en este modelo?</h4>';

              "Sí, cualquier número real es válido para x, incluso valores negativos.",

              "No, porque la función nunca puede dar un resultado negativo.",
              "Sí, porque el vértice ya garantiza que todo el dominio es válido."
            ];
            var g4 = el("div","choice-grid");

              var btn = el("button","choice"); btn.type="button"; btn.textContent=txt;
              btn.addEventListener("click", function(){
                Array.from(g4.children).forEach(function(x){x.disabled=true;});
                if(i===1){ btn.classList.add("correct"); markSolved("interpreta","psy_domain"); s.m6=true; setTimeout(render,900); }
                else { btn.classList.add("incorrect"); setTimeout(function(){ Array.from(g4.children).forEach(function(x){x.disabled=false;x.classList.remove("incorrect");}); },900); }
              });
              g4.appendChild(btn);
            });
            b4.appendChild(g4);
            psyCard.appendChild(b4);
          } else {
            var d4 = el("div","mission-card solved");
            d4.innerHTML = '<h4>✓ El dominio real está limitado por el contexto, no solo por la fórmula</h4>'+
              '<p>Esta es la idea clave: un modelo matemático describe una situación, pero el contexto decide qué valores son razonables — tanto en Derecho como en Psicología.</p>'+
              '<button class="btn primary sm" id="p4_next">Ir a Fase 5 →</button>';
            psyCard.appendChild(d4);
            d4.querySelector("#p4_next").addEventListener("click", function(){ goTo("phase5"); });
          }
        }
      }
    }
  }
  render();
}

function renderPhase5(app){
  phaseHeader(app, 5, "Detective matemático",
    "Aquí no construyes la parábola: alguien más ya lo hizo, y puede haberse equivocado. Tu trabajo es encontrar el error.");

  var idx = 0;
  for(var i=0;i<CASES.length;i++){
    if(!isSolved("investiga", CASES[i].key)){ idx = i; break; }
    idx = CASES.length;
  }
  var container = el("div"); app.appendChild(container);

  function renderCase(){
    container.innerHTML = "";
    if(idx >= CASES.length){
      var done = el("div","mission-card solved");
      done.innerHTML = '<h4>🏁 Fase 5 completa</h4><p>Cerraste los '+CASES.length+' expedientes. Ya distingues explicaciones correctas de errores comunes — no solo calculas, también argumentas.</p>'+
        '<button class="btn primary sm" id="p5_next">Ir a Fase 6 →</button>';
      container.appendChild(done);
      done.querySelector("#p5_next").addEventListener("click", function(){ goTo("phase6"); });
      return;
    }
    var cs = CASES[idx];
    var dossier = el("div","dossier");
    var tagText = cs.bonus ? "EXPEDIENTE ESPECIAL · DOS DETECTIVES" : ("EXPEDIENTE Nº "+String(idx+1).padStart(2,"0")+" / "+(CASES.length-1));
    dossier.appendChild(el("div","case-tag", tagText));
    dossier.appendChild(el("h3", null, cs.bonus ? "Dos detectives" : "Caso "+(idx+1)));
    if(cs.funcTex){ var fd=el("div","tex-block"); fd.style.position="relative"; fd.style.zIndex="1"; fd.innerHTML=K(cs.funcTex); dossier.appendChild(fd); }
    if(cs.table){
      var xs=cs.table.xs, ys=cs.table.ys;
      var trx = xs.map(function(x){return "<td>"+x+"</td>";}).join("");
      var try_ = ys.map(function(y){return "<td>"+y+"</td>";}).join("");
      var tdiv = el("div"); tdiv.style.margin="12px 0"; tdiv.style.position="relative"; tdiv.style.zIndex="1";
      tdiv.innerHTML = '<div style="overflow-x:auto;"><table class="datatable"><tr><th>x</th>'+trx+'</tr><tr><th>y</th>'+try_+'</tr></table></div>';
      dossier.appendChild(tdiv);
    }
    if(cs.claim) dossier.appendChild(el("div","claim-box", cs.claim));

    var qWrap = el("div"); qWrap.style.position="relative"; qWrap.style.zIndex="1";
    dossier.appendChild(qWrap);

    if(cs.graph){
      var gp = el("div","canvas-panel"); gp.style.margin="12px 0 0"; gp.style.maxWidth="360px"; gp.style.position="relative"; gp.style.zIndex="1";
      gp.innerHTML = '<canvas id="p5_case_canvas" aria-label="Gráfica del caso"></canvas>';
      dossier.appendChild(gp);
    }

    var stampEl = el("div","stamp"); dossier.style.position="relative"; dossier.appendChild(stampEl);
    var explainBox = el("div","reveal-box"); explainBox.style.display="none"; explainBox.style.position="relative"; explainBox.style.zIndex="1";
    var nextBtn = el("button","btn primary sm", (idx===CASES.length-1) ? "Ver resumen →" : "Siguiente expediente →");
    nextBtn.style.display="none"; nextBtn.style.marginTop="14px"; nextBtn.style.position="relative"; nextBtn.style.zIndex="1";
    nextBtn.addEventListener("click", function(){ idx++; renderCase(); });

    function resolve(chosenIsCorrect, chosenBtn, group, isCorrectIdxFn){
      Array.from(group.children).forEach(function(x, i){
        x.disabled = true;
        if(isCorrectIdxFn(i)) x.classList.add("correct");
      });
      if(!chosenIsCorrect) chosenBtn.classList.add("incorrect");
      stampEl.textContent = chosenIsCorrect ? "RESUELTO" : "CASO CERRADO";
      if(!chosenIsCorrect) stampEl.classList.add("wrong");
      stampEl.classList.add("show");
      explainBox.style.display = "block";
      explainBox.innerHTML = (chosenIsCorrect ? "✅ " : "🔍 ") + cs.explain;
      nextBtn.style.display = "inline-block";
      markSolved("investiga", cs.key);
    }

    if(cs.type === "boolean"){
      qWrap.innerHTML = '<p style="font-weight:600;">¿Es correcta esta afirmación?</p>';
      var g = el("div","choice-grid");
      [["Sí, es correcta", true],["No, tiene un error", false]].forEach(function(pair){
        var btn = el("button","choice"); btn.type="button"; btn.textContent=pair[0];
        btn._val = pair[1];
        btn.addEventListener("click", function(){
          resolve(pair[1]===cs.correct, btn, g, function(i){ return g.children[i]._val === cs.correct; });
        });
        g.appendChild(btn);
      });
      qWrap.appendChild(g);
    } else {
      qWrap.innerHTML = '<p style="font-weight:600;">'+cs.question+'</p>';
      var g2 = el("div","choice-grid");
      cs.options.forEach(function(opt, i){
        var btn = el("button","choice"); btn.type="button";
        if(cs.optionsAreMath) btn.innerHTML = K(opt); else btn.textContent = opt;
        btn.addEventListener("click", function(){
          resolve(i===cs.correctIndex, btn, g2, function(j){ return j===cs.correctIndex; });
        });
        g2.appendChild(btn);
      });
      qWrap.appendChild(g2);
    }

    dossier.appendChild(explainBox);
    dossier.appendChild(nextBtn);
    container.appendChild(dossier);

    if(cs.graph){
      var gcanvas = document.getElementById("p5_case_canvas");
      ParabolaGraph(gcanvas, {a:cs.graph.a, b:cs.graph.b, c:cs.graph.c, xMin:-4, xMax:4, yMin:-4, yMax:6});
    }
  }
  renderCase();
}
