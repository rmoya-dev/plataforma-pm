   FASE 6 — DESAFÍO (CONSTRUCCIÓN INVERSA)
============================================================ */
var CHALLENGES = [
  {key:"d1", dir:"down", h:2, k:4, label:"máximo"},
  {key:"d2", dir:"up",   h:-1, k:-2, label:"mínimo"},
  {key:"d3", dir:"down", h:3, k:0, label:"máximo"},
  {key:"d4", dir:"up",   h:0, k:6, label:"mínimo"},
  {key:"d5", dir:"up",   h:4, k:-5, label:"mínimo"},
  {key:"d6", dir:"down", h:-3, k:2, label:"máximo"}
];

function renderPhase6(app){
  phaseHeader(app, 6, "Construye exactamente esta parábola",
    "Ya no recibes a, b y c: recibes condiciones. Tú decides qué ecuación las cumple. Usa la forma vértice: y = a(x − h)² + k.");

  var idx = 0;
  for(var i=0;i<CHALLENGES.length;i++){
    if(!isSolved("desafio", CHALLENGES[i].key)){ idx = i; break; }
    idx = CHALLENGES.length;
  }
  var container = el("div"); app.appendChild(container);

  function renderChallenge(){
    container.innerHTML = "";
    if(idx >= CHALLENGES.length){
      var done = el("div","mission-card solved");
      done.innerHTML = '<h4>🏁 Fase 6 completa</h4>'+
        '<p>Experimentaste, tabulaste, calculaste, interpretaste, investigaste errores y construiste tus propias parábolas a partir de condiciones. Ya tienes todas las piezas — falta integrarlas en casos reales completos.</p>'+
        '<button class="btn primary sm" id="p6_next">Ir a Fase 7 →</button>';
      container.appendChild(done);
      done.querySelector("#p6_next").addEventListener("click", function(){ goTo("phase7"); });
      return;
    }
    var ch = CHALLENGES[idx];
    var dirTxt = ch.dir==="down" ? "hacia abajo" : "hacia arriba";
    var extremoTxt = ch.label + " " + fmt(ch.k);

    var head = el("div","mission-card active");
    head.innerHTML = '<h4>🎯 Reto '+(idx+1)+' de '+CHALLENGES.length+'</h4>'+
      '<p>Construye una función que: abra <strong>'+dirTxt+'</strong>, tenga <strong>'+extremoTxt+'</strong> y tenga vértice en <strong>'+K(vertexTex(ch.h,ch.k))+'</strong>.</p>';
    container.appendChild(head);

    var ws = el("div","workspace"); container.appendChild(ws);

    var form = el("div","panel");
    form.innerHTML = '<h3>Forma vértice</h3>'+formulaCallout("y=a(x-h)^2+k", "Fórmula clave · forma vértice")+
      '<div class="field"><label>a <span class="val" id="p6_aval">1</span></label><input type="range" id="p6_a" min="-5" max="5" step="0.5" value="1"></div>'+
      '<div class="field"><label>h <span class="val" id="p6_hval">0</span></label><input type="range" id="p6_h" min="-6" max="6" step="0.5" value="0"></div>'+
      '<div class="field"><label>k <span class="val" id="p6_kval">0</span></label><input type="range" id="p6_k" min="-6" max="6" step="0.5" value="0"></div>'+
      '<button class="btn primary sm" id="p6_check" style="width:100%;margin-top:6px;">Comprobar construcción</button>';
    ws.appendChild(form);

    var canvasPanel = el("div","canvas-panel");
    canvasPanel.innerHTML = '<canvas id="p6_canvas" aria-label="Tu construcción"></canvas>';
    ws.appendChild(canvasPanel);

    var info = el("div","panel");
    info.innerHTML =
      '<h3>¿Cumples las condiciones?</h3>'+
      '<div class="info-row"><span class="k">Ecuación</span><span class="v eq" id="p6_eq"></span></div>'+
      '<div class="info-row"><span class="k">Dirección</span><span class="v" id="p6_dir"></span></div>'+
      '<div class="info-row"><span class="k">Tu vértice</span><span class="v" id="p6_vert"></span></div>'+
      '<div class="info-row"><span class="k">Objetivo</span><span class="v">'+dirTxt+', '+K(vertexTex(ch.h,ch.k))+'</span></div>';
    ws.appendChild(info);

    var fbWrap = el("div"); fbWrap.style.marginTop="14px"; container.appendChild(fbWrap);
    var fb = feedbackBox(fbWrap);

    var st = {a:1,h:0,k:0};
    function toStd(){ var b=-2*st.a*st.h; var c=st.a*st.h*st.h+st.k; return {a:st.a,b:b,c:c}; }
    var std0 = toStd();
    var graph = ParabolaGraph(document.getElementById("p6_canvas"), {a:std0.a,b:std0.b,c:std0.c, xMin:ch.h-6,xMax:ch.h+6, yMin:ch.k-6, yMax:ch.k+6, showVertex:true});

    function update(){
      var std = toStd();
      graph.set(std.a,std.b,std.c);
      var v = vertexOf(std.a,std.b,std.c);
      document.getElementById("p6_eq").innerHTML = K(eqVertexFormTex(st.a,st.h,st.k));
      document.getElementById("p6_dir").innerHTML = st.a>0 ? '<span class="badge up">arriba</span>' : '<span class="badge down">abajo</span>';
      document.getElementById("p6_vert").innerHTML = K(vertexTex(v.h,v.k));
    }
    update();

    document.getElementById("p6_a").addEventListener("input", function(){
      var v=parseFloat(this.value); if(v===0){v=0.5; this.value=0.5;}
      st.a=v; document.getElementById("p6_aval").textContent=fmt(v); update();
    });
    document.getElementById("p6_h").addEventListener("input", function(){
      st.h=parseFloat(this.value); document.getElementById("p6_hval").textContent=fmt(st.h); update();
    });
    document.getElementById("p6_k").addEventListener("input", function(){
      st.k=parseFloat(this.value); document.getElementById("p6_kval").textContent=fmt(st.k); update();
    });

    document.getElementById("p6_check").addEventListener("click", function(){
      var dirOk = ch.dir==="down" ? st.a<0 : st.a>0;
      var hOk = Math.abs(st.h-ch.h)<0.05;
      var kOk = Math.abs(st.k-ch.k)<0.05;
      if(dirOk && hOk && kOk){
        fb.ok("✅ Correcto. "+K(eqVertexFormTex(st.a,ch.h,ch.k))+" cumple las tres condiciones. (Cualquier valor de a con el signo correcto también habría funcionado — solo el vértice y la dirección estaban fijos.)");
        markSolved("desafio", ch.key);
        setTimeout(function(){ idx++; renderChallenge(); }, 1300);
      } else {
        var msgs=[];
        if(!dirOk) msgs.push("la dirección no coincide (revisa el signo de a)");
        if(!hOk || !kOk) msgs.push("el vértice todavía no es "+K(vertexTex(ch.h,ch.k)));
        fb.bad("Aún no: "+msgs.join(" y ")+".");
      }
    });
  }
  renderChallenge();
}

      document.getElementById("p7_checkV").addEventListener("click", function(){
        var hv=parseFloat(document.getElementById("p7_h").value);
        var kv=parseFloat(document.getElementById("p7_k").value);
        if(Math.abs(hv-v.h)<0.05 && Math.abs(kv-v.k)<0.05){
          fb1.ok("✅ El vértice es "+K(vertexTex(v.h,v.k))+".");
          setTimeout(function(){ maxStep=2; step=2; renderCase(); }, 900);
        } else {
          fb1.bad("Revisa: "+K("h=-\\dfrac{"+cs.b+"}{2("+cs.a+")}")+", y luego evalúa "+K("k=f(h)")+".");
        }
      });
    } else if(step===1){
      body.innerHTML =
        '<p>Ecuación del caso: '+K(eqTex(cs.a,cs.b,cs.c))+'</p>'+
        formulaCallout("h=-\\dfrac{b}{2a}\\ ,\\quad k=f(h)", "Fórmulas clave · vértice")+
        '<div class="mission-card solved"><h4>✓ Vértice calculado</h4><p>'+K(vertexTex(v.h,v.k))+'</p></div>';
    } else if(step===2 && !isReview){
      body.innerHTML = '<p style="font-weight:600;">'+cs.interpQuestion+'</p>';
      var grid = el("div","choice-grid");
      cs.interpOptions.forEach(function(txt,i){
        var btn = el("button","choice"); btn.type="button"; btn.textContent=txt;
        btn.addEventListener("click", function(){
          Array.from(grid.children).forEach(function(x){ x.disabled=true; });
          if(i===cs.interpCorrect){
            btn.classList.add("correct");
            setTimeout(function(){ maxStep=3; step=3; renderCase(); }, 900);
          } else {
            btn.classList.add("incorrect");
            setTimeout(function(){ Array.from(grid.children).forEach(function(x){ x.disabled=false; x.classList.remove("incorrect"); }); }, 900);
          }
        });
        grid.appendChild(btn);
      });
      body.appendChild(grid);
    } else if(step===2){
      body.innerHTML = '<p style="font-weight:600;">'+cs.interpQuestion+'</p>';
      var grid2 = el("div","choice-grid");
      cs.interpOptions.forEach(function(txt,i){
        var btn2 = el("button","choice"+(i===cs.interpCorrect?" correct":"")); btn2.type="button"; btn2.textContent=txt; btn2.disabled=true;
        grid2.appendChild(btn2);
      });
      body.appendChild(grid2);
    } else if(step===3 && !isReview){
      var allXs = cs.pts.map(function(p){return p.x;}).concat(cs.extraXs);
      var headerRow = allXs.map(function(x){ return "<td>"+x+"</td>"; }).join("");
      var idInputs = {};
      var yRow = allXs.map(function(x,i){
        var given = cs.pts.some(function(p){ return p.x===x; });
        if(given){ return "<td>"+evalQuad(cs.a,cs.b,cs.c,x)+"</td>"; }
        var inputId = "p7_ty"+i;
        idInputs[inputId] = x;
        return '<td><input type="number" step="0.5" id="'+inputId+'" style="width:56px;padding:4px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);text-align:center;"></td>';
      }).join("");
      body.innerHTML =
        '<p>Usa tu ecuación '+K(eqTex(cs.a,cs.b,cs.c))+' para completar los valores que faltan en la tabla:</p>'+
        '<div style="overflow-x:auto;margin-bottom:12px;"><table class="datatable"><tr><th>x</th>'+headerRow+'</tr><tr><th>y</th>'+yRow+'</tr></table></div>'+
        '<button class="btn primary sm" id="p7_checkTable">Comprobar tabla</button>';
      var fb3 = feedbackBox(body);
      document.getElementById("p7_checkTable").addEventListener("click", function(){
        var allOk = true;
        Object.keys(idInputs).forEach(function(inputId){
          var x = idInputs[inputId];
          var expected = evalQuad(cs.a,cs.b,cs.c,x);
          var got = parseFloat(document.getElementById(inputId).value);
          if(isNaN(got) || Math.abs(got-expected)>0.05) allOk = false;
        });
        if(allOk){
          fb3.ok("✅ La tabla coincide con tu ecuación.");
          markSolved("aplica", cs.key);
          setTimeout(function(){ maxStep=4; step=4; renderCase(); }, 900);
        } else {
          fb3.bad("Alguno de los valores no coincide. Sustituye cada x con cuidado en "+K(eqTex(cs.a,cs.b,cs.c))+".");
        }
      });
    } else if(step===3){
      var allXsR = cs.pts.map(function(p){return p.x;}).concat(cs.extraXs);
      var headerRowR = allXsR.map(function(x){ return "<td>"+x+"</td>"; }).join("");
      var yRowR = allXsR.map(function(x){ return "<td>"+evalQuad(cs.a,cs.b,cs.c,x)+"</td>"; }).join("");
      body.innerHTML =
        '<p>Tabla completa a partir de tu ecuación '+K(eqTex(cs.a,cs.b,cs.c))+':</p>'+
        '<div style="overflow-x:auto;margin-bottom:12px;"><table class="datatable"><tr><th>x</th>'+headerRowR+'</tr><tr><th>y</th>'+yRowR+'</tr></table></div>'+
        '<div class="mission-card solved"><h4>✓ Tabla comprobada</h4></div>';
    } else {
      var pts = cs.pts.map(function(p){ return {x:p.x,y:p.y}; }).concat(cs.extraXs.map(function(x){ return {x:x,y:evalQuad(cs.a,cs.b,cs.c,x)}; }));
      var xs = pts.map(function(p){return p.x;});
      var xMin = Math.min.apply(null,xs)-1.5, xMax = Math.max.apply(null,xs)+1.5;
      var ys = pts.map(function(p){return p.y;}).concat([v.k]);
      var yMin = Math.min.apply(null,ys)-2, yMax = Math.max.apply(null,ys)+3;
      body.innerHTML =
        '<div class="mission-card solved" style="margin-bottom:14px;"><h4>✓ Caso resuelto</h4>'+
        '<p>Ecuación: '+K(eqTex(cs.a,cs.b,cs.c))+' · Vértice: '+K(vertexTex(v.h,v.k))+'</p></div>'+
        '<div class="canvas-panel"><canvas id="p7_canvas" aria-label="Gráfica del caso"></canvas></div>'+
        '<button class="btn primary sm" style="margin-top:14px;" id="p7_nextCase">'+(idx===CASES_P7.length-1 ? "Ver resumen final →" : "Siguiente caso →")+'</button>';
      var graph = ParabolaGraph(document.getElementById("p7_canvas"), {a:cs.a,b:cs.b,c:cs.c, xMin:xMin,xMax:xMax,yMin:yMin,yMax:yMax, showVertex:true});
      graph.setPoints(pts.map(function(p){ return {x:p.x,y:p.y,color:"var(--danger)"}; }));
      document.getElementById("p7_nextCase").addEventListener("click", function(){ idx++; step=0; maxStep=0; renderCase(); });
    }

    var nav = el("div","step-nav");
    var prevBtn = el("button","btn ghost sm", "← Anterior");
    if(step===0) prevBtn.disabled = true;
    prevBtn.addEventListener("click", function(){ if(step>0) goStep(step-1); });
    nav.appendChild(prevBtn);
    if(isReview){
      var nextNavBtn = el("button","btn primary sm", "Siguiente →");
      nextNavBtn.addEventListener("click", function(){ goStep(step+1); });
      nav.appendChild(nextNavBtn);
    } else {
      nav.appendChild(el("span"));
    }
    card.appendChild(nav);
  }
  renderCase();
}

/* ============================================================
   RESUMEN FINAL Y CONSTANCIA
============================================================ */
function renderSummary(app){
  var allDone = allPhasesDone();

  var hero = el("div","hero");
  hero.innerHTML = '<div class="hero-text"><span class="eyebrow">'+(allDone?"Misión completa":"Resumen de progreso")+'</span>'+
    '<h1>'+(allDone ? "🎓 ¡Lo lograste, "+escapeHtml(student.name)+"!" : "Todavía te faltan fases por completar")+'</h1>'+
    '<p class="lead">'+(allDone
      ? "Completaste las siete fases de “Domina la Parábola”. Aquí tienes tu resumen y tu constancia de finalización."
      : "Vuelve al mapa de misión para terminar las fases pendientes; cuando completes las siete, tu constancia aparecerá aquí.")+'</p></div>'+
    '<div class="hero-art"><svg viewBox="0 0 32 32"><path d="M9 5h14v6a7 7 0 0 1-14 0z"/><path d="M9 7H5a4.5 4.5 0 0 0 4.5 6.5"/><path d="M23 7h4a4.5 4.5 0 0 1-4.5 6.5"/><line x1="16" y1="18.5" x2="16" y2="24"/><line x1="10.5" y1="28" x2="21.5" y2="28"/><line x1="16" y1="24" x2="16" y2="28"/></svg></div>';
  app.appendChild(hero);

  var total = totalMissions();
  var solved = PHASES.reduce(function(sum,ph){ return sum + phaseCompleteCount(ph.key, MISSION_TOTALS[ph.key]); }, 0);

  var statGrid = el("div","stat-grid");
  PHASES.forEach(function(ph){
    var d = phaseCompleteCount(ph.key, MISSION_TOTALS[ph.key]);
    var t = MISSION_TOTALS[ph.key];
    var tile = el("div","stat-tile");
    tile.innerHTML = '<div class="num">'+(d>=t?"✓":d+"/"+t)+'</div><div class="lbl">'+ph.label+'</div>';
    statGrid.appendChild(tile);
  });
  var totalTile = el("div","stat-tile");
  totalTile.style.borderColor = "var(--accent)";
  totalTile.innerHTML = '<div class="num">'+solved+'/'+total+'</div><div class="lbl">Retos totales</div>';
  statGrid.appendChild(totalTile);
  app.appendChild(statGrid);

  if(!allDone){
    var back = el("div","center-actions");
    back.innerHTML = '<button class="btn primary" id="sum_map">Volver al mapa de misión</button>';
    app.appendChild(back);
    back.querySelector("#sum_map").addEventListener("click", function(){ goTo("map"); });
    return;
  }

  var completedAt = getCompletedAt();
  var dateStr = "";
  try{
    dateStr = new Date(completedAt || Date.now()).toLocaleDateString("es-PE", {day:"numeric", month:"long", year:"numeric"});
  }catch(e){ dateStr = ""; }

  var printBar = el("div","center-actions no-print");
  printBar.innerHTML = '<button class="btn primary" id="sum_print">🖨️ Guardar como PDF / imprimir</button>'+
    '<button class="btn ghost" id="sum_map2">Volver al mapa de misión</button>';
  app.appendChild(printBar);
  printBar.querySelector("#sum_print").addEventListener("click", function(){ window.print(); });
  printBar.querySelector("#sum_map2").addEventListener("click", function(){ goTo("map"); });

  var cert = el("div","cert-card");
  cert.id = "certCard";
  var carreraTxt = student.carrera === "Otra" ? "Pensamiento Matemático" : student.carrera;
  cert.innerHTML =
    '<div class="cert-inner">'+
      '<div class="cert-seal"><svg viewBox="0 0 32 32"><circle cx="16" cy="12" r="8"/><path d="M11 18.5L8 28l8-4 8 4-3-9.5"/></svg></div>'+
      '<div class="cert-eyebrow">Constancia de finalización</div>'+
      '<div class="cert-title">Misión: Domina la Parábola</div>'+
      '<div class="cert-role">Se certifica que</div>'+
      '<div class="cert-name">'+escapeHtml(student.name)+'</div>'+
      '<div class="cert-role">estudiante de '+escapeHtml(carreraTxt)+'</div>'+
      '<p class="cert-body">completó exitosamente las siete fases del curso de Pensamiento Matemático — Experimenta, Comprueba, Calcula, Interpreta, Investiga, Desafío y Aplica — resolviendo '+total+' retos sobre concavidad, vértice, tabulación, interpretación y aplicación integral de funciones cuadráticas en contextos de Derecho y Psicología.</p>'+
      '<div class="cert-sig">Curso de Pensamiento Matemático</div>'+
      '<div class="cert-date">'+(dateStr||"")+'</div>'+
    '</div>';
  app.appendChild(cert);
}

var PHASE_RENDERERS = {1:renderPhase1, 2:renderPhase2, 3:renderPhase3, 4:renderPhase4, 5:renderPhase5, 6:renderPhase6, 7:renderPhase7};

goTo(student ? "map" : "register");
})();
</script>
