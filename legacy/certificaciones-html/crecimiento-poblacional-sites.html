<meta charset="utf-8">
<title>Crecimiento Poblacional: Modela, Compara y Dictamina</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F7F4FB;
  --surface:#FFFFFF;
  --surface-2:#EFE6F8;
  --ink:#1E1230;
  --ink-soft:#5B4E70;
  --ink-faint:#93869F;
  --line:#E1D3F0;
  --accent:#6802C1;
  --accent-2:#9B3FE0;
  --accent-ink:#FFFFFF;
  --accent-soft:#F1E3FB;
  --gold:#B9791E;
  --gold-soft:#F6E7CC;
  --danger:#A83B2E;
  --danger-soft:#F3DAD3;
  --ok:#1E7A4C;
  --ok-soft:#DCEFE1;
  --formula:#C8102E;
  --formula-soft:#FDE9EC;
  --shadow:0 1px 2px rgba(43,4,80,.08), 0 10px 28px -14px rgba(43,4,80,.32);
  --r-s:8px; --r-m:14px; --r-l:24px;
  --font-display:'Sora', 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-body:'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --font-type:'Special Elite', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#160C24; --surface:#20132F; --surface-2:#2A1A3D; --ink:#F1E9FA; --ink-soft:#BCA9D4;
    --ink-faint:#7C6A93; --line:#3B2650; --accent:#C89BFA; --accent-2:#B77CF2; --accent-ink:#22093D; --accent-soft:#33204A;
    --gold:#EFB85E; --gold-soft:#3A2C15; --danger:#FF9683; --danger-soft:#3B2119; --ok:#5FD394; --ok-soft:#123023;
    --formula:#FF8FA3; --formula-soft:#3A1A24;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#160C24; --surface:#20132F; --surface-2:#2A1A3D; --ink:#F1E9FA; --ink-soft:#BCA9D4;
  --ink-faint:#7C6A93; --line:#3B2650; --accent:#C89BFA; --accent-2:#B77CF2; --accent-ink:#22093D; --accent-soft:#33204A;
  --gold:#EFB85E; --gold-soft:#3A2C15; --danger:#FF9683; --danger-soft:#3B2119; --ok:#5FD394; --ok-soft:#123023;
  --formula:#FF8FA3; --formula-soft:#3A1A24;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding:0 16px;
}
@media (max-width:640px){
  body{ font-size:18px; }
  .btn{ padding:.62em 1.2em; }
  .btn.sm{ padding:.5em 1em; }
  input[type=text], select, .register-wrap input[type=text], .register-wrap select{ font-size:1.05rem; padding:12px 14px; }
  .choice{ padding:14px 16px; }
}
h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance; margin:0 0 .4em; font-weight:700; color:var(--ink);}
p{margin:0 0 1em; max-width:65ch;}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:4px;}
.mono{font-family:var(--font-mono);}
.eq{font-family:var(--font-mono); font-size:1.05em; letter-spacing:.01em;}
img,.canvas-wrap{max-width:100%;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

/* ============ SHELL ============ */
#shell{max-width:1180px; margin:0 auto; padding-block:20px 64px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:12px 18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m);
  box-shadow:var(--shadow); margin-bottom:22px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.brand .mark{font-family:var(--font-display); font-weight:700; font-size:1.2rem;}
.brand .course{color:var(--ink-faint); font-size:.89rem; letter-spacing:.03em; text-transform:uppercase;}
.topnav{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.dot-track{display:flex; gap:6px; align-items:center;}
.dot{
  width:11px; height:11px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line);
  display:inline-block; transition:background .25s, transform .25s;
}
.dot.done{background:var(--ok); border-color:var(--ok);}
.dot.current{background:var(--accent); border-color:var(--accent); transform:scale(1.25);}
.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px;
  padding:.5em 1.1em; font-size:.99rem; font-weight:600; transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{border-color:var(--accent); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.ghost{background:transparent;}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none;}
.btn.sm{padding:.38em .85em; font-size:.89rem;}
.student-tag{font-size:.92rem; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
.student-tag button{background:none; border:none; color:var(--accent); font-size:.92rem; font-weight:600; padding:0; cursor:pointer; text-decoration:underline;}
.register-wrap{max-width:520px; margin:40px auto; background:var(--surface); border:1px solid var(--line); border-top:5px solid var(--accent); border-radius:var(--r-l); box-shadow:var(--shadow); padding:32px 28px;}
.register-icon{
  width:56px; height:56px; border-radius:18px; display:flex; align-items:center; justify-content:center; margin-bottom:16px;
  background:linear-gradient(155deg, var(--accent), var(--accent-2)); color:var(--accent-ink); box-shadow:var(--shadow);
}
.register-icon svg{width:30px; height:30px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.register-wrap h1{font-size:1.55rem;}
.register-wrap label{display:block; font-weight:600; font-size:.97rem; margin:16px 0 6px;}
.register-wrap input[type=text], .register-wrap select{
  width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:var(--r-s);
  background:var(--surface); color:var(--ink); font-size:1.07rem; font-family:inherit;
}
.register-wrap input[type=text]:focus, .register-wrap select:focus{ border-color:var(--accent); }
.mascot-badge{display:inline-flex; flex:none; align-items:center; justify-content:center; vertical-align:middle;}
.mascot-badge svg{width:100%; height:100%; display:block;}
.mascot-hint-row{display:flex; align-items:center; gap:10px;}
.mascot-hint-row .mascot-badge{width:38px !important; height:38px !important;}
.mascot-badge.mascot-inline{width:26px !important; height:26px !important; margin-right:6px;}
.mascot-badge.mascot-welcome{margin-bottom:14px;}

/* ============ MAP SCREEN ============ */
.hero{
  padding:32px 26px; margin-bottom:22px; border-radius:var(--r-l); position:relative; overflow:hidden;
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); box-shadow:var(--shadow);
  display:flex; align-items:center; gap:26px; flex-wrap:wrap;
}
.hero::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(circle at 88% 12%, rgba(255,255,255,.18) 0, transparent 42%),
                    radial-gradient(circle at 6% 92%, rgba(255,255,255,.12) 0, transparent 38%);
}
.hero-text{position:relative; z-index:1; flex:1 1 320px; min-width:0;}
.hero .eyebrow{
  font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.12em; font-size:.9rem;
  color:rgba(255,255,255,.88); font-weight:600; margin-bottom:10px; display:block;
}
.hero h1{font-size:clamp(1.7rem,3.6vw,2.6rem); max-width:16ch; color:#fff;}
.hero p.lead{font-size:1.1rem; color:rgba(255,255,255,.92); max-width:62ch;}
.hero-art{position:relative; z-index:1; flex:none; width:120px; height:120px; color:rgba(255,255,255,.95);}
.hero-art svg{width:100%; height:100%; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
@media (max-width:640px){ .hero-art{display:none;} .hero{padding:26px 20px;} }

.map-wrap{
  background:linear-gradient(180deg, var(--surface) 0%, var(--accent-soft) 130%);
  border:1px solid var(--line); border-radius:var(--r-l);
  box-shadow:var(--shadow); padding:30px 18px 44px; overflow:hidden;
}
.map-inner{position:relative;}
.map-svg{width:100%; height:auto; display:block;}
.node-btn{
  position:absolute; transform:translate(-50%,-50%); width:118px; text-align:center; background:none; border:none; padding:0;
}
.node-circle{
  width:66px; height:66px; border-radius:22px; margin:0 auto 8px; position:relative;
  background:linear-gradient(155deg, var(--surface), var(--accent-soft));
  border:2.5px solid var(--line); display:flex; align-items:center; justify-content:center;
  color:var(--ink-faint); box-shadow:var(--shadow);
  transition:transform .18s, border-color .18s, color .18s, background .18s, box-shadow .18s;
}
.node-circle svg{width:30px; height:30px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.node-circle .node-num{
  position:absolute; top:-8px; left:-8px; width:22px; height:22px; border-radius:50%;
  background:var(--surface); border:2px solid var(--line); color:var(--ink-soft);
  font-family:var(--font-mono); font-weight:700; font-size:.72rem; display:flex; align-items:center; justify-content:center;
}
.node-btn:hover .node-circle{transform:translateY(-4px) scale(1.05); border-color:var(--accent); color:var(--accent); box-shadow:0 10px 22px -10px rgba(104,2,193,.45);}
.node-btn.done .node-circle{background:linear-gradient(155deg, var(--ok-soft), var(--surface)); border-color:var(--ok); color:var(--ok);}
.node-btn.done .node-circle .node-num{background:var(--ok); border-color:var(--ok); color:var(--accent-ink);}
.node-btn.current .node-circle{background:linear-gradient(155deg, var(--accent), var(--accent-2)); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 10px 24px -10px rgba(104,2,193,.55);}
.node-btn.current .node-circle .node-num{background:var(--accent-ink); border-color:var(--accent); color:var(--accent);}
.node-btn.locked{cursor:not-allowed;}
.node-btn.locked .node-circle{color:var(--ink-faint); opacity:.5; background:var(--surface);}
.node-btn.locked:hover .node-circle{transform:none; border-color:var(--line); color:var(--ink-faint); box-shadow:var(--shadow);}
.node-label{font-size:1rem; font-weight:700; color:var(--ink); line-height:1.25;}
.node-sub{font-size:.92rem; color:var(--ink-faint); margin-top:1px;}
.node-mini-bar{width:100%; max-width:90px; height:5px; border-radius:99px; background:var(--surface-2); margin:6px auto 0; overflow:hidden;}
.node-mini-bar > span{display:block; height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:99px;}
.phase-tile .node-mini-bar{margin:6px 0 0;}
.map-list{display:none; flex-direction:column; gap:12px;}
@media (max-width:639px){ .map-curvy{display:none;} .map-list{display:flex;} }
.phase-tile{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  background:var(--surface); border:1.5px solid var(--line); border-left:5px solid var(--accent); border-radius:var(--r-m);
  padding:14px 16px; box-shadow:var(--shadow); transition:transform .15s, box-shadow .15s;
}
.phase-tile:hover{transform:translateY(-2px); box-shadow:0 12px 24px -12px rgba(104,2,193,.35);}
.phase-tile.done{border-left-color:var(--ok);}
.phase-tile.locked{border-left-color:var(--line);}
.phase-tile .node-circle{margin:0; flex:none;}
.phase-tile .tile-text{flex:1; min-width:0;}
.phase-tile .tile-text .node-label{font-size:1.05rem;}
.phase-tile .tile-text .node-sub{font-size:.92rem; margin-top:2px;}
.phase-tile .chev{color:var(--accent); font-size:1.3rem; flex:none;}
.phase-tile.locked{opacity:.6;}
.phase-tile.locked .chev{color:var(--ink-faint);}
.phase-tile.locked:hover{transform:none; box-shadow:var(--shadow);}

/* ============ PHASE CHROME ============ */
.phase-head{margin-bottom:18px;}
.phase-head-row{display:flex; align-items:center; gap:14px; margin-bottom:4px;}
.phase-head-icon{
  flex:none; width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(155deg, var(--accent), var(--accent-2)); color:var(--accent-ink); box-shadow:var(--shadow);
}
.phase-head-icon svg{width:28px; height:28px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.phase-head .eyebrow{font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.1em; font-size:.88rem; font-weight:600;}
.phase-head h2{font-size:clamp(1.4rem,2.6vw,1.9rem); margin:0;}
.workspace{
  display:grid; grid-template-columns:280px 1fr 260px; gap:16px; align-items:start;
}
@media (max-width:900px){ .workspace{grid-template-columns:1fr;} }
.two-col{display:grid; grid-template-columns:1.15fr 1fr; gap:16px; align-items:start;}
@media (max-width:820px){ .two-col{grid-template-columns:1fr;} }
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:16px;
  box-shadow:var(--shadow);
}
.panel h3{font-size:1.05rem; margin-bottom:12px;}
.field{margin-bottom:14px;}
.field label{display:flex; justify-content:space-between; font-size:.92rem; font-weight:600; margin-bottom:6px;}
.field label .val{font-family:var(--font-mono); color:var(--accent); font-weight:700;}
input[type=range]{width:100%; accent-color:var(--accent);}
.info-row{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:.99rem;}
.info-row:last-child{border-bottom:none;}
.info-row .k{color:var(--ink-soft);}
.info-row .v{font-family:var(--font-mono); font-weight:700; text-align:right;}
.badge{display:inline-block; padding:.28em .75em; border-radius:999px; font-size:.88rem; font-weight:700; letter-spacing:.02em;}
.badge.up{background:var(--ok-soft); color:var(--ok);}
.badge.down{background:var(--danger-soft); color:var(--danger);}

.canvas-panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); box-shadow:var(--shadow); padding:10px; position:relative;}
canvas{display:block; width:100%; height:auto; border-radius:var(--r-s); cursor:crosshair;}

.mission-card{
  border:1.5px solid var(--line); border-radius:var(--r-m); padding:14px 16px; margin-top:14px; background:var(--surface-2);
}
.mission-card.active{border-color:var(--accent); background:var(--accent-soft);}
.mission-card.solved{border-color:var(--ok); background:var(--ok-soft);}
.mission-card h4{font-size:1.02rem; margin-bottom:6px; display:flex; gap:8px; align-items:center;}
.mission-card p{font-size:.97rem; color:var(--ink-soft); margin-bottom:10px;}
.feedback{
  margin-top:10px; padding:10px 12px; border-radius:var(--r-s); font-size:.97rem; font-weight:600; display:none;
}
.feedback.show{display:block;}
.feedback.ok{background:var(--ok-soft); color:var(--ok);}
.feedback.bad{background:var(--danger-soft); color:var(--danger);}

table.datatable{width:100%; border-collapse:collapse; font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
table.datatable th,table.datatable td{border:1px solid var(--line); padding:8px 10px; text-align:center;}
table.datatable th{background:var(--surface-2); font-family:var(--font-body); font-weight:700;}
table.datatable td.sym{background:var(--accent-soft); font-weight:700;}

.choice-grid{display:grid; gap:10px; margin-top:12px;}
.choice{
  text-align:left; border:1.5px solid var(--line); background:var(--surface); border-radius:var(--r-s);
  padding:12px 14px; font-size:1.01rem; transition:border-color .15s, background .15s;
}
.choice:hover{border-color:var(--accent);}
.choice.correct{border-color:var(--ok); background:var(--ok-soft);}
.choice.incorrect{border-color:var(--danger); background:var(--danger-soft);}
.choice[disabled]{cursor:default;}

.stepper{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.stepper span{
  font-size:.84rem; font-weight:700; padding:.3em .7em; border-radius:999px; background:var(--surface-2); color:var(--ink-faint);
}
.stepper span.on{background:var(--accent); color:var(--accent-ink);}
.stepper button.step-pill{
  font:inherit; font-size:.84rem; font-weight:700; padding:.3em .7em; border-radius:999px; border:none;
  background:var(--surface-2); color:var(--ink-faint); cursor:pointer; transition:background .15s,color .15s;
}
.stepper button.step-pill.done:not(.on){background:var(--ok-soft); color:var(--ok);}
.stepper button.step-pill.on{background:var(--accent); color:var(--accent-ink);}
.stepper button.step-pill[disabled]{cursor:not-allowed; opacity:.55;}
.step-nav{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:18px; flex-wrap:wrap;}

.reveal-box{border-left:3px solid var(--gold); background:var(--gold-soft); padding:12px 14px; border-radius:0 var(--r-s) var(--r-s) 0; margin:14px 0; font-size:1rem;}
.reveal-box .katex-display{margin:.3em 0;}
.tex-block{overflow-x:auto; padding:2px 0;}
.tex-block .katex-display{margin:.4em 0;}
.katex{color:inherit;}

/* ---- Fórmula clave: callout didáctico tipo texto escolar ---- */
.formula-callout{
  border:2px solid var(--formula); background:var(--formula-soft);
  border-radius:var(--r-m); padding:18px 20px 16px; margin:18px 0;
  position:relative; overflow-x:auto; box-shadow:0 4px 14px -8px rgba(200,16,46,.35);
}
.formula-callout .fc-tag{
  display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-weight:700;
  font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--formula); margin-bottom:8px;
}
.formula-callout .fc-tag svg{width:16px; height:16px; flex:none;}
.formula-callout .katex-display{margin:.25em 0; font-size:1.32em;}
.formula-callout .katex{color:var(--formula);}

/* ============ DETECTIVE MODE ============ */
.dossier{
  background:
    linear-gradient(var(--surface-2), var(--surface-2));
  border:1px solid var(--line); border-radius:var(--r-m); box-shadow:var(--shadow);
  padding:22px 22px 26px; position:relative; overflow:hidden;
}
.dossier::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 28px);
}
.case-tag{
  font-family:var(--font-type); font-size:.89rem; letter-spacing:.04em; color:var(--danger);
  border:2px solid var(--danger); display:inline-block; padding:.15em .6em; border-radius:3px;
  transform:rotate(-2deg); margin-bottom:10px;
}
.dossier h3{font-family:var(--font-type); font-size:1.2rem; letter-spacing:.01em;}
.claim-box{
  font-family:var(--font-type); background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--danger);
  padding:14px 16px; border-radius:0 var(--r-s) var(--r-s) 0; margin:14px 0; font-size:1.07rem; position:relative; z-index:1;
}
.stamp{
  position:absolute; top:14px; right:18px; font-family:var(--font-type); font-size:1.45rem; color:var(--ok);
  border:3px solid var(--ok); padding:2px 10px; border-radius:6px; transform:rotate(8deg); opacity:0;
  transition:opacity .3s, transform .3s;
}
.stamp.show{opacity:.85; transform:rotate(8deg) scale(1);}
.stamp.wrong{color:var(--danger); border-color:var(--danger);}

.progress-note{font-size:.89rem; color:var(--ink-faint); margin-top:6px;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:18px 0;}
.stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:14px 16px; box-shadow:var(--shadow);}
.stat-tile .num{font-family:var(--font-mono); font-size:1.75rem; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums;}
.stat-tile .lbl{font-size:.92rem; color:var(--ink-soft); margin-top:2px;}
.cert-card{
  position:relative; background:var(--surface); border:2px solid var(--gold); border-radius:var(--r-l);
  padding:44px 32px; margin-top:22px; box-shadow:var(--shadow); text-align:center; overflow:hidden;
}
.cert-card::before{content:""; position:absolute; inset:9px; border:1px solid var(--gold); opacity:.55; border-radius:calc(var(--r-l) - 6px); pointer-events:none;}
.cert-inner{position:relative; z-index:1;}
.cert-seal{
  width:64px; height:64px; margin:0 auto 14px; border-radius:50%; display:flex; align-items:center; justify-content:center;
}
.cert-seal .mascot-badge{width:64px !important; height:64px !important;}
.cert-eyebrow{font-family:var(--font-mono); letter-spacing:.14em; text-transform:uppercase; font-size:.88rem; color:var(--gold); font-weight:700;}
.cert-title{font-family:var(--font-display); font-size:1.35rem; margin:6px 0 22px; color:var(--ink);}
.cert-name{font-family:var(--font-display); font-size:clamp(1.7rem,4vw,2.5rem); margin:8px 0 2px; color:var(--ink); text-wrap:balance;}
.cert-role{color:var(--ink-soft); font-size:1.02rem; margin-bottom:20px;}
.cert-body{max-width:54ch; margin:0 auto 22px; color:var(--ink-soft); font-size:1.05rem;}
.cert-sig{display:inline-block; border-top:1.5px solid var(--line); padding-top:8px; margin-top:8px; font-size:.89rem; color:var(--ink-faint); min-width:240px;}
.cert-date{font-size:.92rem; color:var(--ink-faint); margin-top:10px;}
@media print{
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
  body *{ visibility:hidden; }
  #certCard, #certCard *{ visibility:visible; }
  #certCard{ position:absolute; top:0; left:0; width:100%; margin:0; box-shadow:none; border-color:#b9791e; }
  .no-print{ display:none !important; }
}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
.center-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
.eq-template{display:flex; align-items:center; gap:6px; flex-wrap:wrap; background:var(--panel-2,#f6f2fb); border:1.5px solid var(--border,#ddd); border-radius:12px; padding:10px 14px; margin:10px 0; font-size:1.08rem;}
.eq-template .eqt-input{width:58px; text-align:center; font:inherit; font-weight:700; padding:6px 4px; border-radius:8px; border:1.5px solid var(--border,#ccc); background:#fff;}
.eq-template .eqt-input:focus{outline:2px solid var(--accent,#6802C1); outline-offset:1px;}
.eq-template .eqt-sign{font:inherit; font-weight:700; padding:6px 2px; border-radius:8px; border:1.5px solid var(--border,#ccc); background:#fff; text-align:center;}
.eq-template .eqt-var{font-weight:700; font-style:italic; padding:0 1px;}
.eq-template .eqt-eq{font-weight:700; padding:0 4px;}
.eq-template.is-correct{border-color:var(--accent-2,#1f9d55); background:#eefaf1;}
.eq-template.is-wrong{border-color:var(--danger,#c0392b); background:#fdefee;}
@media (max-width:520px){ .eq-template{font-size:0.98rem; padding:8px 10px; gap:4px;} .eq-template .eqt-input{width:48px;} }
.step-stage{ min-height:74px; }
.step-slide{ opacity:0; transform:translateY(8px); transition:opacity .35s ease, transform .35s ease; background:var(--panel-2,#f6f2fb); border-left:4px solid var(--accent,#6802C1); border-radius:8px; padding:12px 16px; }
.step-slide.show{ opacity:1; transform:translateY(0); }
.step-num{ font-weight:700; font-size:.8rem; letter-spacing:.03em; text-transform:uppercase; color:var(--accent,#6802C1); margin-bottom:4px; }
.step-body{ font-size:1.05rem; }
.eq-template3 .eqt-input{width:52px;}
@media (max-width:640px){ .eq-template3{font-size:.92rem;} .eq-template3 .eqt-input{width:44px;} }

/* ---- XP / Insignias (Sistemas 3D) ---- */
.xp-panel{display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:14px 18px; box-shadow:var(--shadow); margin-bottom:18px; flex-wrap:wrap;}
.xp-level{font-weight:800; color:var(--accent); font-size:1.02rem; white-space:nowrap; font-family:var(--font-display);}
.xp-track{flex:1; min-width:140px; height:10px; border-radius:999px; background:var(--accent-soft); overflow:hidden;}
.xp-fill{height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:999px; transition:width .5s ease;}
.xp-num{font-family:var(--font-mono); font-size:.86rem; color:var(--ink-soft); white-space:nowrap;}
.badge-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
.badge-chip{display:flex; flex-direction:column; align-items:center; gap:5px; width:66px; opacity:.4; filter:grayscale(1);}
.badge-chip.unlocked{opacity:1; filter:none;}
.badge-chip .badge-circle{width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); border:2px solid var(--accent); color:var(--accent);}
.badge-chip.unlocked .badge-circle{background:linear-gradient(155deg, var(--accent), var(--accent-2)); color:var(--accent-ink); box-shadow:0 8px 18px -8px rgba(104,2,193,.5);}
.badge-chip .badge-circle svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.badge-chip.boss .badge-circle{background:var(--gold-soft); border-color:var(--gold); color:var(--gold);}
.badge-chip.boss.unlocked .badge-circle{background:linear-gradient(155deg, var(--gold), #E8871E); border-color:var(--gold); color:#fff;}
.badge-chip .badge-label{font-size:.72rem; text-align:center; color:var(--ink-soft); line-height:1.2;}
.boss-panel{border:2px solid var(--gold); background:linear-gradient(155deg, var(--gold-soft), var(--surface));}
.boss-panel h3{color:var(--gold);}
.xp-toast{position:fixed; bottom:18px; right:18px; background:var(--accent); color:var(--accent-ink); font-weight:700; font-family:var(--font-mono); padding:10px 16px; border-radius:999px; box-shadow:var(--shadow); z-index:50; opacity:0; transform:translateY(10px); transition:opacity .3s ease, transform .3s ease; pointer-events:none;}
.xp-toast.show{opacity:1; transform:translateY(0);}

/* ============ Funciones exponenciales: gráficas, laboratorio, sala en vivo ============ */
.jxg-wrap{margin:10px 0;}
.jxg-box.jxgbox{background:var(--surface) !important; border:1px solid var(--line) !important; border-radius:var(--r-m);}
.jxg-box svg text{fill:var(--ink-soft) !important; font-family:var(--font-mono);}
.slider-row{margin:12px 0 4px;}
.slider-row label{font-weight:600; font-size:.95rem; display:block; margin-bottom:4px;}
.slider-val{font-family:var(--font-mono); color:var(--accent); font-weight:700;}
.slider-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:4px 22px;}
.lab-readout{background:var(--accent-soft); border-radius:var(--r-s); padding:10px 14px; margin-top:10px; font-size:.98rem;}
.lab-readout.soft{background:var(--surface-2); font-size:.92rem;}
.lab-grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; text-align:center; font-size:.92rem;}
.kit-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:10px; font-size:.95rem; color:var(--ink-soft);}
.cond-list{list-style:none; margin:8px 0 14px; padding:0; display:grid; gap:6px;}
.cond-list li{padding:8px 12px; border-radius:var(--r-s); background:var(--surface-2); border-left:4px solid var(--line); font-size:.97rem;}
.cond-list li.ok{border-left-color:var(--ok); background:var(--ok-soft);}
.cond-list li.ok::before{content:"✓ "; color:var(--ok); font-weight:800;}
.cond-list li.no{border-left-color:var(--danger); background:var(--danger-soft);}
.cond-list li.no::before{content:"✗ "; color:var(--danger); font-weight:800;}
.p6-inputs{display:flex; gap:14px; flex-wrap:wrap; margin:10px 0;}
.p6-inputs label{display:block; font-weight:600; font-size:.88rem; margin-bottom:3px;}
button.linklike{background:none; border:none; padding:0; color:var(--accent); font-weight:600; text-decoration:underline; font-size:inherit;}
.datatable{border-collapse:collapse; margin:6px 0; font-family:var(--font-mono);}
.datatable th,.datatable td{border:1px solid var(--line); padding:6px 12px; text-align:center;}
.datatable th{background:var(--surface-2);}

/* ---- Sala en vivo ---- */
.live-banner{position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:60; width:min(700px,94vw);
  background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:9px 12px 9px 18px; display:flex; gap:12px; align-items:center; justify-content:space-between;
  box-shadow:var(--shadow); font-size:.95rem; line-height:1.3;}
.live-banner[hidden]{display:none;}
.live-banner .btn.primary{background:var(--accent-ink); color:var(--accent); border-color:var(--accent-ink); flex:none;}
.pulse-dot{display:inline-block; width:10px; height:10px; border-radius:50%; background:#2fd57a; margin-right:6px; animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,213,122,.6);}50%{box-shadow:0 0 0 8px rgba(47,213,122,0);}}
.live-hero{display:flex; gap:16px; align-items:center; flex-wrap:wrap;}
.live-hero p{margin-bottom:6px;}
.rules-list{margin:12px 0 4px 20px; color:var(--ink-soft); font-size:.97rem;}
.practice-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.practice-row p{width:100%;}
.count-big{font-family:var(--font-display); font-size:clamp(4rem,16vw,8rem); font-weight:800; text-align:center; color:var(--accent); line-height:1.1; font-variant-numeric:tabular-nums;}
.count-big.go{color:var(--gold); transform:scale(1.08);}
.play-top{display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px;}
.time-track{height:12px; border-radius:999px; background:var(--accent-soft); overflow:hidden; margin-bottom:14px;}
.time-fill{display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.time-fill.low{background:var(--danger);}
.play-q{font-size:1.25rem; line-height:1.4;}
.rank-table{border-collapse:collapse; width:100%; font-size:.98rem;}
.rank-table th,.rank-table td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line);}
.rank-table th{font-size:.82rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
.rank-table tr.me td{background:var(--accent-soft); font-weight:700;}
.extras-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:16px; margin-bottom:18px; align-items:start;}
.extras-grid .panel{margin:0;}
.vote-row{display:grid; grid-template-columns:1fr 90px 44px; gap:8px; align-items:center; padding:5px 0; font-size:.95rem;}
.vote-row.mine{font-weight:700; color:var(--accent);}
.vote-bar{height:8px; background:var(--accent-soft); border-radius:999px; overflow:hidden; display:block;}
.vote-bar span{display:block; height:100%; background:var(--accent); border-radius:999px;}
.doc-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; align-items:end;}
.doc-status{background:var(--accent-soft); border-radius:var(--r-s); padding:10px 14px;}
.doc-btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
@media (max-width:640px){ .live-banner{border-radius:18px; flex-direction:column; align-items:stretch; text-align:center;} .vote-row{grid-template-columns:1fr 60px 40px;} }
.choice[disabled]{color:var(--ink); opacity:.92;}
.choice{transition:background .15s, border-color .15s;}

/* ============ v2: móvil primero, calculadora, repaso, teoría, ritmo ============ */
.katex{font-size:1.1em;}
.tex-block{overflow-x:auto; overflow-y:hidden; max-width:100%;}
.tex-block .katex-display{margin:.4em 0;}
.tex-block .katex{font-size:1.28em;}
.choice .katex{font-size:1.12em;}
.choice{text-align:left; overflow-wrap:anywhere;}
.reveal-box,.feedback,.walk-step,.theory-body{overflow-wrap:anywhere;}

/* campos numéricos con botón ± */
.num-wrap{display:inline-flex; align-items:stretch; gap:6px; max-width:100%;}
.num-wrap input{padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font-family:var(--font-mono); font-size:1.05rem; min-width:0; max-width:100%;}
.num-wrap input:focus{border-color:var(--accent);}
.pm-btn{flex:none; min-width:44px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:8px; font-size:1.2rem; font-weight:700;}
.pm-btn:active{background:var(--accent-soft);}
.num-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin:10px 0;}
.num-label{display:block; font-weight:600; font-size:.92rem; margin-bottom:4px;}
.eval-rows{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-top:12px;}
.eval-cell{min-width:0;}

/* calculadora científica (hoja inferior) */
.calc-fab{position:fixed; right:14px; bottom:14px; z-index:55; display:flex; align-items:center; gap:8px; min-height:48px; padding:0 16px; border-radius:999px; border:none; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:1rem; box-shadow:var(--shadow);}
.calc-fab[hidden]{display:none;}
body.calc-open .calc-fab{display:none;}
.calc-sheet{position:fixed; left:0; right:0; bottom:0; z-index:70; background:var(--surface); border-top:3px solid var(--accent); border-radius:18px 18px 0 0; box-shadow:0 -10px 30px -12px rgba(43,4,80,.5); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto;}
.calc-sheet[hidden]{display:none;}
.calc-sheet.floating{right:auto; bottom:auto; margin:0; border:3px solid var(--accent); border-radius:18px; box-shadow:0 18px 40px -8px rgba(43,4,80,.55); padding-bottom:10px;}
.calc-sheet.dragging{opacity:.92; box-shadow:0 24px 50px -6px rgba(43,4,80,.65);}
.calc-grip{display:flex; align-items:center; justify-content:center; gap:10px; min-height:30px; margin:-4px 0 4px; border-radius:10px; background:var(--surface-2); color:var(--ink-soft); font-size:.8rem; font-weight:600; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;}
.calc-grip:active{cursor:grabbing;}
.calc-grip:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
.grip-dots{letter-spacing:.1em; opacity:.7;}
.calc-sheet.min .calc-display,.calc-sheet.min .calc-keys,.calc-sheet.min .calc-foot,.calc-sheet.min .calc-tour{display:none;}
.calc-sheet.min{padding-bottom:8px;}
.calc-tour{background:var(--surface-2); border:1.5px dashed var(--line); border-radius:12px; padding:8px 12px; margin-bottom:6px; font-size:.9rem;}
.calc-tour ol{margin:6px 0 8px; padding-left:20px;}
.calc-tour[hidden]{display:none;}
.calc-top{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; font-size:.95rem;}
.calc-top-r{display:flex; align-items:center; gap:8px;}
.calc-top label{font-size:.85rem; color:var(--ink-soft);}
.calc-top select{padding:4px 6px; border:1.5px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); font-size:.9rem;}
.calc-display{background:var(--surface-2); border:1.5px solid var(--line); border-radius:12px; padding:4px 12px; margin-bottom:6px; min-height:68px; display:flex; flex-direction:column; justify-content:space-between;}
.calc-expr{overflow-x:auto; overflow-y:hidden; white-space:nowrap; font-size:1.15rem; min-height:34px; line-height:1.6;}
.calc-expr .katex{font-size:1.2em;}
.calc-ph{color:var(--ink-faint); font-size:.88rem;}
.calc-res{text-align:right; font-family:var(--font-mono); font-size:1.3rem; font-weight:700; min-height:1.6em; color:var(--ink-faint);}
.calc-res.ok{color:var(--ok);}
.calc-exact{font-size:.78rem; font-weight:400; color:var(--ink-soft);}
.calc-keys{display:grid; grid-template-columns:repeat(5,1fr); gap:5px;}
.ckey.wide{grid-column:span 3;}
input[data-ans]{scroll-margin-top:90px;}
.ckey{min-height:42px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); font-size:1.1rem; font-weight:600; padding:0; touch-action:manipulation;}
.ckey:active{background:var(--accent-soft);}
.ckey.fn{background:var(--surface-2); font-size:1rem;}
.ckey.op{background:var(--accent-soft); color:var(--accent); font-size:1.25rem;}
.ckey.eq{background:var(--accent); color:var(--accent-ink); font-size:1.3rem;}
.ckey .katex{font-size:1.0em;}
.ckey{font-size:1.05rem;}
.calc-foot{display:flex; flex-direction:column; gap:6px; margin-top:8px;}
.calc-foot .btn{min-height:44px; width:100%;}
.calc-hint{font-size:.76rem; color:var(--ink-soft); line-height:1.35;}
body.calc-open .xp-toast{bottom:auto; top:70px;}
@media (max-height:640px){ .ckey{min-height:38px;} .calc-display{min-height:60px;} }

var STORAGE_KEY = "pob-mission-progress-v1";
function loadProgress(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}

  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
var progress = loadProgress();
function markSolved(phaseKey, missionKey){
  var already = !!(progress[phaseKey] && progress[phaseKey][missionKey]);
  if(!progress[phaseKey]) progress[phaseKey] = {};
  progress[phaseKey][missionKey] = true;
  if(!already){
    var wasDone = phaseDone(phaseKey, MISSION_TOTALS[phaseKey]);
    var gained = XP_PER_MISSION;
    saveProgress();
    if(!wasDone && phaseDone(phaseKey, MISSION_TOTALS[phaseKey])) gained += XP_PER_PHASE_BONUS;
    if(typeof showXPToast === "function") showXPToast(gained);
  } else {
    saveProgress();
  }
  maybeStampCompletion();
  syncSaveToSheet();
  renderTopbar();
}
function isSolved(phaseKey, missionKey){
  return !!(progress[phaseKey] && progress[phaseKey][missionKey]);
}
function phaseCompleteCount(phaseKey, total){
  var p = progress[phaseKey] || {};
  var n = 0;
  for(var k in p){ if(k.charAt(0)!=="_" && p[k]) n++; }
  return Math.min(n, total);
}
function phaseDone(phaseKey, total){
  return phaseCompleteCount(phaseKey, total) >= total;
}
var MISSION_TOTALS = {explora:6, evalua:5, grafica:6, interpreta:5, investiga:8, desafio:4, aplica:5};
function totalMissions(){
  var n=0; for(var k in MISSION_TOTALS) n+=MISSION_TOTALS[k]; return n;
}
function allPhasesDone(){
  return PHASES.every(function(ph){ return phaseDone(ph.key, MISSION_TOTALS[ph.key]); });
}

/* ---- XP, niveles e insignias coleccionables ---- */
var XP_PER_MISSION = 10, XP_PER_PHASE_BONUS = 25;
function flashXP(){
  var t = 0, f = progress._flash || {};
  for(var r in f){ if(f[r] && typeof f[r].pts === "number") t += f[r].pts; }
  return t;
}
function baseXP(){
  var xp = 0;
  PHASES.forEach(function(ph){
    xp += phaseCompleteCount(ph.key, MISSION_TOTALS[ph.key]) * XP_PER_MISSION;
    if(phaseDone(ph.key, MISSION_TOTALS[ph.key])) xp += XP_PER_PHASE_BONUS;
  });
  return xp;
}
function totalXP(){ return baseXP() + flashXP(); }
function maxXP(){ return totalMissions()*XP_PER_MISSION + PHASES.length*XP_PER_PHASE_BONUS; }
var LEVELS = [
  {min:0,   name:"Aprendiz"},
  {min:140, name:"Explorador"},
  {min:320, name:"Estratega"},
  {min:565, name:"Maestro del Crecimiento"}
];
/* El último nivel (Maestro) exige haber completado las 7 fases, no solo juntar XP con relámpagos */
function levelFor(xp, allDone){
  var lv = LEVELS[0];
  for(var i=0;i<LEVELS.length;i++){ if(xp >= LEVELS[i].min && (i < LEVELS.length-1 || allDone)) lv = LEVELS[i]; }
  return lv;
}
function currentLevelInfo(xp){ return levelFor(xp, allPhasesDone()); }
function nextLevelInfo(xp){
  var i = LEVELS.indexOf(currentLevelInfo(xp));
  return LEVELS[i+1] || null;
}
function nextLevelText(xp){
  var nxt = nextLevelInfo(xp);
  if(!nxt) return " · ¡nivel máximo!";
  return nxt.min > xp ? " · faltan "+(nxt.min-xp)+" XP para "+nxt.name : " · completa las 7 fases para ser "+nxt.name;
}
function anyFlashPlayed(){ return flashXP() > 0 || (progress._flash && Object.keys(progress._flash).length > 0); }
function badgeChips(forceUnlocked){
  var chips = [];
  PHASES.forEach(function(ph){
    var unlocked = forceUnlocked || phaseDone(ph.key, MISSION_TOTALS[ph.key]);
    chips.push('<div class="badge-chip'+(unlocked?" unlocked":"")+'"><span class="badge-circle">'+PHASE_ICONS[ph.id]+'</span><span class="badge-label">'+ph.label+'</span></div>');
  });
  chips.push('<div class="badge-chip boss'+((forceUnlocked||isSolved("aplica","represa"))?" unlocked":"")+'"><span class="badge-circle">'+ICON_BOSS+'</span><span class="badge-label">Jefe final</span></div>');
  chips.push('<div class="badge-chip boss'+((anyFlashPlayed())?" unlocked":"")+'"><span class="badge-circle">'+ICON_BOLT+'</span><span class="badge-label">Relámpago</span></div>');
  chips.push('<div class="badge-chip boss'+((forceUnlocked||allPhasesDone())?" unlocked":"")+'"><span class="badge-circle">'+ICON_MASTER+'</span><span class="badge-label">Maestro</span></div>');
  return chips.join("");
}
function renderXPPanel(parent, opts){
  opts = opts || {};
  var xp = totalXP(), max = maxXP();
  var lv = currentLevelInfo(xp), nxt = nextLevelInfo(xp);
  var pct = Math.min(100, Math.round(xp/max*100));
  var panel = el("div","xp-panel");
  panel.innerHTML =
    '<span class="xp-level">🏅 '+lv.name+'</span>'+
    '<div class="xp-track"><span class="xp-fill" style="width:'+pct+'%"></span></div>'+
    '<span class="xp-num">'+(xp<=max ? xp+' / '+max : xp)+' XP'+nextLevelText(xp)+'</span>';
  parent.appendChild(panel);
  if(opts.hideBadges) return;
  var badgeRow = el("div","badge-row");
  badgeRow.innerHTML = badgeChips(false);

}
function showXPToast(amount){

/* ---- Respaldo en la nube (opcional, vía Google Sheets + Apps Script) ----
   Si tu profesor(a) configuró un backend de respaldo, pega aquí la URL de tu
   Apps Script Web App (termina en /exec). Si se deja como está, la app
   funciona igual que siempre, solo que sin respaldo en la nube: el progreso
   queda únicamente en este navegador (y sin ranking ni sala en vivo). */
var SHEET_API_URL = "https://script.google.com/macros/s/URL_DE_PRODUCCION_RETIRADA/exec";
function sheetSyncConfigured(){
  return typeof SHEET_API_URL === "string" && SHEET_API_URL.indexOf("https://") === 0;
}
function firstNameOf(n){
  var t = String(n || "").trim().split(/\s+/)[0] || "Anónimo";
  return t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
}
function mergeRemoteProgress(remote){
  if(!remote || typeof remote !== "object") return false;
  var changed = false;
  if(typeof remote._apodo === "string" && remote._apodo && !progress._apodo){ progress._apodo = remote._apodo; changed = true; }
  for(var phaseKey in remote){
    var rv = remote[phaseKey];
    if(!rv || typeof rv !== "object") continue;
    if(phaseKey === "_flash"){
      if(!progress._flash) progress._flash = {};
      for(var r in rv){
        if(rv[r] && typeof rv[r].pts === "number" && !progress._flash[r]){ progress._flash[r] = rv[r]; changed = true; }
      }
      continue;
    }
    if(phaseKey === "_reflex"){
      if(!progress._reflex) progress._reflex = {};
      for(var rk in rv){
        if(rv[rk] && typeof rv[rk].t === "string" && (!progress._reflex[rk] || (rv[rk].at || 0) > (progress._reflex[rk].at || 0))){ progress._reflex[rk] = rv[rk]; changed = true; }
      }
      continue;
    }
    if(phaseKey === "_pregunta"){
      if(!progress._pregunta) progress._pregunta = {};
      for(var d in rv){ if(typeof rv[d] === "string" && !progress._pregunta[d]){ progress._pregunta[d] = rv[d]; changed = true; } }
      continue;
    }
    if(phaseKey.charAt(0) === "_") continue;
    if(!progress[phaseKey]) progress[phaseKey] = {};
    for(var missionKey in rv){
      if(rv[missionKey] && !progress[phaseKey][missionKey]){
        progress[phaseKey][missionKey] = true;
        changed = true;
      }
    }
  }
  return changed;
}
/* ---- Guardado en la nube con cola y reintentos ----
   Muchos estudiantes guardan a la vez (por ejemplo al terminar una ronda relámpago). Si el
   respaldo está ocupado o se cae la conexión, el avance queda seguro en este dispositivo y la
   página reintenta sola con esperas crecientes. Nada se pierde ni se bloquea la pantalla. */
var SAVE_PENDING_KEY = "pob-save-pending-v1";
var SAVE_Q = {busy: false, pending: false, fails: 0, timer: null, cbs: []};
function setSaveChip(show, text){
  var c = document.getElementById("saveChip");
  if(!show){ if(c) c.hidden = true; return; }
  if(!c){ c = document.createElement("div"); c.id = "saveChip"; c.className = "save-chip"; c.setAttribute("role", "status"); document.body.appendChild(c); }
  c.hidden = false; c.textContent = text;
}
function saveSetPending(v){ try{ if(v) localStorage.setItem(SAVE_PENDING_KEY, "1"); else localStorage.removeItem(SAVE_PENDING_KEY); }catch(e){} }
function saveHasPending(){ try{ return localStorage.getItem(SAVE_PENDING_KEY) === "1"; }catch(e){ return false; } }
function syncSaveToSheet(cb){
  if(!sheetSyncConfigured() || !student){ if(typeof cb === "function") cb(false); return; }
  if(typeof cb === "function") SAVE_Q.cbs.push(cb);
  SAVE_Q.pending = true; saveSetPending(true);
  if(SAVE_Q.timer || SAVE_Q.busy) return;
  // pequeña espera al azar: 30 personas guardando en el mismo segundo saturan el respaldo
  SAVE_Q.timer = setTimeout(saveFlush, 150 + Math.random() * 2200);
}
function saveDone(ok){
  var cbs = SAVE_Q.cbs; SAVE_Q.cbs = [];
  cbs.forEach(function(f){ try{ f(ok); }catch(e){} });
}
function saveFlush(){
  SAVE_Q.timer = null;
  if(SAVE_Q.busy || !student) return;
  SAVE_Q.busy = true; SAVE_Q.pending = false;
  var failed = function(){
    SAVE_Q.busy = false; SAVE_Q.pending = true; SAVE_Q.fails++;
    if(SAVE_Q.fails === 1) saveDone(false);   // quien esperaba (p. ej. el ranking) no se queda colgado
    if(SAVE_Q.fails >= 2) setSaveChip(true, "☁️ Sin conexión con la nube: tu avance está seguro en este dispositivo y se reintenta solo.");
    var wait = Math.min(60000, 3000 * Math.pow(2, Math.min(SAVE_Q.fails, 5))) + Math.random() * 2500;
    SAVE_Q.timer = setTimeout(saveFlush, wait);
  };
  try{
    fetch(SHEET_API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({
        action: "save",
        actividad: "poblacion",
        nombre: student.name,
        carrera: student.carrera,
        progreso: progress,
        completadoEn: getCompletedAt() || ""
      })
    }).then(function(r){ return r.text(); }).then(function(t){
      var d = null; try{ d = JSON.parse(t); }catch(e){}
      if(!d || d.ok !== true){ failed(); return; }
      SAVE_Q.busy = false; SAVE_Q.fails = 0;
      if(SAVE_Q.pending){ SAVE_Q.timer = setTimeout(saveFlush, 400); }
      else { saveSetPending(false); setSaveChip(false); }
      saveDone(true);
    }).catch(failed);
  }catch(e){ failed(); }
}
/* Si volvió el internet o la pestaña vuelve a estar visible, se reintenta enseguida lo que quedó pendiente */
function saveRetryNow(){
  if(!student || !sheetSyncConfigured()) return;
  if(SAVE_Q.pending || saveHasPending()){
    if(SAVE_Q.timer && !SAVE_Q.busy){ clearTimeout(SAVE_Q.timer); SAVE_Q.timer = null; }
    if(!SAVE_Q.busy){ SAVE_Q.pending = true; SAVE_Q.timer = setTimeout(saveFlush, 300 + Math.random() * 1500); }
  }
}
window.addEventListener("online", saveRetryNow);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) saveRetryNow(); });
function syncLoadFromSheet(name, carrera, done){
  if(!sheetSyncConfigured()){ done(); return; }
  var finished = false;
  function finish(){ if(finished) return; finished = true; done(); }
  try{
    fetch(SHEET_API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({action:"load", actividad:"poblacion", nombre:name, carrera:carrera})
    }).then(function(r){ return r.json(); }).then(function(data){
      if(data && data.found && data.progreso){
        mergeRemoteProgress(data.progreso);
        saveProgress();
        if(data.completadoEn){
          try{ localStorage.setItem(COMPLETED_KEY, data.completadoEn); }catch(e){}
        }
      }
      finish();
    }).catch(function(){ finish(); loadRetryLater(name, carrera, 1); });
  }catch(e){ finish(); }
  setTimeout(finish, 6000); // nunca dejamos al estudiante esperando de más
}
/* Si la nube no respondió al entrar, se reintenta en silencio (8 s, 25 s, 60 s) para traer el avance guardado */
function loadRetryLater(name, carrera, n){
  if(n > 3) return;
  setTimeout(function(){
    try{
      fetch(SHEET_API_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({action:"load", actividad:"poblacion", nombre:name, carrera:carrera})})
        .then(function(r){ return r.json(); }).then(function(data){
          if(data && data.found && data.progreso && mergeRemoteProgress(data.progreso)){
            saveProgress(); renderTopbar(); if(route === "map") render();
          }
        }).catch(function(){ loadRetryLater(name, carrera, n + 1); });
    }catch(e){}
  }, n === 1 ? 8000 : (n === 2 ? 25000 : 60000));
}

}

function rich(s){ return String(s).replace(/\$\$([^$]+)\$\$/g, function(m, t){ return KB(t); }).replace(/\$([^$]+)\$/g, function(m, t){ return K(t); }); }
function shuffleOrder(n){
  var a = [], i, j, t;
  for(i = 0; i < n; i++) a.push(i);
  for(i = n - 1; i > 0; i--){ j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

  if(s === null || s === undefined) return NaN;

  return isFinite(v) ? v : NaN;
}

function expTex(a, b, k, h){
  var s = "";
  var bs = fmt(b, 3), hs = h ? (h > 0 ? "x-" + fmt(h) : "x+" + fmt(-h)) : "x";
  var core = bs + "^{" + hs + "}";
  if(a === 1) s = core; else if(a === -1) s = "-" + core; else s = fmt(a, 3) + "\\cdot " + core;
  if(k > 0) s += "+" + fmt(k, 3); else if(k < 0) s += "-" + fmt(-k, 3);
  return "f(x)=" + s;
}

/* ---- Calculadora científica en pantalla (no hace falta teclado: el exponente se ve como exponente) ---- */
function calcNorm(s){
  return String(s).replace(/\s+/g, "").replace(/,/g, ".").replace(/×/g, "*").replace(/÷/g, "/").replace(/[−–]/g, "-").replace(/π/g, "pi").replace(/√/g, "sqrt");
}
function calcToTex(src){
  var s = calcNorm(src), out = "", st = [], i = 0;
  while(i < s.length){
    var rest = s.slice(i);
    if(rest.indexOf("^(") === 0){ out += "^{"; st.push("}"); i += 2; continue; }
    if(rest.charAt(0) === "^"){
      var mm = /^\^(-?(?:\d+\.?\d*|\.\d+|pi|e))/.exec(rest);
      if(mm){ out += "^{" + calcToTex(mm[1]) + "}"; i += mm[0].length; continue; }
      out += "^{}"; i++; continue;
    }
    if(rest.indexOf("sqrt(") === 0){ out += "\\sqrt{"; st.push("}"); i += 5; continue; }
    if(rest.indexOf("exp(") === 0){ out += "e^{"; st.push("}"); i += 4; continue; }
    if(rest.indexOf("ln(") === 0){ out += "\\ln\\left("; st.push("\\right)"); i += 3; continue; }
    if(rest.indexOf("log(") === 0){ out += "\\log\\left("; st.push("\\right)"); i += 4; continue; }
    if(rest.indexOf("pi") === 0){ out += "\\pi "; i += 2; continue; }
    var c = rest.charAt(0);
    if(c === "("){ out += "\\left("; st.push("\\right)"); i++; continue; }
    if(c === ")"){ if(st.length) out += st.pop(); i++; continue; }
    if(c === "*"){ out += "\\cdot "; i++; continue; }
    if(c === "/"){ out += "\\div "; i++; continue; }
    out += c; i++;
  }
  while(st.length) out += st.pop();
  return out || "\\ ";
}
function calcEval(src){
  var s = calcNorm(src);
  if(!s) return {empty: true};
  var open = 0, k;
  for(k = 0; k < s.length; k++){
    if(s.charAt(k) === "(") open++;
    else if(s.charAt(k) === ")"){ open--; if(open < 0) return {err: "Hay un paréntesis de cierre de más."}; }
  }
  s += new Array(open + 1).join(")");
  var toks = s.match(/\d+\.?\d*|\.\d+|pi|sqrt|exp|log|ln|e|[()+\-*\/^]/g) || [];
  if(toks.join("") !== s) return {err: "Hay un símbolo que no reconozco."};
  var pos = 0;
  function peek(){ return toks[pos]; }
  function fail(m){ throw new Error(m); }
  function isStart(t){ return t !== undefined && (/^[\d.]/.test(t) || t === "pi" || t === "e" || t === "(" || t === "sqrt" || t === "exp" || t === "ln" || t === "log"); }
  function atom(){
    var t = toks[pos++];
    if(t === undefined) fail("La operación está incompleta.");
    if(/^[\d.]/.test(t)) return parseFloat(t);
    if(t === "pi") return Math.PI;
    if(t === "e") return Math.E;
    if(t === "("){ var v = expr(); if(toks[pos++] !== ")") fail("Falta cerrar un paréntesis."); return v; }
    if(t === "sqrt" || t === "exp" || t === "ln" || t === "log"){
      if(toks[pos++] !== "(") fail("Después de esa función abre un paréntesis.");
      var a = expr(); if(toks[pos++] !== ")") fail("Falta cerrar un paréntesis.");
      if(t === "sqrt"){ if(a < 0) fail("No existe la raíz de un número negativo."); return Math.sqrt(a); }
      if(t === "exp") return Math.exp(a);
      if(a <= 0) fail("El logaritmo pide un número positivo.");
      return t === "log" ? Math.log(a) / Math.LN10 : Math.log(a);
    }
    fail("Hay algo fuera de lugar en la operación.");
  }
  function unaryExp(){ if(peek() === "-"){ pos++; return -unaryExp(); } if(peek() === "+"){ pos++; return unaryExp(); } return powr(); }
  function powr(){ var b = atom(); if(peek() === "^"){ pos++; var e = unaryExp(); return Math.pow(b, e); } return b; }
  function unary(){ if(peek() === "-"){ pos++; return -unary(); } if(peek() === "+"){ pos++; return unary(); } return powr(); }
  function term(){
    var v = unary();
    for(;;){
      var t = peek();
      if(t === "*"){ pos++; v *= unary(); }
      else if(t === "/"){ pos++; v /= unary(); }
      else if(isStart(t)){ v *= unary(); }
      else break;
    }
    return v;
  }
  function expr(){
    var v = term();
    for(;;){
      var t = peek();
      if(t === "+"){ pos++; v += term(); }
      else if(t === "-"){ pos++; v -= term(); }
      else break;
    }
    return v;
  }
  try{
    var val = expr();
    if(pos < toks.length) fail("Sobra algo al final de la operación.");
    if(!isFinite(val)) fail("Ese resultado no es un número real finito.");
    return {val: val};
  }catch(e){ return {err: e.message}; }
}

var calcState = {expr: "", ans: null, dec: 3};
function calcRound(v, dec){ return dec === "full" ? String(Number(v.toPrecision(12))) : v.toFixed(parseInt(dec, 10)); }
function buildCalcSheet(){
  var sheet = document.createElement("div");
  sheet.id = "calcSheet"; sheet.className = "calc-sheet"; sheet.hidden = true;
  sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-label", "Calculadora científica");
  var KEYS = [
    ["C", "clear", "fn"], ["⌫", "back", "fn"], ["(", "(", "op"], [")", ")", "op"], ["÷", "/", "op"],
    [K("x^{y}"), "^(", "fn"], [K("x^{2}"), "^(2)", "fn"], [K("\\sqrt{x}"), "sqrt(", "fn"], [K("x^{3}"), "^(3)", "fn"], ["×", "*", "op"],
    ["7", "7"], ["8", "8"], ["9", "9"], [K("\\tfrac{1}{x}"), "1/(", "fn"], ["−", "-", "op"],
    ["4", "4"], ["5", "5"], ["6", "6"], ["π", "pi", "fn"], ["+", "+", "op"],
    ["1", "1"], ["2", "2"], ["3", "3"], ["(−)", "(-", "fn"], ["ANS", "ans", "fn"],
    ["0", "0"], [".", "."], ["log", "log(", "fn"], ["ln", "ln(", "fn"], ["=", "eq", "eq"]
  ];
  sheet.innerHTML =
    '<div class="calc-grip" id="calcGrip" role="button" tabindex="0" aria-label="Arrastra para mover la calculadora (también con las flechas del teclado)"><span class="grip-dots" aria-hidden="true">⠿ ⠿ ⠿</span><span class="grip-txt">Arrastra aquí para mover</span></div>' +
    '<div class="calc-top"><strong>🧮<span class="calc-title"> Calculadora</span></strong>' +
    '<div class="calc-top-r"><label title="Cuántos decimales mostrar"><span class="lbl-dec">Decimales</span><span class="lbl-dec-s">Dec.</span> <select id="calcDec"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="full">todos</option></select></label>' +
    '<button type="button" class="btn sm ghost" id="calcGhost" aria-label="Hacer transparente la calculadora para ver lo que hay detrás" title="Transparente: ver lo que hay detrás">👁</button>' +
    '<button type="button" class="btn sm ghost" id="calcSize" aria-label="Cambiar el tamaño de la calculadora" title="Tamaño: compacta / normal / grande">⤢</button>' +
    '<button type="button" class="btn sm ghost" id="calcMin" aria-label="Minimizar o ampliar la calculadora" title="Minimizar / ampliar (también con doble toque en la barra)">▁</button>' +
    '<button type="button" class="btn sm ghost" id="calcDock" aria-label="Devolver a su lugar" title="Devolver a su lugar inicial">⤓</button>' +
    '<button type="button" class="btn sm ghost" id="calcClose" aria-label="Cerrar la calculadora">✕</button></div></div>' +
    '<div class="calc-tour" id="calcTour" hidden><strong>Cómo usarla en 3 pasos</strong><ol><li>Toca las teclas para escribir la operación (por ejemplo <span class="mono">1.02</span>, luego <strong>xʸ</strong>, luego <span class="mono">3</span> y <strong>)</strong>).</li><li>Mira el resultado debajo de la operación. Elige cuántos <strong>decimales</strong> quieres.</li><li>Toca tu campo de respuesta y luego <strong>Pasar al campo</strong>. Puedes <strong>arrastrarla</strong> para ver lo que hay detrás.</li></ol><button type="button" class="btn sm primary" id="calcTourOk">Entendido</button></div>' +
    '<div class="calc-display"><div class="calc-expr" id="calcExpr" aria-live="polite"></div><div class="calc-res" id="calcRes"></div></div>' +
    '<div class="calc-keys" id="calcKeys"></div>' +
    '<div class="calc-foot"><button type="button" class="btn primary" id="calcUse">Pasar al campo de respuesta ↩</button><span class="calc-hint" id="calcHint"></span></div>';
  document.body.appendChild(sheet);
  var keysEl = sheet.querySelector("#calcKeys");
  KEYS.forEach(function(k){
    var b = document.createElement("button");
    b.type = "button"; b.className = "ckey " + (k[2] || "num"); b.innerHTML = k[0];
    b.setAttribute("data-k", k[1]);
    keysEl.appendChild(b);
  });
  keysEl.addEventListener("click", function(ev){
    var b = ev.target.closest(".ckey"); if(!b) return;
    calcPress(b.getAttribute("data-k"));
  });
  sheet.querySelector("#calcClose").addEventListener("click", closeCalc);
  function minToggle(){ sheet.classList.toggle("min"); calcFixPadding(); calcClamp(); }
  sheet.querySelector("#calcMin").addEventListener("click", minToggle);
  sheet.querySelector("#calcGrip").addEventListener("dblclick", minToggle);
  sheet.querySelector("#calcGhost").addEventListener("click", function(){
    var on = sheet.classList.toggle("ghost");
    try{ localStorage.setItem(CALC_GHOST_KEY, on ? "1" : "0"); }catch(e){}
  });
  sheet.querySelector("#calcSize").addEventListener("click", function(){
    calcSize = (calcSize + 1) % 3;
    try{ localStorage.setItem(CALC_SIZE_KEY, String(calcSize)); }catch(e){}
    if(sheet.classList.contains("floating")) calcClamp();
    else if(window.innerWidth >= 720) calcApplyPos(sheet, {def: true});
  });
  sheet.querySelector("#calcDock").addEventListener("click", function(){
    calcSavePos(null);
    if(window.innerWidth >= 720) calcApplyPos(sheet, {def: true}); else calcApplyPos(sheet, null);
    calcFixPadding();
  });
  sheet.querySelector("#calcTourOk").addEventListener("click", function(){ sheet.querySelector("#calcTour").hidden = true; try{ localStorage.setItem("pob-calc-tour", "1"); }catch(e){} calcFixPadding(); calcClamp(); });
  calcInitDrag(sheet);
  sheet.querySelector("#calcDec").addEventListener("change", function(ev){ calcState.dec = ev.target.value; calcPaint(); });
  sheet.querySelector("#calcUse").addEventListener("click", calcUseResult);
  document.addEventListener("keydown", function(ev){
    if(sheet.hidden) return;
    var tg = ev.target && ev.target.tagName;
    if(tg === "INPUT" || tg === "TEXTAREA" || tg === "SELECT") return;
    var key = ev.key;
    if(/^[0-9.+\-*\/()]$/.test(key)){ calcPress(key); ev.preventDefault(); }
    else if(key === "^"){ calcPress("^("); ev.preventDefault(); }
    else if(key === "Enter" || key === "="){ calcPress("eq"); ev.preventDefault(); }
    else if(key === "Backspace"){ calcPress("back"); ev.preventDefault(); }
    else if(key === "Escape"){ closeCalc(); }
  });
  return sheet;
}
function calcPress(k){
  var s = calcState;
  if(k === "clear") s.expr = "";
  else if(k === "back"){
    var m = /(sqrt\(|exp\(|log\(|ln\(|\^\(|pi)$/.exec(s.expr);
    s.expr = m ? s.expr.slice(0, -m[0].length) : s.expr.slice(0, -1);
  }
  else if(k === "eq"){
    var r = calcEval(s.expr);
    if(r.val !== undefined){ s.ans = r.val; s.expr = String(Number(r.val.toPrecision(12))); }
  }
  else if(k === "ans"){ if(s.ans !== null) s.expr += String(Number(s.ans.toPrecision(12))); }
  else s.expr += k;
  calcPaint();
}
function calcPaint(){
  var ex = document.getElementById("calcExpr"), rs = document.getElementById("calcRes");
  if(!ex) return;
  ex.innerHTML = calcState.expr ? K(calcToTex(calcState.expr)) : '<span class="calc-ph">Toca las teclas para escribir tu operación</span>';
  var r = calcEval(calcState.expr);
  if(r.empty){ rs.innerHTML = ""; rs.className = "calc-res"; }
  else if(r.err){ rs.textContent = calcState.expr ? "…" : ""; rs.className = "calc-res soft"; rs.title = r.err; }
  else {
    var shown = calcRound(r.val, calcState.dec);
    var exact = String(Number(r.val.toPrecision(12)));
    rs.innerHTML = "= " + shown + (calcState.dec !== "full" && Number(shown) !== Number(exact) ? ' <span class="calc-exact">(exacto ≈ ' + exact + ')</span>' : "");
    rs.className = "calc-res ok";
  }
  ex.scrollLeft = ex.scrollWidth;
  refreshCalcUse();
}
function refreshCalcUse(){
  var btn = document.getElementById("calcUse"), hint = document.getElementById("calcHint");
  if(!btn) return;
  var ok = calcTarget && document.body.contains(calcTarget) && !calcTarget.disabled;
  btn.disabled = !ok || calcEval(calcState.expr).val === undefined;
  hint.innerHTML = ok ? 'Se pasará a: <strong>' + (calcTarget.getAttribute("aria-label") || "tu campo de respuesta") + '</strong>. Exponente: toca <strong>xʸ</strong>, escríbelo y cierra con <strong>)</strong>.' : 'Toca primero el campo de tu respuesta (la calculadora sigue abierta).';
}
function calcUseResult(){
  var r = calcEval(calcState.expr);
  if(r.val === undefined || !calcTarget || !document.body.contains(calcTarget)) return;
  calcTarget.value = calcRound(r.val, calcState.dec);
  calcTarget.dispatchEvent(new Event("input", {bubbles: true}));
  closeCalc();
  try{ calcTarget.scrollIntoView({block: "center", behavior: "smooth"}); }catch(e){}
}
/* ---- Posición de la calculadora: anclada abajo o flotante (se arrastra con el dedo o el mouse) ---- */
var CALC_POS_KEY = "pob-calc-pos-v1";
function calcLoadPos(){
  try{ var p = JSON.parse(localStorage.getItem(CALC_POS_KEY)); return p && typeof p.x === "number" && typeof p.y === "number" ? p : null; }catch(e){ return null; }
}
function calcSavePos(p){ try{ if(p) localStorage.setItem(CALC_POS_KEY, JSON.stringify(p)); else localStorage.removeItem(CALC_POS_KEY); }catch(e){} }
var CALC_SIZE_KEY = "pob-calc-size-v1", CALC_GHOST_KEY = "pob-calc-ghost-v1";
var calcSize = 1;   // 0 compacta · 1 normal · 2 grande (solo se nota en pantallas anchas)
try{ var cs0 = parseInt(localStorage.getItem(CALC_SIZE_KEY), 10); if(cs0 >= 0 && cs0 <= 2) calcSize = cs0; }catch(e){}
function calcWidth(){
  var vw = window.innerWidth;
  if(vw >= 720) return [272, 322, 400][calcSize];
  return Math.min(560, vw - 16);
}
/* Coloca la calculadora. p = {x, y} libre, o {def:true} = esquina inferior derecha (posición inicial en PC).
   Se permite empujarla casi fuera de la pantalla: solo debe quedar a la vista su barra de arrastre. */
function calcApplyPos(sheet, p){
  if(!p){
    sheet.classList.remove("floating", "compact");
    sheet.style.left = sheet.style.top = sheet.style.width = "";
    return;
  }
  var vw = window.innerWidth, vh = window.innerHeight;
  sheet.classList.add("floating");
  sheet.classList.remove("sz0", "sz1", "sz2"); sheet.classList.add("sz" + calcSize);
  var w = calcWidth();
  sheet.style.width = w + "px";
  // si es más alta que la ventana, se compacta sola (teclas más bajas, sin ayudas) para que quepa sin hacer zoom
  sheet.classList.remove("compact");
  if(sheet.offsetHeight > Math.max(300, vh * 0.72) && !sheet.classList.contains("min")) sheet.classList.add("compact");
  var h = sheet.offsetHeight;
  var x, y;
  if(p.def){ x = vw - w - 18; y = vh - h - 18; }
  else { x = p.x; y = p.y; }
  var wide = vw >= 720;   // en PC se puede empujar casi fuera de la pantalla; en celular se mantiene dentro
  var minX = wide ? -(w - 120) : 8, maxX = wide ? vw - 120 : Math.max(8, vw - w - 8), maxY = vh - 46;
  x = Math.max(minX, Math.min(maxX, x)); y = Math.max(0, Math.min(maxY, y));
  if(p.def){ x = Math.max(8, x); y = Math.max(8, y); }
  sheet.style.left = x + "px"; sheet.style.top = y + "px";
}
function calcClamp(){
  var sheet = document.getElementById("calcSheet");
  if(!sheet || sheet.hidden || !sheet.classList.contains("floating")) return;
  var r = sheet.getBoundingClientRect();
  calcApplyPos(sheet, {x: r.left, y: r.top});
}
function calcFixPadding(){
  var sheet = document.getElementById("calcSheet");
  if(!sheet || sheet.hidden || sheet.classList.contains("floating")){ document.body.style.paddingBottom = ""; return; }
  document.body.style.paddingBottom = (sheet.offsetHeight + 16) + "px";
}
function calcInitDrag(sheet){
  var grip = sheet.querySelector("#calcGrip");
  grip.addEventListener("pointerdown", function(ev){
    ev.preventDefault();
    var r = sheet.getBoundingClientRect();
    if(!sheet.classList.contains("floating")){ calcApplyPos(sheet, {x: r.left, y: r.top}); document.body.style.paddingBottom = ""; r = sheet.getBoundingClientRect(); }
    var offX = ev.clientX - r.left, offY = ev.clientY - r.top;
    try{ grip.setPointerCapture(ev.pointerId); }catch(e){}
    sheet.classList.add("dragging");
    function mv(e){ calcApplyPos(sheet, {x: e.clientX - offX, y: e.clientY - offY}); }
    function up(){
      grip.removeEventListener("pointermove", mv); grip.removeEventListener("pointerup", up); grip.removeEventListener("pointercancel", up);
      sheet.classList.remove("dragging");
      var r2 = sheet.getBoundingClientRect(); calcSavePos({x: r2.left, y: r2.top});
    }
    grip.addEventListener("pointermove", mv); grip.addEventListener("pointerup", up); grip.addEventListener("pointercancel", up);
  });
  grip.addEventListener("keydown", function(ev){
    var d = {ArrowLeft: [-24, 0], ArrowRight: [24, 0], ArrowUp: [0, -24], ArrowDown: [0, 24]}[ev.key];
    if(!d) return;
    ev.preventDefault();
    var r = sheet.getBoundingClientRect();
    calcApplyPos(sheet, {x: r.left + d[0], y: r.top + d[1]}); document.body.style.paddingBottom = "";
    var r2 = sheet.getBoundingClientRect(); calcSavePos({x: r2.left, y: r2.top});
  });
  window.addEventListener("resize", function(){ calcClamp(); calcFixPadding(); });
}
function openCalc(){
  var sheet = document.getElementById("calcSheet") || buildCalcSheet();
  sheet.hidden = false;
  document.body.classList.add("calc-open");
  var seen = false; try{ seen = !!localStorage.getItem("pob-calc-tour"); }catch(e){}
  sheet.querySelector("#calcTour").hidden = seen;
  var p = calcLoadPos();
  var ghost = false; try{ ghost = localStorage.getItem(CALC_GHOST_KEY) === "1"; }catch(e){}
  sheet.classList.toggle("ghost", ghost);
  if(p) calcApplyPos(sheet, p);
  else if(window.innerWidth >= 720) calcApplyPos(sheet, {def: true});   // en PC nace flotando en la esquina, sin tapar el ejercicio
  else calcApplyPos(sheet, null);
  calcFixPadding();
  calcPaint();
}
function closeCalc(){
  var sheet = document.getElementById("calcSheet");
  if(sheet) sheet.hidden = true;
  document.body.classList.remove("calc-open");
  document.body.style.paddingBottom = "";
}

/* ---- Recorrido paso a paso (ejemplos guiados) ---- */
function stepWalk(parent, steps){
  var i = 0;
  var box = el("div", "walk");
  parent.appendChild(box);
  function draw(){
    var s = steps[i];
    box.innerHTML =
      '<div class="walk-dots">' + steps.map(function(_, j){ return '<span class="wd' + (j === i ? " on" : (j < i ? " done" : "")) + '"></span>'; }).join("") + '</div>' +
      '<div class="walk-step"><div class="walk-tag">' + s.title + '</div><div>' + rich(s.html) + '</div></div>' +
      '<div class="walk-nav"><button type="button" class="btn sm ghost" id="wk_prev"' + (i === 0 ? " disabled" : "") + '>← Anterior</button>' +
      '<span class="mono" style="font-size:.85rem;">' + (i + 1) + ' / ' + steps.length + '</span>' +
      '<button type="button" class="btn sm primary" id="wk_next"' + (i === steps.length - 1 ? " disabled" : "") + '>Siguiente →</button></div>';
    box.querySelector("#wk_prev").addEventListener("click", function(){ if(i > 0){ i--; draw(); } });
    box.querySelector("#wk_next").addEventListener("click", function(){ if(i < steps.length - 1){ i++; draw(); } });
  }
  draw();
  return box;
}

/* Si el eje pasa muy cerca del borde, amplía el rango para que los números del eje no se recorten */
function padRange(r, frac){
  var lo = r[0], hi = r[1];
  if(lo <= 0 && hi > 0){
    var need = frac * (hi - lo);
    if(-lo < need) lo = -need;
  }
  return [lo, hi];
}
function setBox(bd, xmin, ymax, xmax, ymin){
  var y = padRange([ymin, ymax], 0.12), x = padRange([xmin, xmax], 0.2);
  try{ bd.board.setBoundingBox([x[0], y[1], x[1], y[0]], false); }catch(e){}
}

/* ---- Misiones secuenciales: las resueltas se pueden volver a abrir (ejercicio + respuesta) ---- */
function runMissions(wrap, list, phaseKey, buildActive, doneHTML, nextRoute, nextLabel){
  function draw(){
    wrap.innerHTML = "";
    list.forEach(function(m, idx){
      var solved = isSolved(phaseKey, m.key);
      var active = !solved && list.slice(0, idx).every(function(mm){ return isSolved(phaseKey, mm.key); });
      var card = el("div", "mission-card" + (solved ? " solved" : "") + (active ? " active" : ""));
      if(solved){
        card.innerHTML = '<div class="mc-line"><h4>✓ ' + rich(m.tag + ' — ' + m.title) + '</h4>' +
          '<button type="button" class="btn sm ghost rv-btn" aria-expanded="false">Ver ejercicio y respuesta ▾</button></div><div class="rv-body" hidden></div>';
        var btn = card.querySelector(".rv-btn"), body = card.querySelector(".rv-body");
        btn.addEventListener("click", function(){
          var open = body.hidden;
          if(open && !body.getAttribute("data-built")){
            body.setAttribute("data-built", "1");
            REVIEW = true;
            try{ buildActive(body, m, idx, function(){}); }catch(e){ body.innerHTML = '<p class="progress-note">No se pudo mostrar este ejercicio.</p>'; }
            REVIEW = false;
          }
          body.hidden = !open;
          btn.setAttribute("aria-expanded", open ? "true" : "false");
          btn.textContent = open ? "Ocultar ▴" : "Ver ejercicio y respuesta ▾";
          if(open) setTimeout(resizeBoards, 60);
        });
        wrap.appendChild(card); return;
      }
      if(!active){ card.innerHTML = '<h4 style="opacity:.55;">🔒 ' + rich(m.tag + ' — ' + m.title) + '</h4>'; wrap.appendChild(card); return; }
      card.innerHTML = '<h4>🎯 ' + rich(m.tag + ' — ' + m.title) + '</h4>';
      wrap.appendChild(card);
      buildActive(card, m, idx, function(){
        markSolved(phaseKey, m.key);
        setTimeout(draw, 1300);
      });
    });
    if(list.every(function(m){ return isSolved(phaseKey, m.key); })){
      var done = el("div", "mission-card solved");
      done.innerHTML = '<h4>' + mascotBadge("correct", 28, "mascot-inline") + doneHTML.title + '</h4><p>' + rich(doneHTML.text) + '</p>' +
        '<button class="btn primary sm" id="' + phaseKey + '_next">' + nextLabel + '</button>';
      wrap.appendChild(done);
      done.querySelector("#" + phaseKey + "_next").addEventListener("click", function(){ goTo(nextRoute); });
    }
  }
  draw();
}

/* ---- Pregunta de opción múltiple: opciones en orden aleatorio, texto con LaTeX ---- */
function mcq(card, opts){
  if(opts.question) card.appendChild(el("p", null, rich(opts.question)));
  if(REVIEW){
    var g0 = el("div", "choice-grid");
    opts.options.forEach(function(txt, i){
      var b = el("button", "choice" + (i === opts.correct ? " correct" : "")); b.type = "button"; b.disabled = true; b.innerHTML = rich(txt); g0.appendChild(b);
    });
    card.appendChild(g0);
    card.appendChild(el("div", "reveal-box", "✅ <strong>Respuesta correcta.</strong> " + rich(opts.explain || "")));
    return g0;
  }
  var grid = el("div", "choice-grid");
  card.appendChild(grid);
  var fb = feedbackBox(card);
  var order = opts.fixed ? opts.options.map(function(_, i){ return i; }) : shuffleOrder(opts.options.length);
  order.forEach(function(oi){
    var btn = el("button", "choice"); btn.type = "button";
    btn.innerHTML = rich(opts.options[oi]);
    btn.addEventListener("click", function(){
      Array.prototype.forEach.call(grid.children, function(x){ x.disabled = true; });
      if(oi === opts.correct){
        btn.classList.add("correct");
        fb.ok("✅ " + (opts.explain || "¡Correcto!"));
        opts.onSolved();
      } else {
        btn.classList.add("incorrect");
        fb.bad(opts.wrong || "Todavía no. Vuelve a mirar la gráfica y la teoría de arriba, y prueba otra opción.");
        setTimeout(function(){
          Array.prototype.forEach.call(grid.children, function(x){ x.disabled = false; x.classList.remove("incorrect"); });
        }, 1000);
      }
    });
    grid.appendChild(btn);
  });
  return grid;
}

/* ---- Entrada numérica con tolerancia, pista y botón de calculadora ---- */
function numCheck(card, opts){
  if(REVIEW){
    var shown = opts.ansText || ('<span class="mono"><strong>' + fmt(opts.ans, opts.dec === undefined ? 2 : opts.dec) + '</strong></span>');
    card.appendChild(el("div", "reveal-box", "✅ <strong>Respuesta:</strong> " + rich(shown) + " — " + rich(opts.explain || "")));
    return {};
  }
  var row = el("div", "num-row");
  var inputId = "nc_" + (++uidSeq);
  row.innerHTML = '<div><label for="' + inputId + '" class="num-label">' + rich(opts.label || "Tu respuesta") + '</label>' + numInputHTML(inputId, 130) + '</div>' +
    '<button class="btn primary sm" type="button">Comprobar</button>' +
    '<button class="btn sm ghost" type="button" data-calc="1">🧮 Calculadora</button>';
  card.appendChild(row);
  var fb = feedbackBox(card);
  var tries = 0;
  var input = row.querySelector("input"), btn = row.querySelector("button.primary");
  input.setAttribute("aria-label", opts.label ? opts.label.replace(/\$[^$]*\$/g, "").replace(/<[^>]*>/g, "").trim() || "Tu respuesta" : "Tu respuesta");
  row.querySelector("[data-calc]").addEventListener("click", function(){ calcTarget = input; openCalc(); });
  function check(){
    var v = parseNum(input.value);
    if(isNaN(v)){ fb.bad("Escribe un número (puedes usar punto o coma decimal)."); return; }
    var tol = opts.tol !== undefined ? opts.tol : decTol(opts.dec === undefined ? 2 : opts.dec);
    if(Math.abs(v - opts.ans) <= tol){
      fb.ok("✅ " + (opts.explain || "¡Correcto!"));
      input.disabled = true; btn.disabled = true;
      opts.onSolved();
    } else {
      tries++;
      var msg = "Todavía no coincide.";
      if(tries >= 2 && opts.hint) msg += " 💡 " + opts.hint;
      else msg += " Revisa el exponente y el redondeo (" + (opts.dec === undefined ? 2 : opts.dec) + " decimales).";
      fb.bad(msg);
    }
  }
  btn.addEventListener("click", check);
  input.addEventListener("keydown", function(ev){ if(ev.key === "Enter") check(); });
  return {input: input, fb: fb};
}

    '<p>Aquí: $x=\\dfrac{\\log(' + fmt(M, 0) + '/' + fmt(n0, 0) + ')}{\\log(' + fmt(b, 4) + ')}=\\dfrac{\\log(' + fmt(ratio, 4) + ')}{\\log(' + fmt(b, 4) + ')}\\approx\\dfrac{' + fmt(lr, 4) + '}{' + fmt(lb, 4) + '}\\approx\\mathbf{' + fmt(x, 2) + '}$.</p>' +

/* Franjas dinámicas (sala en vivo y ritmo de la clase) que se refrescan con cada sondeo */
var STRIPS = [];
function registerStrip(box, kind, num){ STRIPS.push({box: box, kind: kind, num: num}); paintStrip(STRIPS[STRIPS.length - 1]); }
function renderStrips(){ STRIPS = STRIPS.filter(function(s){ return document.body.contains(s.box); }); STRIPS.forEach(paintStrip); }
function firstIncompletePhase(){
  for(var i = 0; i < PHASES.length; i++){ if(!phaseDone(PHASES[i].key, MISSION_TOTALS[PHASES[i].key])) return PHASES[i].id; }
  return PHASES.length + 1;
}
function phaseUnlocked(id){
  if(id <= 1) return true;
  var prev = PHASES[id - 2], me = PHASES[id - 1];
  return phaseDone(prev.key, MISSION_TOTALS[prev.key]) || phaseCompleteCount(me.key, MISSION_TOTALS[me.key]) > 0;
}
function paintStrip(s){
  var st = API.state, box = s.box;
  if(s.kind === "live"){
    var round = FLASH_ROUNDS[s.num - 1];
    var live = st && (st.status === "lobby" || st.status === "running");
    if(live && st.round === s.num){
      box.className = "strip live on";
      box.innerHTML = '<span class="pulse-dot"></span><span><strong>⚡ ¡Reto relámpago de esta fase en vivo!</strong> Tu docente abrió la sala.</span><button type="button" class="btn sm primary">Entrar ahora</button>';
      box.querySelector("button").addEventListener("click", function(){ goTo("live"); });
    } else if(live){
      box.className = "strip live";
      box.innerHTML = '<span>⚡ La sala está abierta con la ronda de la <strong>Fase ' + st.round + ' · ' + FLASH_ROUNDS[st.round - 1].short + '</strong>. Puedes entrar igual.</span><button type="button" class="btn sm">Ir a la sala</button>';
      box.querySelector("button").addEventListener("click", function(){ goTo("live"); });
    } else {
      var played = flashPlayed(s.num);
      box.className = "strip live off";
      box.innerHTML = '<span>⚡ <strong>Reto relámpago de esta fase:</strong> ' + (API.ok === false || !sheetSyncConfigured() ? 'sin conexión con la sala' : 'apagado (tu docente lo activa)') + (played ? ' · ya lo jugaste ✔' : '') + '</span><button type="button" class="btn sm ghost">Practicar solo</button>';
      box.querySelector("button").addEventListener("click", function(){ LIVE_PRACTICE = s.num; goTo("live"); });
    }
  } else if(s.kind === "pace"){
    var pace = st && st.pace;
    if(!pace){ box.className = "strip pace hidden"; box.innerHTML = ""; return; }
    var mine = firstIncompletePhase();
    var pname = PHASES[pace.phase - 1] ? PHASES[pace.phase - 1].label : "";
    var behind = mine < pace.phase;
    box.className = "strip pace" + (behind ? " behind" : "");
    var where = 'Fase ' + pace.phase + ' · ' + pname + (pace.mission ? ' · Reto ' + pace.mission : '');
    box.innerHTML = '<span>📍 <strong>La clase va en:</strong> ' + where + (behind ? ' — <em>te faltan ' + (pace.phase - mine) + ' fase(s) para alcanzarla.</em>' : (mine === pace.phase ? ' — ¡vas al ritmo!' : ' — vas adelantado, ¡genial!')) + '</span>' +
      (behind ? '<button type="button" class="btn sm primary">Ir a mi fase actual</button>' : '');
    var bb = box.querySelector("button");
    if(bb) bb.addEventListener("click", function(){ goTo("phase" + Math.min(mine, PHASES.length)); });
  }
}

      stepWalk(body, [

        {title: "Paso 2 · Escribe el modelo", html: "$N(x)=100\\cdot2^{x}$. Meta: $1\\,000$ personas."},
