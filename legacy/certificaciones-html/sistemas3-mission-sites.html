<meta charset="utf-8">
<title>Sistemas 3D: Domina las Tres Incógnitas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F7F4FB;
  --surface:#FFFFFF;
  --surface-2:#EFE6F8;
  --ink:#1E1230;
  --ink-soft:#5B4E70;
  --ink-faint:#93869F;
  --line:#E1D3F0;
  --accent:#6802C1;
  --accent-2:#9B3FE0;
  --accent-ink:#FFFFFF;
  --accent-soft:#F1E3FB;
  --gold:#B9791E;
  --gold-soft:#F6E7CC;
  --danger:#A83B2E;
  --danger-soft:#F3DAD3;
  --ok:#1E7A4C;
  --ok-soft:#DCEFE1;
  --formula:#C8102E;
  --formula-soft:#FDE9EC;
  --shadow:0 1px 2px rgba(43,4,80,.08), 0 10px 28px -14px rgba(43,4,80,.32);
  --r-s:8px; --r-m:14px; --r-l:24px;
  --font-display:'Sora', 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-body:'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --font-type:'Special Elite', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#160C24; --surface:#20132F; --surface-2:#2A1A3D; --ink:#F1E9FA; --ink-soft:#BCA9D4;
    --ink-faint:#7C6A93; --line:#3B2650; --accent:#C89BFA; --accent-2:#B77CF2; --accent-ink:#22093D; --accent-soft:#33204A;
    --gold:#EFB85E; --gold-soft:#3A2C15; --danger:#FF9683; --danger-soft:#3B2119; --ok:#5FD394; --ok-soft:#123023;
    --formula:#FF8FA3; --formula-soft:#3A1A24;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#160C24; --surface:#20132F; --surface-2:#2A1A3D; --ink:#F1E9FA; --ink-soft:#BCA9D4;
  --ink-faint:#7C6A93; --line:#3B2650; --accent:#C89BFA; --accent-2:#B77CF2; --accent-ink:#22093D; --accent-soft:#33204A;
  --gold:#EFB85E; --gold-soft:#3A2C15; --danger:#FF9683; --danger-soft:#3B2119; --ok:#5FD394; --ok-soft:#123023;
  --formula:#FF8FA3; --formula-soft:#3A1A24;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding:0 16px;
}
@media (max-width:640px){
  body{ font-size:18px; }
  .btn{ padding:.62em 1.2em; }
  .btn.sm{ padding:.5em 1em; }
  input[type=text], select, .register-wrap input[type=text], .register-wrap select{ font-size:1.05rem; padding:12px 14px; }
  .choice{ padding:14px 16px; }
}
h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance; margin:0 0 .4em; font-weight:700; color:var(--ink);}
p{margin:0 0 1em; max-width:65ch;}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:4px;}
.mono{font-family:var(--font-mono);}
.eq{font-family:var(--font-mono); font-size:1.05em; letter-spacing:.01em;}
img,.canvas-wrap{max-width:100%;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

/* ============ SHELL ============ */
#shell{max-width:1180px; margin:0 auto; padding-block:20px 64px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:12px 18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m);
  box-shadow:var(--shadow); margin-bottom:22px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.brand .mark{font-family:var(--font-display); font-weight:700; font-size:1.2rem;}
.brand .course{color:var(--ink-faint); font-size:.89rem; letter-spacing:.03em; text-transform:uppercase;}
.topnav{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.dot-track{display:flex; gap:6px; align-items:center;}
.dot{
  width:11px; height:11px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line);
  display:inline-block; transition:background .25s, transform .25s;
}
.dot.done{background:var(--ok); border-color:var(--ok);}
.dot.current{background:var(--accent); border-color:var(--accent); transform:scale(1.25);}
.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px;
  padding:.5em 1.1em; font-size:.99rem; font-weight:600; transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{border-color:var(--accent); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.ghost{background:transparent;}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none;}
.btn.sm{padding:.38em .85em; font-size:.89rem;}
.student-tag{font-size:.92rem; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
.student-tag button{background:none; border:none; color:var(--accent); font-size:.92rem; font-weight:600; padding:0; cursor:pointer; text-decoration:underline;}
.register-wrap{max-width:520px; margin:40px auto; background:var(--surface); border:1px solid var(--line); border-top:5px solid var(--accent); border-radius:var(--r-l); box-shadow:var(--shadow); padding:32px 28px;}
.register-icon{
  width:56px; height:56px; border-radius:18px; display:flex; align-items:center; justify-content:center; margin-bottom:16px;
  background:linear-gradient(155deg, var(--accent), var(--accent-2)); color:var(--accent-ink); box-shadow:var(--shadow);
}
.register-icon svg{width:30px; height:30px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.register-wrap h1{font-size:1.55rem;}
.register-wrap label{display:block; font-weight:600; font-size:.97rem; margin:16px 0 6px;}
.register-wrap input[type=text], .register-wrap select{
  width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:var(--r-s);
  background:var(--surface); color:var(--ink); font-size:1.07rem; font-family:inherit;
}
.register-wrap input[type=text]:focus, .register-wrap select:focus{ border-color:var(--accent); }
.mascot-badge{display:inline-flex; flex:none; align-items:center; justify-content:center; vertical-align:middle;}
.mascot-badge svg{width:100%; height:100%; display:block;}
.mascot-hint-row{display:flex; align-items:center; gap:10px;}
.mascot-hint-row .mascot-badge{width:38px !important; height:38px !important;}
.mascot-badge.mascot-inline{width:26px !important; height:26px !important; margin-right:6px;}
.mascot-badge.mascot-welcome{margin-bottom:14px;}

/* ============ MAP SCREEN ============ */
.hero{
  padding:32px 26px; margin-bottom:22px; border-radius:var(--r-l); position:relative; overflow:hidden;
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); box-shadow:var(--shadow);
  display:flex; align-items:center; gap:26px; flex-wrap:wrap;
}
.hero::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(circle at 88% 12%, rgba(255,255,255,.18) 0, transparent 42%),
                    radial-gradient(circle at 6% 92%, rgba(255,255,255,.12) 0, transparent 38%);
}
.hero-text{position:relative; z-index:1; flex:1 1 320px; min-width:0;}
.hero .eyebrow{
  font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.12em; font-size:.9rem;
  color:rgba(255,255,255,.88); font-weight:600; margin-bottom:10px; display:block;
}
.hero h1{font-size:clamp(1.7rem,3.6vw,2.6rem); max-width:16ch; color:#fff;}
.hero p.lead{font-size:1.1rem; color:rgba(255,255,255,.92); max-width:62ch;}
.hero-art{position:relative; z-index:1; flex:none; width:120px; height:120px; color:rgba(255,255,255,.95);}
.hero-art svg{width:100%; height:100%; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
@media (max-width:640px){ .hero-art{display:none;} .hero{padding:26px 20px;} }

.map-wrap{
  background:linear-gradient(180deg, var(--surface) 0%, var(--accent-soft) 130%);
  border:1px solid var(--line); border-radius:var(--r-l);
  box-shadow:var(--shadow); padding:30px 18px 44px; overflow:hidden;
}
.map-inner{position:relative;}
.map-svg{width:100%; height:auto; display:block;}
.node-btn{
  position:absolute; transform:translate(-50%,-50%); width:118px; text-align:center; background:none; border:none; padding:0;
}
.node-circle{
  width:66px; height:66px; border-radius:22px; margin:0 auto 8px; position:relative;
  background:linear-gradient(155deg, var(--surface), var(--accent-soft));
  border:2.5px solid var(--line); display:flex; align-items:center; justify-content:center;
  color:var(--ink-faint); box-shadow:var(--shadow);
  transition:transform .18s, border-color .18s, color .18s, background .18s, box-shadow .18s;
}
.node-circle svg{width:30px; height:30px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.node-circle .node-num{
  position:absolute; top:-8px; left:-8px; width:22px; height:22px; border-radius:50%;
  background:var(--surface); border:2px solid var(--line); color:var(--ink-soft);
  font-family:var(--font-mono); font-weight:700; font-size:.72rem; display:flex; align-items:center; justify-content:center;
}
.node-btn:hover .node-circle{transform:translateY(-4px) scale(1.05); border-color:var(--accent); color:var(--accent); box-shadow:0 10px 22px -10px rgba(104,2,193,.45);}
.node-btn.done .node-circle{background:linear-gradient(155deg, var(--ok-soft), var(--surface)); border-color:var(--ok); color:var(--ok);}
.node-btn.done .node-circle .node-num{background:var(--ok); border-color:var(--ok); color:var(--accent-ink);}
.node-btn.current .node-circle{background:linear-gradient(155deg, var(--accent), var(--accent-2)); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 10px 24px -10px rgba(104,2,193,.55);}
.node-btn.current .node-circle .node-num{background:var(--accent-ink); border-color:var(--accent); color:var(--accent);}
.node-btn.locked{cursor:not-allowed;}
.node-btn.locked .node-circle{color:var(--ink-faint); opacity:.5; background:var(--surface);}
.node-btn.locked:hover .node-circle{transform:none; border-color:var(--line); color:var(--ink-faint); box-shadow:var(--shadow);}
.node-label{font-size:1rem; font-weight:700; color:var(--ink); line-height:1.25;}
.node-sub{font-size:.92rem; color:var(--ink-faint); margin-top:1px;}
.node-mini-bar{width:100%; max-width:90px; height:5px; border-radius:99px; background:var(--surface-2); margin:6px auto 0; overflow:hidden;}
.node-mini-bar > span{display:block; height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:99px;}
.phase-tile .node-mini-bar{margin:6px 0 0;}
.map-list{display:none; flex-direction:column; gap:12px;}
@media (max-width:639px){ .map-curvy{display:none;} .map-list{display:flex;} }
.phase-tile{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  background:var(--surface); border:1.5px solid var(--line); border-left:5px solid var(--accent); border-radius:var(--r-m);
  padding:14px 16px; box-shadow:var(--shadow); transition:transform .15s, box-shadow .15s;
}
.phase-tile:hover{transform:translateY(-2px); box-shadow:0 12px 24px -12px rgba(104,2,193,.35);}
.phase-tile.done{border-left-color:var(--ok);}
.phase-tile.locked{border-left-color:var(--line);}
.phase-tile .node-circle{margin:0; flex:none;}
.phase-tile .tile-text{flex:1; min-width:0;}
.phase-tile .tile-text .node-label{font-size:1.05rem;}
.phase-tile .tile-text .node-sub{font-size:.92rem; margin-top:2px;}
.phase-tile .chev{color:var(--accent); font-size:1.3rem; flex:none;}
.phase-tile.locked{opacity:.6;}
.phase-tile.locked .chev{color:var(--ink-faint);}
.phase-tile.locked:hover{transform:none; box-shadow:var(--shadow);}

/* ============ PHASE CHROME ============ */
.phase-head{margin-bottom:18px;}
.phase-head-row{display:flex; align-items:center; gap:14px; margin-bottom:4px;}
.phase-head-icon{
  flex:none; width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(155deg, var(--accent), var(--accent-2)); color:var(--accent-ink); box-shadow:var(--shadow);
}
.phase-head-icon svg{width:28px; height:28px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.phase-head .eyebrow{font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.1em; font-size:.88rem; font-weight:600;}
.phase-head h2{font-size:clamp(1.4rem,2.6vw,1.9rem); margin:0;}
.workspace{
  display:grid; grid-template-columns:280px 1fr 260px; gap:16px; align-items:start;
}
@media (max-width:900px){ .workspace{grid-template-columns:1fr;} }
.two-col{display:grid; grid-template-columns:1.15fr 1fr; gap:16px; align-items:start;}
@media (max-width:820px){ .two-col{grid-template-columns:1fr;} }
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:16px;
  box-shadow:var(--shadow);
}
.panel h3{font-size:1.05rem; margin-bottom:12px;}
.field{margin-bottom:14px;}
.field label{display:flex; justify-content:space-between; font-size:.92rem; font-weight:600; margin-bottom:6px;}
.field label .val{font-family:var(--font-mono); color:var(--accent); font-weight:700;}
input[type=range]{width:100%; accent-color:var(--accent);}
.info-row{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:.99rem;}
.info-row:last-child{border-bottom:none;}
.info-row .k{color:var(--ink-soft);}
.info-row .v{font-family:var(--font-mono); font-weight:700; text-align:right;}
.badge{display:inline-block; padding:.28em .75em; border-radius:999px; font-size:.88rem; font-weight:700; letter-spacing:.02em;}
.badge.up{background:var(--ok-soft); color:var(--ok);}
.badge.down{background:var(--danger-soft); color:var(--danger);}

.canvas-panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); box-shadow:var(--shadow); padding:10px; position:relative;}
canvas{display:block; width:100%; height:auto; border-radius:var(--r-s); cursor:crosshair;}

.mission-card{
  border:1.5px solid var(--line); border-radius:var(--r-m); padding:14px 16px; margin-top:14px; background:var(--surface-2);
}
.mission-card.active{border-color:var(--accent); background:var(--accent-soft);}
.mission-card.solved{border-color:var(--ok); background:var(--ok-soft);}
.mission-card h4{font-size:1.02rem; margin-bottom:6px; display:flex; gap:8px; align-items:center;}
.mission-card p{font-size:.97rem; color:var(--ink-soft); margin-bottom:10px;}
.feedback{
  margin-top:10px; padding:10px 12px; border-radius:var(--r-s); font-size:.97rem; font-weight:600; display:none;
}
.feedback.show{display:block;}
.feedback.ok{background:var(--ok-soft); color:var(--ok);}
.feedback.bad{background:var(--danger-soft); color:var(--danger);}

table.datatable{width:100%; border-collapse:collapse; font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
table.datatable th,table.datatable td{border:1px solid var(--line); padding:8px 10px; text-align:center;}
table.datatable th{background:var(--surface-2); font-family:var(--font-body); font-weight:700;}
table.datatable td.sym{background:var(--accent-soft); font-weight:700;}

.choice-grid{display:grid; gap:10px; margin-top:12px;}
.choice{
  text-align:left; border:1.5px solid var(--line); background:var(--surface); border-radius:var(--r-s);
  padding:12px 14px; font-size:1.01rem; transition:border-color .15s, background .15s;
}
.choice:hover{border-color:var(--accent);}
.choice.correct{border-color:var(--ok); background:var(--ok-soft);}
.choice.incorrect{border-color:var(--danger); background:var(--danger-soft);}
.choice[disabled]{cursor:default;}

.stepper{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.stepper span{
  font-size:.84rem; font-weight:700; padding:.3em .7em; border-radius:999px; background:var(--surface-2); color:var(--ink-faint);
}
.stepper span.on{background:var(--accent); color:var(--accent-ink);}
.stepper button.step-pill{
  font:inherit; font-size:.84rem; font-weight:700; padding:.3em .7em; border-radius:999px; border:none;
  background:var(--surface-2); color:var(--ink-faint); cursor:pointer; transition:background .15s,color .15s;
}
.stepper button.step-pill.done:not(.on){background:var(--ok-soft); color:var(--ok);}
.stepper button.step-pill.on{background:var(--accent); color:var(--accent-ink);}
.stepper button.step-pill[disabled]{cursor:not-allowed; opacity:.55;}
.step-nav{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:18px; flex-wrap:wrap;}

.reveal-box{border-left:3px solid var(--gold); background:var(--gold-soft); padding:12px 14px; border-radius:0 var(--r-s) var(--r-s) 0; margin:14px 0; font-size:1rem;}
.reveal-box .katex-display{margin:.3em 0;}
.tex-block{overflow-x:auto; padding:2px 0;}
.tex-block .katex-display{margin:.4em 0;}
.katex{color:inherit;}

/* ---- Fórmula clave: callout didáctico tipo texto escolar ---- */
.formula-callout{
  border:2px solid var(--formula); background:var(--formula-soft);
  border-radius:var(--r-m); padding:18px 20px 16px; margin:18px 0;
  position:relative; overflow-x:auto; box-shadow:0 4px 14px -8px rgba(200,16,46,.35);
}
.formula-callout .fc-tag{
  display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-weight:700;
  font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--formula); margin-bottom:8px;
}
.formula-callout .fc-tag svg{width:16px; height:16px; flex:none;}
.formula-callout .katex-display{margin:.25em 0; font-size:1.32em;}
.formula-callout .katex{color:var(--formula);}

/* ============ DETECTIVE MODE ============ */
.dossier{
  background:
    linear-gradient(var(--surface-2), var(--surface-2));
  border:1px solid var(--line); border-radius:var(--r-m); box-shadow:var(--shadow);
  padding:22px 22px 26px; position:relative; overflow:hidden;
}
.dossier::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 28px);
}
.case-tag{
  font-family:var(--font-type); font-size:.89rem; letter-spacing:.04em; color:var(--danger);
  border:2px solid var(--danger); display:inline-block; padding:.15em .6em; border-radius:3px;
  transform:rotate(-2deg); margin-bottom:10px;
}
.dossier h3{font-family:var(--font-type); font-size:1.2rem; letter-spacing:.01em;}
.claim-box{
  font-family:var(--font-type); background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--danger);
  padding:14px 16px; border-radius:0 var(--r-s) var(--r-s) 0; margin:14px 0; font-size:1.07rem; position:relative; z-index:1;
}
.stamp{
  position:absolute; top:14px; right:18px; font-family:var(--font-type); font-size:1.45rem; color:var(--ok);
  border:3px solid var(--ok); padding:2px 10px; border-radius:6px; transform:rotate(8deg); opacity:0;
  transition:opacity .3s, transform .3s;
}
.stamp.show{opacity:.85; transform:rotate(8deg) scale(1);}
.stamp.wrong{color:var(--danger); border-color:var(--danger);}

.progress-note{font-size:.89rem; color:var(--ink-faint); margin-top:6px;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:18px 0;}
.stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:14px 16px; box-shadow:var(--shadow);}
.stat-tile .num{font-family:var(--font-mono); font-size:1.75rem; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums;}
.stat-tile .lbl{font-size:.92rem; color:var(--ink-soft); margin-top:2px;}
.cert-card{
  position:relative; background:var(--surface); border:2px solid var(--gold); border-radius:var(--r-l);
  padding:44px 32px; margin-top:22px; box-shadow:var(--shadow); text-align:center; overflow:hidden;
}
.cert-card::before{content:""; position:absolute; inset:9px; border:1px solid var(--gold); opacity:.55; border-radius:calc(var(--r-l) - 6px); pointer-events:none;}
.cert-inner{position:relative; z-index:1;}
.cert-seal{
  width:64px; height:64px; margin:0 auto 14px; border-radius:50%; display:flex; align-items:center; justify-content:center;
}
.cert-seal .mascot-badge{width:64px !important; height:64px !important;}
.cert-eyebrow{font-family:var(--font-mono); letter-spacing:.14em; text-transform:uppercase; font-size:.88rem; color:var(--gold); font-weight:700;}
.cert-title{font-family:var(--font-display); font-size:1.35rem; margin:6px 0 22px; color:var(--ink);}
.cert-name{font-family:var(--font-display); font-size:clamp(1.7rem,4vw,2.5rem); margin:8px 0 2px; color:var(--ink); text-wrap:balance;}
.cert-role{color:var(--ink-soft); font-size:1.02rem; margin-bottom:20px;}
.cert-body{max-width:54ch; margin:0 auto 22px; color:var(--ink-soft); font-size:1.05rem;}
.cert-sig{display:inline-block; border-top:1.5px solid var(--line); padding-top:8px; margin-top:8px; font-size:.89rem; color:var(--ink-faint); min-width:240px;}
.cert-date{font-size:.92rem; color:var(--ink-faint); margin-top:10px;}
@media print{
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
  body *{ visibility:hidden; }
  #certCard, #certCard *{ visibility:visible; }
  #certCard{ position:absolute; top:0; left:0; width:100%; margin:0; box-shadow:none; border-color:#b9791e; }
  .no-print{ display:none !important; }
}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
.center-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
.eq-template{display:flex; align-items:center; gap:6px; flex-wrap:wrap; background:var(--panel-2,#f6f2fb); border:1.5px solid var(--border,#ddd); border-radius:12px; padding:10px 14px; margin:10px 0; font-size:1.08rem;}
.eq-template .eqt-input{width:58px; text-align:center; font:inherit; font-weight:700; padding:6px 4px; border-radius:8px; border:1.5px solid var(--border,#ccc); background:#fff;}
.eq-template .eqt-input:focus{outline:2px solid var(--accent,#6802C1); outline-offset:1px;}
.eq-template .eqt-sign{font:inherit; font-weight:700; padding:6px 2px; border-radius:8px; border:1.5px solid var(--border,#ccc); background:#fff; text-align:center;}
.eq-template .eqt-var{font-weight:700; font-style:italic; padding:0 1px;}
.eq-template .eqt-eq{font-weight:700; padding:0 4px;}
.eq-template.is-correct{border-color:var(--accent-2,#1f9d55); background:#eefaf1;}
.eq-template.is-wrong{border-color:var(--danger,#c0392b); background:#fdefee;}
@media (max-width:520px){ .eq-template{font-size:0.98rem; padding:8px 10px; gap:4px;} .eq-template .eqt-input{width:48px;} }
.step-stage{ min-height:74px; }
.step-slide{ opacity:0; transform:translateY(8px); transition:opacity .35s ease, transform .35s ease; background:var(--panel-2,#f6f2fb); border-left:4px solid var(--accent,#6802C1); border-radius:8px; padding:12px 16px; }
.step-slide.show{ opacity:1; transform:translateY(0); }
.step-num{ font-weight:700; font-size:.8rem; letter-spacing:.03em; text-transform:uppercase; color:var(--accent,#6802C1); margin-bottom:4px; }
.step-body{ font-size:1.05rem; }
.eq-template3 .eqt-input{width:52px;}
@media (max-width:640px){ .eq-template3{font-size:.92rem;} .eq-template3 .eqt-input{width:44px;} }

/* ---- XP / Insignias (Sistemas 3D) ---- */
.xp-panel{display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:14px 18px; box-shadow:var(--shadow); margin-bottom:18px; flex-wrap:wrap;}
.xp-level{font-weight:800; color:var(--accent); font-size:1.02rem; white-space:nowrap; font-family:var(--font-display);}
.xp-track{flex:1; min-width:140px; height:10px; border-radius:999px; background:var(--accent-soft); overflow:hidden;}
.xp-fill{height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:999px; transition:width .5s ease;}
.xp-num{font-family:var(--font-mono); font-size:.86rem; color:var(--ink-soft); white-space:nowrap;}
.badge-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
.badge-chip{display:flex; flex-direction:column; align-items:center; gap:5px; width:66px; opacity:.4; filter:grayscale(1);}
.badge-chip.unlocked{opacity:1; filter:none;}
.badge-chip .badge-circle{width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); border:2px solid var(--accent); color:var(--accent);}
.badge-chip.unlocked .badge-circle{background:linear-gradient(155deg, var(--accent), var(--accent-2)); color:var(--accent-ink); box-shadow:0 8px 18px -8px rgba(104,2,193,.5);}
.badge-chip .badge-circle svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.badge-chip.boss .badge-circle{background:var(--gold-soft); border-color:var(--gold); color:var(--gold);}
.badge-chip.boss.unlocked .badge-circle{background:linear-gradient(155deg, var(--gold), #E8871E); border-color:var(--gold); color:#fff;}
.badge-chip .badge-label{font-size:.72rem; text-align:center; color:var(--ink-soft); line-height:1.2;}
.boss-panel{border:2px solid var(--gold); background:linear-gradient(155deg, var(--gold-soft), var(--surface));}
.boss-panel h3{color:var(--gold);}
.xp-toast{position:fixed; bottom:18px; right:18px; background:var(--accent); color:var(--accent-ink); font-weight:700; font-family:var(--font-mono); padding:10px 16px; border-radius:999px; box-shadow:var(--shadow); z-index:50; opacity:0; transform:translateY(10px); transition:opacity .3s ease, transform .3s ease; pointer-events:none;}
.xp-toast.show{opacity:1; transform:translateY(0);}

function mascotBadge(pose, size, extraClass){

var PHASES = [
  {id:1, key:"clasifica",   label:"Clasifica",   sub:"Tipos de sistemas"},
  {id:2, key:"verifica",    label:"Verifica",    sub:"¿Es solución?"},
  {id:3, key:"resuelve",    label:"Resuelve",    sub:"Los tres métodos"},
  {id:4, key:"interpreta",  label:"Interpreta",  sub:"Construye y da sentido"},
  {id:5, key:"investiga",   label:"Investiga",   sub:"Detective matemático"},
  {id:6, key:"desafio",     label:"Desafío",     sub:"Construcción inversa"},
  {id:7, key:"aplica",      label:"Aplica",      sub:"Casos integrales"}
];

var STORAGE_KEY = "sistemas3-mission-progress-v1";
function loadProgress(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
var progress = loadProgress();
function markSolved(phaseKey, missionKey){
  var already = !!(progress[phaseKey] && progress[phaseKey][missionKey]);
  if(!progress[phaseKey]) progress[phaseKey] = {};
  progress[phaseKey][missionKey] = true;
  if(!already){
    var wasDone = phaseDone(phaseKey, MISSION_TOTALS[phaseKey]);
    var gained = XP_PER_MISSION;
    saveProgress();
    if(!wasDone && phaseDone(phaseKey, MISSION_TOTALS[phaseKey])) gained += XP_PER_PHASE_BONUS;
    if(typeof showXPToast === "function") showXPToast(gained);
  } else {
    saveProgress();
  }
  maybeStampCompletion();
  syncSaveToSheet();
  renderTopbar();
}
function isSolved(phaseKey, missionKey){
  return !!(progress[phaseKey] && progress[phaseKey][missionKey]);
}
function phaseCompleteCount(phaseKey, total){
  var p = progress[phaseKey] || {};
  var n = 0;
  for(var k in p){ if(k.charAt(0)!=="_" && p[k]) n++; }
  return Math.min(n, total);
}
function phaseDone(phaseKey, total){
  return phaseCompleteCount(phaseKey, total) >= total;
}
var MISSION_TOTALS = {clasifica:7, verifica:4, resuelve:9, interpreta:5, investiga:8, desafio:4, aplica:6};
function totalMissions(){
  var n=0; for(var k in MISSION_TOTALS) n+=MISSION_TOTALS[k]; return n;
}
function allPhasesDone(){
  return PHASES.every(function(ph){ return phaseDone(ph.key, MISSION_TOTALS[ph.key]); });
}

/* ---- XP, niveles e insignias coleccionables ---- */
var XP_PER_MISSION = 10, XP_PER_PHASE_BONUS = 25;
function totalXP(){
  var xp = 0;
  PHASES.forEach(function(ph){
    xp += phaseCompleteCount(ph.key, MISSION_TOTALS[ph.key]) * XP_PER_MISSION;
    if(phaseDone(ph.key, MISSION_TOTALS[ph.key])) xp += XP_PER_PHASE_BONUS;
  });
  return xp;
}
function maxXP(){ return totalMissions()*XP_PER_MISSION + PHASES.length*XP_PER_PHASE_BONUS; }
var LEVELS = [
  {min:0,   name:"Aprendiz"},
  {min:150, name:"Explorador"},
  {min:350, name:"Estratega"},
  {min:605, name:"Maestro de Sistemas"}
];
function currentLevelInfo(xp){
  var lv = LEVELS[0];
  for(var i=0;i<LEVELS.length;i++){ if(xp >= LEVELS[i].min) lv = LEVELS[i]; }
  return lv;
}
function nextLevelInfo(xp){
  for(var i=0;i<LEVELS.length;i++){ if(LEVELS[i].min > xp) return LEVELS[i]; }
  return null;
}
function renderXPPanel(parent, opts){
  opts = opts || {};
  var xp = totalXP(), max = maxXP();
  var lv = currentLevelInfo(xp), nxt = nextLevelInfo(xp);
  var pct = Math.min(100, Math.round(xp/max*100));
  var panel = el("div","xp-panel");
  panel.innerHTML =
    '<span class="xp-level">🏅 '+lv.name+'</span>'+
    '<div class="xp-track"><span class="xp-fill" style="width:'+pct+'%"></span></div>'+
    '<span class="xp-num">'+xp+' / '+max+' XP'+(nxt ? " · faltan "+(nxt.min-xp)+" para "+nxt.name : " · ¡nivel máximo!")+'</span>';
  parent.appendChild(panel);
  if(opts.hideBadges) return;
  var badgeRow = el("div","badge-row");
  PHASES.forEach(function(ph){
    var unlocked = phaseDone(ph.key, MISSION_TOTALS[ph.key]);
    var chip = el("div","badge-chip"+(unlocked?" unlocked":""));
    chip.innerHTML = '<span class="badge-circle">'+PHASE_ICONS[ph.id]+'</span><span class="badge-label">'+ph.label+'</span>';
    badgeRow.appendChild(chip);
  });
  var bossChip = el("div","badge-chip boss"+(isSolved("aplica","estadio")?" unlocked":""));
  bossChip.innerHTML = '<span class="badge-circle">'+ICON_BOSS+'</span><span class="badge-label">Jefe final</span>';
  badgeRow.appendChild(bossChip);
  var masterChip = el("div","badge-chip boss"+(allPhasesDone()?" unlocked":""));

function mergeRemoteProgress(remote){
  if(!remote || typeof remote !== "object") return false;
  var changed = false;
  for(var phaseKey in remote){
    if(!remote[phaseKey] || typeof remote[phaseKey] !== "object") continue;
    if(!progress[phaseKey]) progress[phaseKey] = {};
    for(var missionKey in remote[phaseKey]){
      if(remote[phaseKey][missionKey] && !progress[phaseKey][missionKey]){
        progress[phaseKey][missionKey] = true;
        changed = true;
      }
    }
  }
  return changed;
}
function syncSaveToSheet(){
  if(!sheetSyncConfigured() || !student) return;
  try{
    fetch(SHEET_API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({
        action: "save",
        actividad: "sistemas3",
        nombre: student.name,
        carrera: student.carrera,
        progreso: progress,
        completadoEn: getCompletedAt() || ""
      })
    }).catch(function(){ /* sin conexión: el progreso local ya quedó guardado */ });
  }catch(e){}
}
function syncLoadFromSheet(name, carrera, done){
  if(!sheetSyncConfigured()){ done(); return; }
  var finished = false;
  function finish(){ if(finished) return; finished = true; done(); }
  try{
    fetch(SHEET_API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({action:"load", actividad:"sistemas3", nombre:name, carrera:carrera})
    }).then(function(r){ return r.json(); }).then(function(data){
      if(data && data.found && data.progreso){
        mergeRemoteProgress(data.progreso);
        saveProgress();
        if(data.completadoEn){
          try{ localStorage.setItem(COMPLETED_KEY, data.completadoEn); }catch(e){}
        }
      }
      finish();
    }).catch(function(){ finish(); });
  }catch(e){ finish(); }
  setTimeout(finish, 4000); // nunca dejamos al estudiante esperando de más
}

/* ---- Resolución de sistemas 2x2 (regla de Cramer) ---- */
function solveSystem(a1,b1,c1,a2,b2,c2){
  var det = a1*b2 - a2*b1;
  if(Math.abs(det) > 1e-9){
    var x = (c1*b2 - c2*b1)/det;
    var y = (a1*c2 - a2*c1)/det;
    return {type:"unica", x:x, y:y};
  }
  var detXC = c1*b2 - c2*b1;
  var detYC = a1*c2 - a2*c1;
  if(Math.abs(detXC) < 1e-9 && Math.abs(detYC) < 1e-9){
    return {type:"infinitas"};
  }
  return {type:"ninguna"};
}
function fmt(n, d){
  if(d===undefined) d = 2;
  if(Math.abs(n) < 1e-9) n = 0;
  var r = Math.round(n * Math.pow(10,d)) / Math.pow(10,d);
  if(Number.isInteger(r)) return String(r);
  return String(r);
}

}

function lineTex(a,b,c){
  var parts = [];
  if(a !== 0) parts.push({coef:a, v:"x"});
  if(b !== 0) parts.push({coef:b, v:"y"});
  var s = "";
  parts.forEach(function(p, i){
    var sign = p.coef < 0 ? "-" : (i===0 ? "" : "+");
    var abscoef = Math.abs(p.coef);
    var coefStr = (abscoef === 1) ? "" : fmt(abscoef);
    s += sign + coefStr + p.v;
  });
  if(s === "") s = "0";

}

/* ---- Resolución de sistemas 3x3 (regla de Cramer + clasificación) ---- */
function det3(a1,b1,c1, a2,b2,c2, a3,b3,c3){
  return a1*(b2*c3-b3*c2) - b1*(a2*c3-a3*c2) + c1*(a2*b3-a3*b2);
}
function solveSystem3(a1,b1,c1,d1, a2,b2,c2,d2, a3,b3,c3,d3){
  var D  = det3(a1,b1,c1, a2,b2,c2, a3,b3,c3);
  var Dx = det3(d1,b1,c1, d2,b2,c2, d3,b3,c3);
  var Dy = det3(a1,d1,c1, a2,d2,c2, a3,d3,c3);
  var Dz = det3(a1,b1,d1, a2,b2,d2, a3,b3,d3);
  if(Math.abs(D) > 1e-9){
    return {type:"unica", x:Dx/D, y:Dy/D, z:Dz/D, D:D, Dx:Dx, Dy:Dy, Dz:Dz};
  }
  if(Math.abs(Dx)<1e-6 && Math.abs(Dy)<1e-6 && Math.abs(Dz)<1e-6){
    return {type:"infinitas", D:D, Dx:Dx, Dy:Dy, Dz:Dz};
  }
  return {type:"ninguna", D:D, Dx:Dx, Dy:Dy, Dz:Dz};
}

  var s = "";
  parts.forEach(function(p, i){

    var abscoef = Math.abs(p.coef);
    var coefStr = (abscoef === 1) ? "" : fmt(abscoef);
    s += sign + coefStr + p.v;
  });
  if(s === "") s = "0";
  s += "=" + fmt(d);
  return s;
}

/* ============================================================
   MOTOR DE GRÁFICA (canvas)
============================================================ */
function LinesGraph(canvas, opts){
  opts = opts || {};
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var xMin = opts.xMin!==undefined?opts.xMin:-8, xMax = opts.xMax!==undefined?opts.xMax:8;
  var yMin = opts.yMin!==undefined?opts.yMin:-8, yMax = opts.yMax!==undefined?opts.yMax:8;
  var cssW = 0, cssH = 0;
  var current = {
    a1: opts.a1!==undefined?opts.a1:1, b1: opts.b1!==undefined?opts.b1:1, c1: opts.c1!==undefined?opts.c1:0,
    a2: opts.a2!==undefined?opts.a2:1, b2: opts.b2!==undefined?opts.b2:-1, c2: opts.c2!==undefined?opts.c2:0
  };
  var target = {a1:current.a1,b1:current.b1,c1:current.c1,a2:current.a2,b2:current.b2,c2:current.c2};
  var showSolution = !!opts.showSolution;
  var showPoints = opts.points || null; // array of {x,y,label,color}
  var guessPoint = null; // {x,y} in data space, for click-to-guess
  var onGuess = opts.onGuess || null;
  var raf = null;

  function resize(){
    var rect = canvas.getBoundingClientRect();
    cssW = rect.width || opts.width || 320;
    cssH = opts.aspect ? cssW*opts.aspect : (opts.height || cssW*0.72);
    canvas.width = Math.round(cssW*dpr);
    canvas.height = Math.round(cssH*dpr);
    canvas.style.height = cssH+"px";
    draw();
  }
  function sx(x){ return (x - xMin) / (xMax - xMin) * cssW; }
  function sy(y){ return cssH - (y - yMin) / (yMax - yMin) * cssH; }
  function css(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    var lineColor = css('--line'), ink = css('--ink'), inkFaint = css('--ink-faint');
    var accent = css('--accent'), accent2 = css('--accent-2'), gold = css('--gold'), danger = css('--danger');
    // grid
    ctx.lineWidth = 1;
    ctx.strokeStyle = lineColor;
    ctx.beginPath();
    for(var gx = Math.ceil(xMin); gx <= xMax; gx++){
      ctx.moveTo(sx(gx)+.5, 0); ctx.lineTo(sx(gx)+.5, cssH);
    }
    for(var gy = Math.ceil(yMin); gy <= yMax; gy++){
      ctx.moveTo(0, sy(gy)+.5); ctx.lineTo(cssW, sy(gy)+.5);
    }
    ctx.stroke();
    // axes
    ctx.strokeStyle = inkFaint;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(0, sy(0)); ctx.lineTo(cssW, sy(0));
    ctx.moveTo(sx(0), 0); ctx.lineTo(sx(0), cssH);
    ctx.stroke();
    ctx.fillStyle = inkFaint;
    ctx.font = "11px "+ (css('--font-mono')||'monospace');
    for(var lx = Math.ceil(xMin); lx <= xMax; lx++){
      if(lx===0) continue;
      var lxPos = sx(lx);
      if(lxPos < 8 || lxPos > cssW-8) continue;
      var labelY = sy(0)+13;
      labelY = Math.max(12, Math.min(cssH-4, labelY));
      ctx.fillText(String(lx), lxPos-3, labelY);
    }
    for(var ly = Math.ceil(yMin); ly <= yMax; ly++){
      if(ly===0) continue;
      var lyPos = sy(ly);
      if(lyPos < 10 || lyPos > cssH-6) continue;
      var labelX = sx(0)+4;
      labelX = Math.max(2, Math.min(cssW-16, labelX));
      ctx.fillText(String(ly), labelX, lyPos+3);
    }

    var cur = current;

    function drawLine(a,b,c,color){
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      if(Math.abs(b) > 1e-9){
        var x0 = xMin, y0 = (c - a*x0)/b;
        var x1 = xMax, y1 = (c - a*x1)/b;
        ctx.moveTo(sx(x0), sy(y0));
        ctx.lineTo(sx(x1), sy(y1));
      } else if(Math.abs(a) > 1e-9){
        var xv = c/a;
        ctx.moveTo(sx(xv), sy(yMin));
        ctx.lineTo(sx(xv), sy(yMax));
      }
      ctx.stroke();
    }
    drawLine(cur.a1,cur.b1,cur.c1, accent);
    drawLine(cur.a2,cur.b2,cur.c2, accent2);

    // extra points (tabla, candidatos, etc.)
    if(showPoints){
      showPoints.forEach(function(p){
        ctx.beginPath();
        ctx.arc(sx(p.x), sy(p.y), 5, 0, Math.PI*2);
        ctx.fillStyle = p.color || ink;
        ctx.fill();
        ctx.strokeStyle = css('--surface'); ctx.lineWidth=2; ctx.stroke();
      });
    }

    // punto solución (intersección)
    if(showSolution){
      var sol = solveSystem(cur.a1,cur.b1,cur.c1,cur.a2,cur.b2,cur.c2);
      if(sol.type === "unica"){
        ctx.beginPath();
        ctx.arc(sx(sol.x), sy(sol.y), 7, 0, Math.PI*2);
        ctx.fillStyle = gold;
        ctx.fill();
        ctx.strokeStyle = css('--surface'); ctx.lineWidth=2.5; ctx.stroke();
      }
    }

    // guess marker
    if(guessPoint){
      ctx.beginPath();
      ctx.arc(sx(guessPoint.x), sy(guessPoint.y), 6, 0, Math.PI*2);
      ctx.strokeStyle = danger; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx(guessPoint.x)-8, sy(guessPoint.y)); ctx.lineTo(sx(guessPoint.x)+8, sy(guessPoint.y)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx(guessPoint.x), sy(guessPoint.y)-8); ctx.lineTo(sx(guessPoint.x), sy(guessPoint.y)+8); ctx.stroke();
    }
  }

  function animateTo(a1,b1,c1,a2,b2,c2){
    target = {a1:a1,b1:b1,c1:c1,a2:a2,b2:b2,c2:c2};
    var start = {a1:current.a1,b1:current.b1,c1:current.c1,a2:current.a2,b2:current.b2,c2:current.c2};
    var t0 = performance.now();
    var dur = 260;
    if(raf) cancelAnimationFrame(raf);
    function step(t){
      var p = Math.min(1, (t-t0)/dur);
      var e = 1 - Math.pow(1-p, 3);
      current = {
        a1: start.a1 + (target.a1-start.a1)*e, b1: start.b1 + (target.b1-start.b1)*e, c1: start.c1 + (target.c1-start.c1)*e,
        a2: start.a2 + (target.a2-start.a2)*e, b2: start.b2 + (target.b2-start.b2)*e, c2: start.c2 + (target.c2-start.c2)*e
      };
      draw();
      if(p<1){ raf = requestAnimationFrame(step); }
    }
    raf = requestAnimationFrame(step);
  }

  canvas.addEventListener("click", function(ev){
    if(!onGuess) return;
    var rect = canvas.getBoundingClientRect();
    var mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    var dx = xMin + (mx/cssW)*(xMax-xMin);
    var dy = yMin + ((cssH-my)/cssH)*(yMax-yMin);
    guessPoint = {x:dx, y:dy};
    draw();
    onGuess(dx,dy);
  });

  window.addEventListener("resize", resize);
  resize();

  return {
    set: function(a1,b1,c1,a2,b2,c2,animate){
      if(animate===false){ current={a1:a1,b1:b1,c1:c1,a2:a2,b2:b2,c2:c2}; target=current; draw(); }
      else animateTo(a1,b1,c1,a2,b2,c2);
    },
    setShowSolution: function(v){ showSolution = v; draw(); },
    setPoints: function(pts){ showPoints = pts; draw(); },
    clearGuess: function(){ guessPoint = null; draw(); },
    redraw: draw,
    getCurrent: function(){ return current; }
  };
}

    '</svg>';
  wrap.appendChild(inner);

  phaseInfo.forEach(function(info, i){
    var ph=info.ph, done=info.done, total=info.total, complete=info.complete, locked=info.locked;

    btn.style.top = (nodesXY[i].y/H*100)+"%";

      '<div class="node-sub">'+ph.sub+' · '+done+'/'+total+'</div>' +
      '<div class="node-mini-bar"><span style="width:'+pct+'%"></span></div>';

  note2.style.marginTop = "14px";

function renderPhase1(app){
  phaseHeader(app, 1, "Clasifica sistemas de tres incógnitas",
    "Antes de resolver, aprende a reconocer qué tipo de sistema tienes enfrente: compatible determinado, incompatible o compatible indeterminado.");

  var intro = el("div","panel");
  intro.innerHTML =
    '<h3>Tres planos, tres posibilidades</h3>'+
    '<p>Cada ecuación con tres incógnitas representa un <strong>plano</strong> en el espacio. Al juntar tres ecuaciones, los tres planos pueden comportarse de tres maneras:</p>'+
    '<ul style="margin:10px 0 14px 22px; color:var(--ink-soft); font-size:.97rem;">'+
    '<li style="margin-bottom:4px;"><strong>Compatible determinado:</strong> los tres planos se cortan en un único punto (x, y, z).</li>'+
    '<li style="margin-bottom:4px;"><strong>Incompatible:</strong> los planos no tienen ningún punto en común (por ejemplo, dos de ellos son paralelos).</li>'+
    '<li><strong>Compatible indeterminado:</strong> los planos comparten toda una recta (o coinciden): hay infinitas soluciones.</li>'+
    '</ul>'+
    formulaCallout("\\Delta=\\begin{vmatrix}a_1&b_1&c_1\\\\a_2&b_2&c_2\\\\a_3&b_3&c_3\\end{vmatrix}","Criterio de los determinantes (regla de Cramer)")+
    '<p style="margin-top:10px;">En la Fase 3 aprenderás a calcular Δ, Δx, Δy y Δz paso a paso con la regla de Cramer. Por ahora te los damos ya calculados: úsalos para clasificar cada sistema.</p>'+
    '<div class="reveal-box">💡 Si <strong>Δ ≠ 0</strong> → compatible determinado. Si <strong>Δ = 0</strong> y alguno de Δx, Δy, Δz <strong>no</strong> es cero → incompatible. Si <strong>Δ = Δx = Δy = Δz = 0</strong> → compatible indeterminado.</div>';
  app.appendChild(intro);

  var missionsWrap = el("div"); missionsWrap.style.marginTop="20px"; app.appendChild(missionsWrap);

  function renderMissions(){
    missionsWrap.innerHTML = "";
    CLASSIFY1.forEach(function(m, idx){
      var solved = isSolved("clasifica", m.key);
      var isActive = !solved && CLASSIFY1.slice(0, idx).every(function(mm){ return isSolved("clasifica", mm.key); });
      var s = m.sys;
      var res = solveSystem3(s.a1,s.b1,s.c1,s.d1, s.a2,s.b2,s.c2,s.d2, s.a3,s.b3,s.c3,s.d3);

      }
      if(!isActive){
        card.innerHTML = '<h4 style="opacity:.5;">🔒 '+m.tag+' — '+m.title+'</h4>';
        missionsWrap.appendChild(card);
        return;
      }
      card.innerHTML =
        '<h4>🎯 '+m.tag+' — '+m.title+'</h4>'+
        '<p>'+K(systemTex3(s.a1,s.b1,s.c1,s.d1, s.a2,s.b2,s.c2,s.d2, s.a3,s.b3,s.c3,s.d3))+'</p>'+
        '<p style="font-family:var(--font-mono); font-size:.92rem; color:var(--ink-soft);">Δ = '+fmt(res.D,4)+' &nbsp; Δx = '+fmt(res.Dx,4)+' &nbsp; Δy = '+fmt(res.Dy,4)+' &nbsp; Δz = '+fmt(res.Dz,4)+'</p>';
      var grid = el("div","choice-grid");
      var opts = [
        {label:"Compatible determinado (única solución)", type:"unica"},
        {label:"Incompatible (sin solución)", type:"ninguna"},
        {label:"Compatible indeterminado (infinitas soluciones)", type:"infinitas"}
      ];
      var fb = null;
      opts.forEach(function(o){
        var btn = el("button","choice"); btn.type="button"; btn.textContent=o.label;
        btn.addEventListener("click", function(){
          Array.from(grid.children).forEach(function(x){ x.disabled=true; });
          if(o.type === res.type){
            btn.classList.add("correct");
            if(!fb) fb = feedbackBox(card);
            fb.ok("✅ Correcto. "+m.explain);
            markSolved("clasifica", m.key);
            setTimeout(renderMissions, 1100);
          } else {
            btn.classList.add("incorrect");
            if(!fb) fb = feedbackBox(card);
            fb.bad("Todavía no. Revisa Δ, Δx, Δy y Δz con el criterio de arriba.");

              Array.from(grid.children).forEach(function(x){ x.disabled=false; x.classList.remove("incorrect"); });

          }
        });
        grid.appendChild(btn);
      });

      document.getElementById("p1_next").addEventListener("click", function(){ goTo("phase2"); });

  var candA1 = {x:2,y:1,z:1}; // cumple las tres
  var candA2 = {x:1,y:1,z:1}; // falla la primera

/* Reproductor paso a paso (tipo "video") para el ejemplo resuelto de cada método:
   reproducción automática + navegación manual, con transición CSS entre pasos. */
function renderStepPlayer(container, steps){
  var state = {i:0, playing:false, timer:null};
  var stage = el("div","step-stage");
  var controls = el("div"); controls.style.cssText="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;";
  container.appendChild(stage);
  container.appendChild(controls);

  var btnPlay = el("button","btn primary sm"); btnPlay.type="button";
  var btnPrev = el("button","btn ghost sm"); btnPrev.type="button"; btnPrev.textContent="◀ Anterior";
  var btnNext = el("button","btn ghost sm"); btnNext.type="button"; btnNext.textContent="Siguiente ▶";
  controls.appendChild(btnPlay); controls.appendChild(btnPrev); controls.appendChild(btnNext);

  function stopPlay(){
    state.playing = false;
    if(state.timer){ clearInterval(state.timer); state.timer = null; }
    btnPlay.textContent = "▶ Reproducir automático";
  }
  function startPlay(){
    if(state.i >= steps.length-1) state.i = 0;
    state.playing = true;
    btnPlay.textContent = "⏸ Pausar";
    renderStep();
    state.timer = setInterval(function(){
      if(state.i < steps.length-1){ state.i++; renderStep(); } else { stopPlay(); }
    }, 2400);
  }
  function renderStep(){
    stage.innerHTML = '<div class="step-slide"><div class="step-num">Paso '+(state.i+1)+' de '+steps.length+'</div>'+
      '<div class="step-body">'+steps[state.i]+'</div></div>';
    var slide = stage.querySelector(".step-slide");
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ slide.classList.add("show"); }); });
    btnPrev.disabled = state.i===0;
    btnNext.disabled = state.i===steps.length-1;
  }
  btnPlay.addEventListener("click", function(){ if(state.playing) stopPlay(); else startPlay(); });
  btnPrev.addEventListener("click", function(){ stopPlay(); if(state.i>0){ state.i--; renderStep(); } });
  btnNext.addEventListener("click", function(){ stopPlay(); if(state.i<steps.length-1){ state.i++; renderStep(); } });
  btnPlay.textContent = "▶ Reproducir automático";
  renderStep();
  return { stop: stopPlay };
}

        '<button class="btn primary sm" data-act="check">Comprobar</button>'+

      var fb = feedbackBox(card);

        if(Math.abs(xv-d.sol.x)<0.05 && Math.abs(yv-d.sol.y)<0.05 && Math.abs(zv-d.sol.z)<0.05){
          fb.ok("✅ Correcto. La solución es "+K(pointTex3(d.sol.x,d.sol.y,d.sol.z))+".");

  function methodBlock(M, mi){
    var block = el("div");

    nextBtn.style.display="none"; nextBtn.style.marginTop="14px"; nextBtn.style.position="relative"; nextBtn.style.zIndex="1";
    nextBtn.addEventListener("click", function(){ idx++; renderCase(); });

    function resolve(chosenIsCorrect, chosenBtn, group, isCorrectIdxFn){
      Array.from(group.children).forEach(function(x, i){
        x.disabled = true;
        if(isCorrectIdxFn(i)) x.classList.add("correct");
      });
      if(!chosenIsCorrect) chosenBtn.classList.add("incorrect");
      stampEl.textContent = chosenIsCorrect ? "RESUELTO" : "CASO CERRADO";
      if(!chosenIsCorrect) stampEl.classList.add("wrong");
      stampEl.classList.add("show");
      explainBox.style.display = "block";
      explainBox.innerHTML = (chosenIsCorrect ? "✅ " : "🔍 ") + cs.explain;
      nextBtn.style.display = "inline-block";
      markSolved("investiga", cs.key);
    }

    if(cs.type === "boolean"){
      qWrap.innerHTML = '<p style="font-weight:600;">¿Es correcta esta afirmación?</p>';
      var g = el("div","choice-grid");
      [["Sí, es correcta", true],["No, tiene un error", false]].forEach(function(pair){
        var btn = el("button","choice"); btn.type="button"; btn.textContent=pair[0];
        btn._val = pair[1];
        btn.addEventListener("click", function(){
          resolve(pair[1]===cs.correct, btn, g, function(i){ return g.children[i]._val === cs.correct; });
        });
        g.appendChild(btn);
      });
      qWrap.appendChild(g);
    } else {
      qWrap.innerHTML = '<p style="font-weight:600;">'+cs.question+'</p>';
      var g2 = el("div","choice-grid");
      cs.options.forEach(function(opt, i){
        var btn = el("button","choice"); btn.type="button";
        if(cs.optionsAreMath) btn.innerHTML = K(opt); else btn.textContent = opt;
        btn.addEventListener("click", function(){
          resolve(i===cs.correctIndex, btn, g2, function(j){ return j===cs.correctIndex; });
        });
        g2.appendChild(btn);
      });
      qWrap.appendChild(g2);
    }

    dossier.appendChild(explainBox);
    dossier.appendChild(nextBtn);
    container.appendChild(dossier);

    if(cs.graph){
      var gcanvas = document.getElementById("p5_case_canvas");
      LinesGraph(gcanvas, {a1:cs.graph.a1,b1:cs.graph.b1,c1:cs.graph.c1, a2:cs.graph.a2,b2:cs.graph.b2,c2:cs.graph.c2, showSolution:true, xMin:-4, xMax:4, yMin:-4, yMax:6});
    }
  }
  renderCase();
}

function renderPhase6(app){

    "Ya no resuelves un sistema dado: tú inventas tres ecuaciones que tengan exactamente la terna objetivo como única solución.");

  var idx = 0;
  for(var i=0;i<CHALLENGES3.length;i++){
    if(!isSolved("desafio", CHALLENGES3[i].key)){ idx = i; break; }
    idx = CHALLENGES3.length;
  }
  var container = el("div"); app.appendChild(container);

  function renderChallenge(){
    container.innerHTML = "";
    if(idx >= CHALLENGES3.length){
      var done = el("div","mission-card solved");
      done.innerHTML = '<h4>'+mascotBadge("correct", 28, "mascot-inline")+'🏁 Fase 6 completa</h4>'+
        '<p>Clasificaste, verificaste, resolviste con los tres métodos, interpretaste casos reales, investigaste errores y ahora construiste tus propios sistemas a partir de una terna objetivo. Ya tienes todas las piezas — falta integrarlas en casos reales completos.</p>'+

    }
    var ch = CHALLENGES3[idx];

    var head = el("div","mission-card active");
    head.innerHTML = '<h4>🎯 Reto '+(idx+1)+' de '+CHALLENGES3.length+'</h4>'+
      '<p>Construye <strong>tres ecuaciones</strong> cuyo sistema tenga como <strong>única solución</strong> la terna <strong>'+K(pointTex3(ch.x,ch.y,ch.z))+'</strong>.</p>';
    container.appendChild(head);

    var form = el("div","panel");
    form.innerHTML = '<h3>Tus tres ecuaciones</h3>'+
      '<p style="color:var(--ink-soft); font-size:.9rem; margin-top:-4px;">Completa cada plantilla para escribir tu ecuación en la forma '+K("ax+by+cz=d")+'.</p>'+
      '<p style="font-weight:700; margin:10px 0 2px;">Ecuación 1</p>'+
      eqTemplate3HTML("p6_r1", {a:1, bMag:1, sign1:"+", cMag:1, sign2:"+", d:0}) +
      '<p style="font-weight:700; margin:14px 0 2px;">Ecuación 2</p>'+
      eqTemplate3HTML("p6_r2", {a:1, bMag:1, sign1:"-", cMag:1, sign2:"+", d:0}) +
      '<p style="font-weight:700; margin:14px 0 2px;">Ecuación 3</p>'+
      eqTemplate3HTML("p6_r3", {a:1, bMag:1, sign1:"+", cMag:1, sign2:"-", d:0}) +
      '<button class="btn primary sm" id="p6_check" style="width:100%;margin-top:14px;">Comprobar construcción</button>';
    container.appendChild(form);

    var info = el("div","panel");
    info.innerHTML =
      '<h3>¿Cumples la condición?</h3>'+
      '<div class="info-row"><span class="k">Sistema</span><span class="v eq" id="p6_eq"></span></div>'+
      '<div class="info-row"><span class="k">Tipo</span><span class="v" id="p6_tipo"></span></div>'+
      '<div class="info-row"><span class="k">Tu solución</span><span class="v" id="p6_sol"></span></div>'+
      '<div class="info-row"><span class="k">Objetivo</span><span class="v">'+K(pointTex3(ch.x,ch.y,ch.z))+'</span></div>';
    container.appendChild(info);

    var fbWrap = el("div"); fbWrap.style.marginTop="14px"; container.appendChild(fbWrap);
    var fb = feedbackBox(fbWrap);

    function tipoLabel(t){
      if(t==="unica") return '<span class="badge up">compatible determinado</span>';
      if(t==="ninguna") return '<span class="badge down">incompatible</span>';
      return '<span class="badge">compatible indeterminado</span>';
    }
    function currentState(){
      var r1 = readEqTemplate3("p6_r1"), r2 = readEqTemplate3("p6_r2"), r3 = readEqTemplate3("p6_r3");
      return {
        a1: isNaN(r1.a)?0:r1.a, b1: isNaN(r1.b)?0:r1.b, c1: isNaN(r1.c)?0:r1.c, d1: isNaN(r1.d)?0:r1.d,
        a2: isNaN(r2.a)?0:r2.a, b2: isNaN(r2.b)?0:r2.b, c2: isNaN(r2.c)?0:r2.c, d2: isNaN(r2.d)?0:r2.d,
        a3: isNaN(r3.a)?0:r3.a, b3: isNaN(r3.b)?0:r3.b, c3: isNaN(r3.c)?0:r3.c, d3: isNaN(r3.d)?0:r3.d,
        complete: r1.complete && r2.complete && r3.complete
      };
    }
    function update(){
      var st = currentState();
      document.getElementById("p6_eq").innerHTML = K(systemTex3(st.a1,st.b1,st.c1,st.d1, st.a2,st.b2,st.c2,st.d2, st.a3,st.b3,st.c3,st.d3));
      if(!st.complete){
        document.getElementById("p6_tipo").innerHTML = "—";
        document.getElementById("p6_sol").innerHTML = "—";
        return;
      }
      var sol = solveSystem3(st.a1,st.b1,st.c1,st.d1, st.a2,st.b2,st.c2,st.d2, st.a3,st.b3,st.c3,st.d3);
      document.getElementById("p6_tipo").innerHTML = tipoLabel(sol.type);
      document.getElementById("p6_sol").innerHTML = sol.type==="unica" ? K(pointTex3(sol.x,sol.y,sol.z)) : (sol.type==="ninguna" ? "∅" : "infinitas ternas");
    }
    update();
    bindEqTemplate3("p6_r1", update);
    bindEqTemplate3("p6_r2", update);
    bindEqTemplate3("p6_r3", update);

    document.getElementById("p6_check").addEventListener("click", function(){
      var st = currentState();
      if(!st.complete){
        fb.bad("Completa todos los espacios de las tres ecuaciones antes de comprobar.");
        return;
      }
      if(st.a1===0 && st.b1===0 && st.c1===0){ fb.bad("La ecuación 1 no puede tener a, b y c iguales a cero: no representaría ningún plano."); return; }
      if(st.a2===0 && st.b2===0 && st.c2===0){ fb.bad("La ecuación 2 no puede tener a, b y c iguales a cero: no representaría ningún plano."); return; }
      if(st.a3===0 && st.b3===0 && st.c3===0){ fb.bad("La ecuación 3 no puede tener a, b y c iguales a cero: no representaría ningún plano."); return; }
      var sol = solveSystem3(st.a1,st.b1,st.c1,st.d1, st.a2,st.b2,st.c2,st.d2, st.a3,st.b3,st.c3,st.d3);
      var ok = sol.type==="unica" && Math.abs(sol.x-ch.x)<0.05 && Math.abs(sol.y-ch.y)<0.05 && Math.abs(sol.z-ch.z)<0.05;
      markEqTemplate3("p6_r1", ok);
      markEqTemplate3("p6_r2", ok);
      markEqTemplate3("p6_r3", ok);
      if(ok){
        fb.ok("✅ Correcto. Tu sistema tiene exactamente "+K(pointTex3(ch.x,ch.y,ch.z))+" como única solución. (Hay infinitos sistemas que funcionan — solo debían cruzarse en esa terna.)");
        markSolved("desafio", ch.key);
        setTimeout(function(){ idx++; renderChallenge(); }, 1300);
      } else if(sol.type!=="unica"){
        fb.bad("Tus tres ecuaciones no se cruzan en un único punto ("+ (sol.type==="ninguna"?"son incompatibles entre sí":"tienen infinitas soluciones en común") +"). Cambia los coeficientes de una de ellas.");
      } else {
        fb.bad("Tu sistema tiene como solución "+K(pointTex3(sol.x,sol.y,sol.z))+", pero el objetivo es "+K(pointTex3(ch.x,ch.y,ch.z))+". Ajusta los términos independientes (d₁, d₂, d₃).");
      }
    });
  }
  renderChallenge();
}

        '<p style="margin-top:14px;font-weight:600;">Ecuación 2 — '+cs.eq2Label+'</p>'+
        eqRow("p7_2","a₂","b₂","c₂","d₂")+
        '<p style="margin-top:14px;font-weight:600;">Ecuación 3 — '+cs.eq3Label+'</p>'+
        eqRow("p7_3","a₃","b₃","c₃","d₃")+
        '<button class="btn primary sm" style="margin-top:14px;" id="p7_checkEq">Comprobar</button>';
      var fb0 = feedbackBox(body);
      document.getElementById("p7_checkEq").addEventListener("click", function(){
        var r1=readEqRow("p7_1"), r2=readEqRow("p7_2"), r3=readEqRow("p7_3");
        var ok = Math.abs(r1.a-s.a1)<0.01 && Math.abs(r1.b-s.b1)<0.01 && Math.abs(r1.c-s.c1)<0.01 && Math.abs(r1.d-s.d1)<0.01 &&
                 Math.abs(r2.a-s.a2)<0.01 && Math.abs(r2.b-s.b2)<0.01 && Math.abs(r2.c-s.c2)<0.01 && Math.abs(r2.d-s.d2)<0.01 &&
                 Math.abs(r3.a-s.a3)<0.01 && Math.abs(r3.b-s.b3)<0.01 && Math.abs(r3.c-s.c3)<0.01 && Math.abs(r3.d-s.d3)<0.01;
        if(ok){
          fb0.ok("✅ El sistema es "+K(systemTex3(s.a1,s.b1,s.c1,s.d1, s.a2,s.b2,s.c2,s.d2, s.a3,s.b3,s.c3,s.d3))+".");
          setTimeout(function(){ maxStep=1; step=1; renderCase(); }, 900);
        } else {
          fb0.bad("Todavía no coincide. Relee cada condición por separado y tradúcela término por término a la forma "+K("ax+by+cz=d")+".");
        }
      });
    } else if(step===0){
      body.innerHTML =
        '<p>Aquí, '+K("x")+' = '+cs.xLabel+', '+K("y")+' = '+cs.yLabel+' y '+K("z")+' = '+cs.zLabel+'.</p>'+
        '<div class="mission-card solved"><h4>✓ Sistema planteado</h4><p>'+K(systemTex3(s.a1,s.b1,s.c1,s.d1, s.a2,s.b2,s.c2,s.d2, s.a3,s.b3,s.c3,s.d3))+'</p></div>';
    } else if(step===1 && !isReview){
      body.innerHTML =
        '<p>Ya tienes el sistema '+K(systemTex3(s.a1,s.b1,s.c1,s.d1, s.a2,s.b2,s.c2,s.d2, s.a3,s.b3,s.c3,s.d3))+'. Resuélvelo con el método que prefieras:</p>'+
        '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;">'+
        '<div><label style="display:block;font-size:.85rem;font-weight:600;">x</label><input type="number" step="any" id="p7_x" style="width:90px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);"></div>'+
        '<div><label style="display:block;font-size:.85rem;font-weight:600;">y</label><input type="number" step="any" id="p7_y" style="width:90px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);"></div>'+
        '<div><label style="display:block;font-size:.85rem;font-weight:600;">z</label><input type="number" step="any" id="p7_z" style="width:90px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);"></div>'+
        '<button class="btn primary sm" id="p7_checkSol">Comprobar</button></div>';
      var fb1 = feedbackBox(body);
      document.getElementById("p7_checkSol").addEventListener("click", function(){
        var xv=parseFloat(document.getElementById("p7_x").value);
        var yv=parseFloat(document.getElementById("p7_y").value);
        var zv=parseFloat(document.getElementById("p7_z").value);
        if(Math.abs(xv-cs.sol.x)<0.05 && Math.abs(yv-cs.sol.y)<0.05 && Math.abs(zv-cs.sol.z)<0.05){
          fb1.ok("✅ La solución es "+K(pointTex3(cs.sol.x,cs.sol.y,cs.sol.z))+".");
          setTimeout(function(){ maxStep=2; step=2; renderCase(); }, 900);
        } else {
          fb1.bad("Todavía no. Aplica sustitución, reducción o la regla de Cramer con cuidado y vuelve a intentarlo.");
        }
      });
    } else if(step===1){
      body.innerHTML =
        '<p>Sistema del caso: '+K(systemTex3(s.a1,s.b1,s.c1,s.d1, s.a2,s.b2,s.c2,s.d2, s.a3,s.b3,s.c3,s.d3))+'</p>'+
        '<div class="mission-card solved"><h4>✓ Solución calculada</h4><p>'+K(pointTex3(cs.sol.x,cs.sol.y,cs.sol.z))+'</p></div>';
    } else if(step===2 && !isReview){
      body.innerHTML = '<p style="font-weight:600;">'+cs.interpQuestion+'</p>';
      var grid = el("div","choice-grid");
      cs.interpOptions.forEach(function(txt,i){
        var btn = el("button","choice"); btn.type="button"; btn.textContent=txt;
        btn.addEventListener("click", function(){
          Array.from(grid.children).forEach(function(x){ x.disabled=true; });
          if(i===cs.interpCorrect){
            btn.classList.add("correct");
            setTimeout(function(){ maxStep=3; step=3; renderCase(); }, 900);
          } else {
            btn.classList.add("incorrect");
            setTimeout(function(){ Array.from(grid.children).forEach(function(x){ x.disabled=false; x.classList.remove("incorrect"); }); }, 900);
          }
        });
        grid.appendChild(btn);
      });
      body.appendChild(grid);
    } else if(step===2){
      body.innerHTML = '<p style="font-weight:600;">'+cs.interpQuestion+'</p>';
      var grid2 = el("div","choice-grid");
      cs.interpOptions.forEach(function(txt,i){
        var btn2 = el("button","choice"+(i===cs.interpCorrect?" correct":"")); btn2.type="button"; btn2.textContent=txt; btn2.disabled=true;
        grid2.appendChild(btn2);
      });
      body.appendChild(grid2);
    } else if(step===3 && !isReview){
      body.innerHTML =
        '<p>Comprueba tu solución sustituyendo '+K(pointTex3(cs.sol.x,cs.sol.y,cs.sol.z))+' en cada ecuación. ¿Qué valor da el lado izquierdo de cada una?</p>'+
        '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:end;">'+
        '<div><label style="display:block;font-size:.85rem;font-weight:600;">'+K(lineTex3(s.a1,s.b1,s.c1,s.d1).split("=")[0])+' =</label><input type="number" step="any" id="p7_v1" style="width:100px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);"></div>'+
        '<div><label style="display:block;font-size:.85rem;font-weight:600;">'+K(lineTex3(s.a2,s.b2,s.c2,s.d2).split("=")[0])+' =</label><input type="number" step="any" id="p7_v2" style="width:100px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);"></div>'+
        '<div><label style="display:block;font-size:.85rem;font-weight:600;">'+K(lineTex3(s.a3,s.b3,s.c3,s.d3).split("=")[0])+' =</label><input type="number" step="any" id="p7_v3" style="width:100px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);"></div>'+
        '<button class="btn primary sm" id="p7_checkVer">Comprobar</button></div>';
      var fb3 = feedbackBox(body);
      document.getElementById("p7_checkVer").addEventListener("click", function(){
        var v1 = parseFloat(document.getElementById("p7_v1").value);
        var v2 = parseFloat(document.getElementById("p7_v2").value);
        var v3 = parseFloat(document.getElementById("p7_v3").value);
        if(Math.abs(v1-s.d1)<0.05 && Math.abs(v2-s.d2)<0.05 && Math.abs(v3-s.d3)<0.05){
          fb3.ok("✅ Las tres ecuaciones se cumplen: la solución "+K(pointTex3(cs.sol.x,cs.sol.y,cs.sol.z))+" queda verificada.");
          markSolved("aplica", cs.key);
          setTimeout(function(){ maxStep=4; step=4; renderCase(); }, 900);
        } else {
          fb3.bad("Alguno de los tres valores no coincide con el término independiente de su ecuación. Sustituye con cuidado "+K("x="+fmt(cs.sol.x))+", "+K("y="+fmt(cs.sol.y))+" y "+K("z="+fmt(cs.sol.z))+".");
        }
      });
    } else if(step===3){
      body.innerHTML =
        '<p>Sustituyendo '+K(pointTex3(cs.sol.x,cs.sol.y,cs.sol.z))+' en el sistema:</p>'+
        '<div class="mission-card solved"><h4>✓ Las tres ecuaciones se cumplen</h4></div>';
    } else {
      if(cs.boss){
        body.innerHTML =
          '<div class="mission-card solved boss-panel" style="margin-bottom:14px;">'+
          '<h4 style="display:flex;align-items:center;gap:10px;">'+mascotBadge("certificate", 32, "mascot-inline")+'🏆 ¡Jefe final derrotado!</h4>'+
          '<p>Resolviste el caso del estadio de principio a fin: planteaste el sistema, lo resolviste, interpretaste el resultado y lo verificaste. Desbloqueaste la insignia de <strong>Jefe final</strong>.</p>'+
          '<p>Sistema: '+K(systemTex3(s.a1,s.b1,s.c1,s.d1, s.a2,s.b2,s.c2,s.d2, s.a3,s.b3,s.c3,s.d3))+' · Solución: '+K(pointTex3(cs.sol.x,cs.sol.y,cs.sol.z))+'</p>'+
          '</div>'+
          '<button class="btn primary sm" style="margin-top:6px;" id="p7_nextCase">Ver resumen final →</button>';
      } else {
        body.innerHTML =
          '<div class="mission-card solved" style="margin-bottom:14px;"><h4>✓ Caso resuelto</h4>'+
          '<p>Sistema: '+K(systemTex3(s.a1,s.b1,s.c1,s.d1, s.a2,s.b2,s.c2,s.d2, s.a3,s.b3,s.c3,s.d3))+' · Solución: '+K(pointTex3(cs.sol.x,cs.sol.y,cs.sol.z))+'</p></div>'+
          '<button class="btn primary sm" style="margin-top:6px;" id="p7_nextCase">'+(idx===CASES_P7.length-1 ? "Ver resumen final →" : "Siguiente caso →")+'</button>';
      }
      document.getElementById("p7_nextCase").addEventListener("click", function(){ idx++; step=0; maxStep=0; renderCase(); });
    }

    var nav = el("div","step-nav");
    var prevBtn = el("button","btn ghost sm", "← Anterior");
    if(step===0) prevBtn.disabled = true;
    prevBtn.addEventListener("click", function(){ if(step>0) goStep(step-1); });
    nav.appendChild(prevBtn);
    if(isReview){
      var nextNavBtn = el("button","btn primary sm", "Siguiente →");
      nextNavBtn.addEventListener("click", function(){ goStep(step+1); });
      nav.appendChild(nextNavBtn);
    } else {
      nav.appendChild(el("span"));
    }
    card.appendChild(nav);
  }
  renderCase();
}

/* ============================================================
   RESUMEN FINAL Y CONSTANCIA
============================================================ */
function renderSummary(app){
  var allDone = allPhasesDone();

  var hero = el("div","hero");
  hero.innerHTML = '<div class="hero-text"><span class="eyebrow">'+(allDone?"Misión completa":"Resumen de progreso")+'</span>'+
    '<h1>'+(allDone ? "🎓 ¡Lo lograste, "+escapeHtml(student.name)+"!" : "Todavía te faltan fases por completar")+'</h1>'+
    '<p class="lead">'+(allDone
      ? "Completaste las siete fases de “Sistemas 3D: Domina las Tres Incógnitas”, incluido el caso final. Aquí tienes tu resumen, tus insignias y tu constancia de finalización."
      : "Vuelve al mapa de misión para terminar las fases pendientes; cuando completes las siete (incluido el caso final), tu constancia aparecerá aquí.")+'</p></div>'+
    '<div class="hero-art">'+(allDone ? mascotBadge("certificate", 120) : '<svg viewBox="0 0 32 32"><path d="M9 5h14v6a7 7 0 0 1-14 0z"/><path d="M9 7H5a4.5 4.5 0 0 0 4.5 6.5"/><path d="M23 7h4a4.5 4.5 0 0 1-4.5 6.5"/><line x1="16" y1="18.5" x2="16" y2="24"/><line x1="10.5" y1="28" x2="21.5" y2="28"/><line x1="16" y1="24" x2="16" y2="28"/></svg>')+'</div>';
  app.appendChild(hero);

  renderXPPanel(app);

  var total = totalMissions();
  var solved = PHASES.reduce(function(sum,ph){ return sum + phaseCompleteCount(ph.key, MISSION_TOTALS[ph.key]); }, 0);

  var statGrid = el("div","stat-grid");
  PHASES.forEach(function(ph){
    var d = phaseCompleteCount(ph.key, MISSION_TOTALS[ph.key]);
    var t = MISSION_TOTALS[ph.key];
    var tile = el("div","stat-tile");
    tile.innerHTML = '<div class="num">'+(d>=t?"✓":d+"/"+t)+'</div><div class="lbl">'+ph.label+'</div>';
    statGrid.appendChild(tile);
  });
  var totalTile = el("div","stat-tile");
  totalTile.style.borderColor = "var(--accent)";
  totalTile.innerHTML = '<div class="num">'+solved+'/'+total+'</div><div class="lbl">Retos totales</div>';
  statGrid.appendChild(totalTile);
  app.appendChild(statGrid);

  if(!allDone){
    var back = el("div","center-actions");
    back.innerHTML = '<button class="btn primary" id="sum_map">Volver al mapa de misión</button>';
    app.appendChild(back);
    back.querySelector("#sum_map").addEventListener("click", function(){ goTo("map"); });
    return;
  }

  var completedAt = getCompletedAt();
  var dateStr = "";
  try{
    dateStr = new Date(completedAt || Date.now()).toLocaleDateString("es-PE", {day:"numeric", month:"long", year:"numeric"});
  }catch(e){ dateStr = ""; }

  var printBar = el("div","center-actions no-print");
  printBar.innerHTML = '<button class="btn primary" id="sum_print">🖨️ Guardar como PDF / imprimir</button>'+
    '<button class="btn ghost" id="sum_map2">Volver al mapa de misión</button>';
  app.appendChild(printBar);
  printBar.querySelector("#sum_print").addEventListener("click", function(){ window.print(); });
  printBar.querySelector("#sum_map2").addEventListener("click", function(){ goTo("map"); });

  var cert = el("div","cert-card");
  cert.id = "certCard";
  var carreraTxt = student.carrera === "Otra" ? "Pensamiento Matemático" : student.carrera;
  cert.innerHTML =
    '<div class="cert-inner">'+
      '<div class="cert-seal">'+mascotBadge("certificate", 60)+'</div>'+
      '<div class="cert-eyebrow">Constancia de finalización</div>'+
      '<div class="cert-title">Misión: Sistemas 3D — Tres Incógnitas</div>'+
      '<div class="cert-role">Se certifica que</div>'+
      '<div class="cert-name">'+escapeHtml(student.name)+'</div>'+
      '<div class="cert-role">estudiante de '+escapeHtml(carreraTxt)+'</div>'+
      '<p class="cert-body">completó exitosamente las siete fases del curso de Pensamiento Matemático — Clasifica, Verifica, Resuelve, Interpreta, Investiga, Desafío y Aplica — resolviendo '+total+' retos sobre clasificación, verificación, métodos de resolución (sustitución, reducción y regla de Cramer), interpretación y aplicación integral de sistemas de ecuaciones lineales con tres incógnitas, incluido el caso final. Nivel alcanzado: '+currentLevelInfo(totalXP()).name+'.</p>'+
      '<div class="cert-sig">Curso de Pensamiento Matemático</div>'+
      '<div class="cert-date">'+(dateStr||"")+'</div>'+
    '</div>';
  app.appendChild(cert);

  var badgesPanel = el("div","panel no-print"); badgesPanel.style.marginTop="18px";
  badgesPanel.innerHTML = '<h3>Tu vitrina de insignias</h3>';
  var badgeRow = el("div","badge-row");
  PHASES.forEach(function(ph){
    var chip = el("div","badge-chip unlocked");
    chip.innerHTML = '<span class="badge-circle">'+PHASE_ICONS[ph.id]+'</span><span class="badge-label">'+ph.label+'</span>';
    badgeRow.appendChild(chip);
  });
  var bossChip = el("div","badge-chip boss unlocked");
  bossChip.innerHTML = '<span class="badge-circle">'+ICON_BOSS+'</span><span class="badge-label">Jefe final</span>';
  badgeRow.appendChild(bossChip);
  var masterChip = el("div","badge-chip boss unlocked");
  masterChip.innerHTML = '<span class="badge-circle">'+ICON_MASTER+'</span><span class="badge-label">Maestro</span>';
  badgeRow.appendChild(masterChip);
  badgesPanel.appendChild(badgeRow);
  app.appendChild(badgesPanel);
}

var PHASE_RENDERERS = {1:renderPhase1, 2:renderPhase2, 3:renderPhase3, 4:renderPhase4, 5:renderPhase5, 6:renderPhase6, 7:renderPhase7};

goTo(student ? "map" : "register");
})();
</script>
